<script>
/* ---------- Vistas guardadas de Reservas (por usuario) ---------- */
const CAMPOS_VISTA = ['q', 'desde', 'hasta', 'alta_desde', 'alta_hasta', 'agencia', 'asesor', 'aerolinea', 'vuelo', 'grupo', 'origen', 'tipo', 'estado'];
let VISTAS_RV_GUARDADAS = [];
async function cargarVistasGuardadas() { const r = await api('/api/op/vistas'); VISTAS_RV_GUARDADAS = r.ok ? r.data : []; }
function barraVistas() {
  return `<div class="vistas-g">${VISTAS_RV_GUARDADAS.map(v => `<span class="vista-chip" data-vista-aplicar="${v.id}">${esc(v.nombre)}<button class="vista-x" data-vista-quitar="${v.id}" title="Quitar esta vista" aria-label="Quitar">×</button></span>`).join('')}<button class="vista-chip nueva" data-vista-nueva>+ Guardar vista actual</button></div>`;
}
document.addEventListener('click', async ev => {
  const apl = ev.target.closest('[data-vista-aplicar]');
  if (apl && !ev.target.closest('[data-vista-quitar]')) {
    const v = VISTAS_RV_GUARDADAS.find(x => String(x.id) === apl.dataset.vistaAplicar);
    if (!v) return;
    for (const k of CAMPOS_VISTA) RV[k] = (v.filtros && v.filtros[k]) !== undefined ? v.filtros[k] : (Array.isArray(RV[k]) ? [] : '');
    await cargarReservas();
    return;
  }
  const quitar = ev.target.closest('[data-vista-quitar]');
  if (quitar) {
    ev.preventDefault();
    if (!confirm('¿Quitar esta vista guardada?')) return;
    const r = await api('/api/op/vistas/quitar', { id: Number(quitar.dataset.vistaQuitar) });
    if (!r.ok) return aviso(r.data.error || 'No se pudo quitar.');
    await cargarVistasGuardadas(); pintarReservas();
    return;
  }
  if (ev.target.closest('[data-vista-nueva]')) {
    const filtros = {};
    for (const k of CAMPOS_VISTA) filtros[k] = RV[k];
    const nombre = prompt('Nombre para esta vista (por ejemplo: Sin precio de Lujor):');
    if (!nombre || !nombre.trim()) return;
    const r = await api('/api/op/vistas', { nombre: nombre.trim(), filtros });
    if (!r.ok) return aviso(r.data.error || 'No se pudo guardar la vista.');
    await cargarVistasGuardadas(); pintarReservas();
    aviso('Vista guardada. Solo tú la ves.');
  }
});

/* ---------- Atajos de teclado ---------- */
let filaAct = -1;
function filasVista() { return [...document.querySelectorAll('#vista tr.fila')]; }
function marcarFila(filas) {
  filas.forEach(f => f.classList.remove('fila-activa'));
  const f = filas[filaAct];
  if (f) { f.classList.add('fila-activa'); f.scrollIntoView({ block: 'nearest' }); }
}
function abrirAtajos() {
  if (document.getElementById('atajos')) return cerrarAtajos();
  const d = document.createElement('div');
  d.id = 'atajos'; d.className = 'atajos-fondo';
  d.innerHTML = `<div class="atajos-caja"><b>Atajos de teclado</b><div class="atajos-lista">
    <kbd>↑</kbd><span>↓ fila anterior o siguiente</span><kbd>Enter</kbd><span>abrir la fila marcada</span>
    <kbd>A</kbd><span>asignar la fila marcada</span><kbd>/</kbd><span>ir a la búsqueda</span>
    <kbd>Esc</kbd><span>cerrar lo que está abierto</span><kbd>?</kbd><span>mostrar u ocultar esta lista</span></div></div>`;
  d.onclick = e => { if (e.target === d) cerrarAtajos(); };
  document.body.appendChild(d);
}
function cerrarAtajos() { const d = document.getElementById('atajos'); if (d) d.remove(); }
document.addEventListener('keydown', ev => {
  const t = ev.target;
  if (t && (/INPUT|SELECT|TEXTAREA/.test(t.tagName) || t.isContentEditable)) { if (ev.key === 'Escape') t.blur(); return; }
  if (ev.key === '?') { ev.preventDefault(); return abrirAtajos(); }
  if (ev.key === '/') { const b = document.querySelector('#vista #rvQ, #vista #blQ'); if (b) { ev.preventDefault(); b.focus(); } return; }
  if (ev.key === 'Escape') { cerrarLat(); cerrarPop(); cerrarAtajos(); return; }
  const filas = filasVista();
  if (!filas.length) return;
  if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
    ev.preventDefault();
    filaAct = Math.min(filas.length - 1, Math.max(0, filaAct + (ev.key === 'ArrowDown' ? 1 : -1)));
    marcarFila(filas); return;
  }
  if (ev.key === 'Enter' && filaAct >= 0 && filas[filaAct]) { ev.preventDefault(); filas[filaAct].click(); return; }
  if ((ev.key === 'a' || ev.key === 'A') && filaAct >= 0 && filas[filaAct]) {
    const asig = filas[filaAct].querySelector('.asig');
    if (asig) { ev.preventDefault(); asig.click(); }
  }
});

/* ---------- Tablero: arrastrar una tarjeta a otra columna cambia su estado ---------- */
let arrastrando = null;
const ESTADOS_TABLERO_ARRASTRE = ['en_camino', 'en_sitio', 'recogido', 'completado'];
document.addEventListener('dragstart', ev => {
  const t = ev.target.closest && ev.target.closest('[data-tab-id]');
  if (!t) return;
  arrastrando = { id: Number(t.dataset.tabId), estado: t.dataset.tabEstado };
  ev.dataTransfer.effectAllowed = 'move';
});
document.addEventListener('dragover', ev => { if (arrastrando && ev.target.closest && ev.target.closest('[data-col]')) ev.preventDefault(); });
document.addEventListener('drop', async ev => {
  const col = ev.target.closest && ev.target.closest('[data-col]');
  if (!arrastrando || !col) return;
  ev.preventDefault();
  const de = arrastrando; arrastrando = null;
  const destino = col.dataset.col;
  if (destino === de.estado) return;
  if (!ESTADOS_TABLERO_ARRASTRE.includes(destino)) return aviso('Para asignar, abre el servicio y elige chofer o transportista.');
  const r = await api('/api/op/estado-servicio', { id: de.id, estado: destino });
  if (!r.ok) return aviso(r.data.error || 'No se pudo cambiar el estado.');
  aviso('Estado cambiado.');
  await cargar(); pintarTablero();
});
</script>

<body>
<div class="app" id="app" style="display:none">
  <aside id="menu"></aside>
  <main id="vista"></main>
</div>
<div id="prox" style="display:none"></div>
<div class="fondo" id="fondo"></div>
<div class="panel-lat" id="lat"></div>
<div class="v-min" id="vMin" style="display:none" title="Volver a abrir"><b>&#9635;</b><span></span><button data-vmin-x title="Cerrar">&#10005;</button></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dinero = n => n === null || n === undefined || n === '' ? '—' : 'US$ ' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const iniciales = n => String(n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(x => x[0]).join('').toUpperCase();
const COLORES = ['#1f5fae', '#0f9d6b', '#c98a12', '#6d4bd8', '#d92d4b', '#0e7490', '#9333ea', '#475569'];
const colorDe = id => COLORES[(Number(id) || 0) % COLORES.length];
const minutos = h => { const m = String(h || '').match(/(\d{1,2}):(\d{2})/); return m ? Number(m[1]) * 60 + Number(m[2]) : null; };
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const fechaLarga = f => { if (!f) return 'Sin fecha'; const d = new Date(f + 'T12:00:00'); return `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`; };
const fechaCorta = f => { if (!f) return '—'; const d = new Date(f + 'T12:00:00'); return `${d.getDate()} ${MESES[d.getMonth()].slice(0, 3)}`; };
const masDias = (f, n) => { const d = new Date(f + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const TIPO = { IN: ['plane-landing', 'Llegada', 't-ve'], OUT: ['plane-takeoff', 'Salida', 't-az'], ACTIVIDAD: ['ticket', 'Tour / actividad', 't-vi'], INTERHOTEL: ['route', 'Inter-hotel', 't-vi'], OTRO: ['circle-dot', 'Servicio', 't-gr'] };
let I = null, S = { vista: 'hoy', fecha: '', sede: '', filtro: 'por_asignar', q: '', sel: new Set(), servicios: [], ubicaciones: [], sinFecha: 0 };
const timers = {};

async function api(url, cuerpo) {
  const r = await fetch(url, cuerpo === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo) });
  let d = {}; try { d = await r.json(); } catch (e) {}
  if (r.status === 401) { location.href = '/'; }
  return { ok: r.ok, status: r.status, data: d };
}
function aviso(t, ms = 3800) { const el = $('#toast'); el.textContent = t; el.classList.add('v'); clearTimeout(timers.t); timers.t = setTimeout(() => el.classList.remove('v'), ms); }
function tema(oscuro) { document.body.classList.toggle('oscuro', oscuro); try { localStorage.setItem('opTema', oscuro ? 'oscuro' : 'claro'); } catch (e) {} }

async function iniciar() {
  try { tema(localStorage.getItem('opTema') === 'oscuro'); } catch (e) {}
  const r = await api('/api/op/inicio');
  if (r.status === 403 && r.data.proximamente) return proximamente();
  if (!r.ok) { document.body.innerHTML = `<div class="prox"><h2>No se pudo abrir Operaciones</h2><p>${esc(r.data.error || '')}</p><a href="/">Volver</a></div>`; return; }
  I = r.data;
  S.fecha = I.hoy;
  try { const g = JSON.parse(localStorage.getItem('opEstado') || '{}'); if (g.sede !== undefined) S.sede = g.sede; if (g.vista && puedeVista(g.vista)) S.vista = g.vista; } catch (e) {}
  $('#app').style.display = '';
  pintarMenu();
  ir(S.vista);
}
function proximamente() {

function htmlGantt() {
  const ini = 4 * 60, fin = 24 * 60, ancho = fin - ini;
  const pos = m => Math.max(0, Math.min(100, (m - ini) / ancho * 100));

  const usados = new Map();
  for (const x of S.servicios.filter(s => s.estado !== 'cancelado' && s.inicio !== null && (s.chofer_id || s.proveedor_id))) {
    const k = x.chofer_id ? 'c' + x.chofer_id : 'p' + x.proveedor_id;
    if (!usados.has(k)) usados.set(k, { nombre: x.chofer || x.proveedor, sub: x.chofer ? (x.vehiculo || 'propio') : 'transportista', lista: [] });
    usados.get(k).lista.push(x);

  }

      L.marker([u.lat, u.lng], { icon: icono }).addTo(mapa); pts.push([u.lat, u.lng]);
    }
    if (pts.length) mapa.fitBounds(pts, { padding: [40, 40], maxZoom: 11 });
  });
}

function prepararPiezas() {

    if (p.tipo === 'TRANSPORTE') p.fechas = Array.from({ length: p.dias || 1 }, (_, i) => masDias(PQ.desde, 1 + i));
    if (p.tipo === 'ACTIVIDAD' && !p.fecha) p.fecha = masDias(PQ.desde, 1);
  }

      ${p.tipo === 'ENTRADA' ? `<div class="dias">${(p.fechas || []).map((f, k) => `<span class="dia"><input type="date" data-pfecha="${i}:${k}" value="${f}" style="width:120px"><input data-pparque="${i}:${k}" value="${esc((p.parquesDia || [])[k] || '')}" placeholder="Parque"></span>`).join('')}</div>` : ''}

async function cotizar() {
  leerPaquete();
  const r = await api('/api/op/paquete/cotizar', { agencia_id: PQ.agencia_id, adultos: PQ.adultos, ninos: PQ.ninos, infantes: PQ.infantes, hotel: PQ.hotel, aeropuerto: PQ.aeropuerto, desde: PQ.desde,
    piezas: PQ.piezas.map(p => ({ ...p, fecha: p.tipo === 'OUT' ? PQ.hasta : p.fechas ? p.fechas[0] : p.fecha || PQ.desde })) });
  if (!r.ok) { $('#pqPrecio').innerHTML = `<div class="sub2">${esc(r.data.error || '')}</div>`; return; }
  PQ.cot = r.data;
  pintarPiezas();
  $('#pqPrecio').innerHTML = `<h3>${ic('wallet')}Precio del paquete</h3><div class="linea"><span>Venta</span><b>${dinero(r.data.venta)}</b></div>${I.permisos.ver_precios ? `<div class="linea"><span>Costo</span><b>${dinero(r.data.costo)}</b></div><div class="linea"><span>Ganancia</span><b style="color:var(--verde)">${dinero(r.data.ganancia)}${r.data.venta ? ' · ' + Math.round(r.data.ganancia / r.data.venta * 100) + '%' : ''}</b></div>` : ''}
    <div class="linea tot"><span>Total al cliente</span><b>${dinero(r.data.venta)}</b></div><div class="sub2">${esc(r.data.tarifario)}${r.data.faltan ? ` · <b style="color:var(--rojo)">${r.data.faltan} pieza(s) sin tarifa</b>` : ''}</div>`;
}
async function crearPaquete() {
  leerPaquete();
  if (!PQ.cliente) return aviso('Escribe el nombre del cliente.');
  const lin = (PQ.cot && PQ.cot.lineas) || [];
  const servicios = [];
  PQ.piezas.forEach((p, i) => {
    const l = lin[i] || {};
    if (p.opcional && !p.incluir) return;
    if (p.tipo === 'IN') servicios.push({ tipo: 'IN', fecha: PQ.desde, hora: PQ.hora_llega, vuelo: PQ.vuelo_llega, aeropuerto: PQ.aeropuerto, precio: l.precio, costo: l.costo, tarifa: l.tarifa });
    else if (p.tipo === 'OUT') servicios.push({ tipo: 'OUT', fecha: PQ.hasta, hora: PQ.hora_sale, vuelo: PQ.vuelo_sale, aeropuerto: PQ.aeropuerto, precio: l.precio, costo: l.costo, tarifa: l.tarifa });
    else if (p.tipo === 'ENTRADA' || p.tipo === 'EXTRA') servicios.push({ tipo: 'ACTIVIDAD', clase: 'entrada', fecha: (p.fechas || [PQ.desde])[0] || PQ.desde, actividad: `Entradas: ${p.nombre}${p.parquesDia && p.parquesDia.length ? ' (' + p.fechas.map((f, k) => fechaCorta(f) + ' ' + (p.parquesDia[k] || '')).join(', ') + ')' : ''}`, precio: l.precio, costo: l.costo, tarifa: l.tarifa });
    else if (p.tipo === 'TRANSPORTE') { const fs = p.fechas || [PQ.desde]; const ent = PQ.piezas.find(x => x.tipo === 'ENTRADA'); fs.forEach((f, k) => servicios.push({ tipo: 'ACTIVIDAD', fecha: f, hora: '08:00', actividad: `${p.nombre}${ent && ent.parquesDia && ent.parquesDia[k] ? ' · ' + ent.parquesDia[k] : ''}`, precio: l.precio === null || l.precio === undefined ? null : Math.round(l.precio / fs.length * 100) / 100, costo: l.costo === null || l.costo === undefined ? '' : Math.round(l.costo / fs.length * 100) / 100, tarifa: l.tarifa })); }
    else servicios.push({ tipo: 'ACTIVIDAD', fecha: p.fecha || PQ.desde, hora: '08:00', actividad: p.nombre, precio: l.precio, costo: l.costo, tarifa: l.tarifa });
  });
  const ag = I.agencias.find(a => String(a.id) === String(PQ.agencia_id));
  const r = await api('/api/op/reserva', { agencia: ag ? ag.nombre : 'Directo (oficina)', cliente: PQ.cliente, telefono: PQ.telefono, adultos: PQ.adultos, ninos: PQ.ninos, infantes: PQ.infantes, hotel: PQ.hotel, referencia: 'Paquete ' + ((I.paquetes.find(p => p.id === PQ.plantilla) || {}).nombre || ''), servicios });
  if (!r.ok) return aviso(r.data.error || 'No se pudo crear');
  aviso(`✔ Paquete reservado: #${r.data.reserva} con ${r.data.servicios} servicio(s).`);
  imprimirCotizacion(true);
  PQ = null;
}

  conductor: ['Conductor', x => x.chofer || x.proveedor || 'SIN ASIGNAR'] };

// Tipo de tarifa en palabras, para la proforma.
function tipoTarifa(x) {

}
const nombreServicio = x => x.tipo === 'IN' ? `Llegada${x.vuelo ? ' · vuelo ' + x.vuelo : ''}` : x.tipo === 'OUT' ? `Salida${x.vuelo ? ' · vuelo ' + x.vuelo : ''}` : x.tipo === 'INTERHOTEL' ? 'Inter-hotel' : (x.actividad || 'Servicio');

async function documentosDe(id) {
  const r = await api('/api/op/documentos?id=' + id);
  if (!r.ok) { aviso(r.data.error || 'No se pudo leer la reserva.'); return null; }
  r.data.servicios = r.data.servicios.filter(x => x.estado !== 'cancelado').sort((a, b) => (a.fecha + (a.recogida || a.hora)).localeCompare(b.fecha + (b.recogida || b.hora)));
  if (!r.data.servicios.length) { aviso('Esta reserva no tiene servicios activos.'); return null; }
  return r.data;
}

async function subirExcel(input, cuerpo) {
  const f = input.files[0]; if (!f) return;
  const b64 = await new Promise(ok => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.readAsDataURL(f); });
  const r = await api('/api/op/config/importar', { ...cuerpo, base64: b64 });
  aviso(r.ok ? `✔ Importadas ${r.data.importadas} filas de la hoja "${r.data.hoja}".` : r.data.error, 6000);
  if (r.ok) vConfig();
}

function repintarDia() { S.vista === 'vivo' ? pintarVivo() : S.vista === 'hoy' ? pintarHoy() : pintarOperaciones(); }
const ahoraMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const hhmm = m => `${String(Math.floor(((m % 1440) + 1440) % 1440 / 60)).padStart(2, '0')}:${String(((m % 60) + 60) % 60).padStart(2, '0')}`;
function faltan(min) {
  if (min < 0) return 'ya empezó';
  const h = Math.floor(min / 60), m = min % 60;
  return h ? `en ${h} h ${String(m).padStart(2, '0')} min` : `en ${m} min`;
}
// Bloques de Hoy: cada persona elige los suyos (se guarda en su navegador).
const BLOQUES_HOY = [
  ['urgente', 'Lo urgente (sin asignar en las próximas 3 horas)', true], ['proximas', 'Próxima llegada y próxima salida', true],
  ['numeros', 'Números del día', true], ['porhora', 'El día por hora (gráfica)', true], ['listas', 'Llegadas y salidas', true],
  ['tours', 'Tours e inter-hotel', true], ['agencias', 'Pasajeros por agencia (gráfica)', false], ['quien', 'Por chofer y transportista', false],
  ['proximos', 'Los próximos 7 días', false], ['vuelos', 'Vuelos con novedad (retrasos, cancelados)', false]];
const claveHoy = () => 'opHoy:' + ((I && I.usuario && I.usuario.usuario) || '');
function bloquesHoy() {
  let g = null; try { g = JSON.parse(localStorage.getItem(claveHoy()) || 'null'); } catch (e) {}
  return Object.fromEntries(BLOQUES_HOY.map(([k, , def]) => [k, g && k in g ? Boolean(g[k]) : def]));
}
function guardarBloquesHoy(b) { try { localStorage.setItem(claveHoy(), JSON.stringify(b)); } catch (e) {} }
let PROX = null;
async function cargarProximos() {
  const r = await api(`/api/op/servicios?desde=${masDias(I.hoy, 1)}&hasta=${masDias(I.hoy, 7)}${S.sede ? '&sede=' + encodeURIComponent(S.sede) : ''}`);
  PROX = r.ok ? r.data.servicios.filter(x => x.estado !== 'cancelado' && x.clase === 'transporte') : [];

async function vHoy() {
  $('#vista').innerHTML = '<div class="vacio">Cargando…</div>';
  if (S.filtro === 'sin_fecha') S.filtro = 'por_asignar';
  await Promise.all([cargar(), bloquesHoy().proximos ? cargarProximos() : null]);
  pintarHoy();
  timers.reloj = setInterval(() => { if (S.vista !== 'hoy') return; const r = $('#reloj'); if (r) r.textContent = hhmm(ahoraMin()); document.querySelectorAll('[data-cuenta]').forEach(el => { el.textContent = faltan(Number(el.dataset.cuenta) - ahoraMin()); }); }, 20000);
}
function pintarHoy() {
  const esHoy = S.fecha === I.hoy, ahora = esHoy ? ahoraMin() : -1;
  const t = S.servicios.filter(x => x.estado !== 'cancelado' && x.clase === 'transporte');
  const ini = x => (x.inicio === null || x.inicio === undefined ? 9999 : x.inicio);
  const llegadas = t.filter(x => x.tipo === 'IN').sort((a, b) => ini(a) - ini(b));
  const salidas = t.filter(x => x.tipo === 'OUT').sort((a, b) => ini(a) - ini(b));
  const otros = t.filter(x => !['IN', 'OUT'].includes(x.tipo)).sort((a, b) => ini(a) - ini(b));
  const pendientes = t.filter(x => x.estado === 'por_asignar');
  const urgentes = esHoy ? pendientes.filter(x => ini(x) >= ahora - 30 && ini(x) <= ahora + 180).sort((a, b) => ini(a) - ini(b)) : [];
  const prox = l => l.find(x => ini(x) >= (esHoy ? ahora : 0) && ini(x) < 9999);
  const pl = prox(llegadas), ps = prox(salidas);
  const pax = l => l.reduce((a, x) => a + x.pax_total, 0);
  const tarjetaProxima = (x, titulo) => {
    if (!x) return `<div class="hoy-prox vacia"><small>${titulo}</small><b>Nada más ${esHoy ? 'por hoy' : 'este día'}</b></div>`;
    const quien = x.chofer || x.proveedor;
    return `<div class="hoy-prox" data-abrir="${x.id}"><small>${titulo}</small>
      <div class="hoy-cuando"><b>${esc(x.tipo === 'OUT' ? x.recogida || x.hora : x.hora)}</b>${esHoy ? `<span data-cuenta="${ini(x)}">${faltan(ini(x) - ahora)}</span>` : ''}</div>
      <div class="hoy-quien">${esc(x.cliente || 'Sin nombre')}</div>
      <div class="hoy-det">${x.vuelo ? esc(x.vuelo) + ' · ' : ''}${x.pax_total} pax · ${esc(x.desde)} → ${esc(x.hasta)}</div>
      <div class="hoy-asig ${quien ? '' : 'falta'}">${quien ? ic('user-check') + esc(quien) : ic('triangle-alert') + 'Sin asignar'}</div></div>`;
  };
  const fila = x => {
    const quien = x.chofer || x.proveedor, pasado = esHoy && ini(x) < ahora - 20;
    const v = x.vuelo_vivo;
    return `<div class="hoy-fila ${pasado ? 'pasado' : ''}" data-abrir="${x.id}">
      <div class="h">${esc(x.tipo === 'OUT' ? x.recogida || x.hora : x.hora)}${x.tipo === 'OUT' && x.hora ? `<small>vuelo ${esc(x.hora)}</small>` : ''}</div>
      <div class="c"><b>${esc(x.cliente || 'Sin nombre')}</b><small>${x.vuelo ? esc(x.vuelo) + (v && v.retraso_min > 10 ? ` <span style="color:var(--ambar)">+${v.retraso_min} min</span>` : '') + ' · ' : ''}${esc(x.agencia || '')}</small></div>
      <div class="p">${x.pax_total}<small>pax</small></div>
      <div class="l">${esc(x.tipo === 'OUT' ? x.desde : x.hasta)}</div>
      <div class="a ${quien ? '' : 'falta'}">${quien ? esc(quien) : 'Sin asignar'}</div></div>`;
  };
  // Pasajeros por hora (llegadas por la hora del vuelo, salidas por la hora de recogida).
  const porHora = l => { const h = Array(24).fill(0); for (const x of l) if (ini(x) < 1440) h[Math.floor(ini(x) / 60)] += x.pax_total; return h; };
  const hIn = porHora(llegadas), hOut = porHora(salidas), max = Math.max(1, ...hIn, ...hOut);
  const W = 960, H = 120, col = W / 24;
  const barras = hIn.map((n, i) => {
    const a = Math.round(n / max * (H - 26)), b = Math.round(hOut[i] / max * (H - 26));
    return `${n ? `<rect x="${i * col + 6}" y="${H - 14 - a}" width="${col / 2 - 7}" height="${a}" rx="3" class="b-in"><title>${n} pax llegando · ${String(i).padStart(2, '0')}:00</title></rect><text x="${i * col + col / 4 + 0.5}" y="${H - 18 - a}" class="n">${n}</text>` : ''}
      ${hOut[i] ? `<rect x="${i * col + col / 2 + 1}" y="${H - 14 - b}" width="${col / 2 - 7}" height="${b}" rx="3" class="b-out"><title>${hOut[i]} pax saliendo · ${String(i).padStart(2, '0')}:00</title></rect><text x="${i * col + col * 3 / 4 - 2.5}" y="${H - 18 - b}" class="n">${hOut[i]}</text>` : ''}
      ${i % 3 === 0 ? `<text x="${i * col + 2}" y="${H - 1}" class="e">${String(i).padStart(2, '0')}</text>` : ''}`;
  }).join('');
  const linea = esHoy ? `<line x1="${ahora / 60 * col}" x2="${ahora / 60 * col}" y1="4" y2="${H - 12}" class="ahora"/>` : '';
  const sinFechaAviso = S.sinFecha ? `<button class="hoy-nota" data-ir-filtro="sin_fecha">${ic('calendar')}${S.sinFecha} servicio(s) registrados sin fecha: complétalos</button>` : '';
  const B = bloquesHoy();
  // Barras horizontales sencillas (agencias, choferes).
  const barras2 = (l, color) => { const m = Math.max(1, ...l.map(x => x.v)); return l.map(x => `<div class="hb"><span class="hb-n" title="${esc(x.k)}">${esc(x.k)}</span><div class="hb-b"><i style="width:${Math.max(3, x.v / m * 100)}%;background:${color}"></i></div><b>${x.v}</b>${x.sub ? `<small>${esc(x.sub)}</small>` : ''}</div>`).join(''); };
  const agrupa = (f) => { const m = new Map(); for (const x of t) { const k = f(x); if (!m.has(k)) m.set(k, { k, v: 0, n: 0, sin: 0 }); const o = m.get(k); o.v += x.pax_total; o.n++; if (x.estado === 'por_asignar') o.sin++; } return [...m.values()].sort((a, b) => b.v - a.v); };
  const porAgencia = agrupa(x => x.agencia || 'Sin agencia').slice(0, 10).map(x => ({ ...x, sub: `${x.n} serv.` }));
  const porQuien = agrupa(x => x.chofer || x.proveedor || 'Sin asignar').map(x => ({ ...x, sub: `${x.n} serv.` }));
  const vuelosNov = t.filter(x => x.vuelo_vivo && (x.vuelo_vivo.retraso_min > 10 || ['cancelado', 'desviado'].includes(x.vuelo_vivo.estado)));

// Abre la ficha de un servicio aunque sea de otro día.
async function abrirServicio(id, fecha) {

function rangoGN() {
  const h = I.hoy, [y, m] = h.split('-').map(Number);
  const ini = (yy, mm) => `${yy}-${String(mm).padStart(2, '0')}-01`;
  const finMes = (yy, mm) => masDias(mm === 12 ? ini(yy + 1, 1) : ini(yy, mm + 1), -1);
  if (GN.rango === 'mes') return [ini(y, m), h];
  if (GN.rango === 'pasado') { const yy = m === 1 ? y - 1 : y, mm = m === 1 ? 12 : m - 1; return [ini(yy, mm), finMes(yy, mm)]; }
  if (GN.rango === '7') return [masDias(h, -6), h];
  if (GN.rango === '30') return [masDias(h, -29), h];
  if (GN.rango === 'anio') return [`${y}-01-01`, h];
  return [GN.desde || ini(y, m), GN.hasta || h];
}
async function vGanancias() {
  $('#vista').innerHTML = '<div class="vacio">Cargando…</div>';
  if (!I.permisos.ver_administracion) { await cargarPagos(); $('#vista').innerHTML = htmlPagos(); return; }
  const [desde, hasta] = rangoGN();
  const r = await api(`/api/op/admin/ganancias?desde=${desde}&hasta=${hasta}${S.sede ? '&sede=' + encodeURIComponent(S.sede) : ''}`);
  if (!r.ok) { $('#vista').innerHTML = `<div class="vacio">${esc(r.data.error || 'No se pudo cargar')}</div>`; return; }
  GN.datos = r.data; pintarGanancias();
  await cargarPagos(); $('#vista').insertAdjacentHTML('beforeend', htmlPagos());
}
function selectorRango(id) {
  return `<div class="seg" id="${id}">${[['7', '7 días'], ['30', '30 días'], ['mes', 'Este mes'], ['pasado', 'Mes pasado'], ['anio', 'Este año'], ['otro', 'Fechas']].map(([k, n]) => `<button class="${GN.rango === k ? 'a' : ''}" data-gn-rango="${k}">${n}</button>`).join('')}</div>
    ${GN.rango === 'otro' ? `<div class="fecha"><input type="date" data-gn-f="desde" value="${GN.desde}"><span class="sub2">a</span><input type="date" data-gn-f="hasta" value="${GN.hasta}"></div>` : ''}`;
}
function pintarGanancias() {
  const d = GN.datos, t = d.total;
  const cambio = (a, b) => (b ? Math.round((a - b) / Math.abs(b) * 100) : null);
  const cv = cambio(t.venta, d.anterior.venta), cg = cambio(t.ganancia, d.anterior.ganancia);
  const flecha = c => c === null ? '<small class="sub2">sin datos del período anterior</small>' : `<small class="${c >= 0 ? 'sube' : 'baja'}">${c >= 0 ? '▲' : '▼'} ${Math.abs(c)}% vs. período anterior</small>`;
  // Todos los días (o meses) del rango, también los que no tienen ventas.
  const nDias = Math.round((new Date(d.hasta) - new Date(d.desde)) / 864e5) + 1, porMes = nDias > 62;
  const vacio = k => ({ k, venta: 0, ganancia: 0, servicios: 0 });
  const serie = [];
  if (porMes) { const m = new Map(d.meses.map(x => [x.k, x])); for (let f = d.desde.slice(0, 7); f <= d.hasta.slice(0, 7); f = masDias(f + '-28', 7).slice(0, 7)) serie.push(m.get(f) || vacio(f)); }
  else { const m = new Map(d.dias.map(x => [x.k, x])); for (let f = d.desde; f <= d.hasta; f = masDias(f, 1)) serie.push(m.get(f) || vacio(f)); }
  const W = 960, H = 200, max = Math.max(1, ...serie.map(x => x.venta)), col = W / Math.max(serie.length, 1), bw = Math.min(col * 0.64, 34);
  const barras = serie.map((x, i) => {
    const hv = Math.round(x.venta / max * (H - 34)), hg = Math.max(0, Math.round(x.ganancia / max * (H - 34)));
    const etiqueta = porMes ? MESES[Number(x.k.slice(5, 7)) - 1].slice(0, 3) : String(Number(x.k.slice(8, 10)));
    const cada = Math.ceil(serie.length / 16);
    return `<g><title>${porMes ? MESES[Number(x.k.slice(5, 7)) - 1] + ' ' + x.k.slice(0, 4) : fechaLarga(x.k)}: venta ${dinero(x.venta)} · ganancia ${dinero(x.ganancia)} · ${x.servicios} servicios</title>
      <rect x="${i * col + (col - bw) / 2}" y="${H - 18 - hv}" width="${bw}" height="${hv}" rx="3" class="g-venta"/>
      <rect x="${i * col + (col - bw) / 2}" y="${H - 18 - hg}" width="${bw}" height="${hg}" rx="3" class="g-gan"/>
      ${i % cada === 0 ? `<text x="${i * col + col / 2}" y="${H - 3}" class="e" text-anchor="middle">${etiqueta}</text>` : ''}</g>`;
  }).join('');
  const tabla = (titulo, l, col1) => `<div class="caja"><h3>${titulo}</h3>${l.length ? `<table class="t-compacta"><thead><tr><th>${col1}</th><th style="text-align:right">Venta</th><th style="text-align:right">Ganancia</th><th style="text-align:right">Margen</th></tr></thead><tbody>
    ${l.map(x => `<tr><td><b>${esc(x.k)}</b><br><small class="sub2">${x.reservas} reserva(s) · ${x.pax} pax</small></td><td style="text-align:right">${dinero(x.venta)}</td><td style="text-align:right"><b>${dinero(x.ganancia)}</b></td>
      <td style="text-align:right"><div class="margen"><i style="width:${Math.max(0, Math.min(100, x.margen))}%"></i></div><small>${x.margen}%</small></td></tr>`).join('')}</tbody></table>` : '<div class="vacio">Sin datos.</div>'}</div>`;
  $('#vista').innerHTML = `<div class="cab"><div><h1>Ganancias</h1><div class="sub">${fechaLarga(d.desde)} al ${fechaLarga(d.hasta)} · venta menos costo de cada servicio (sin los cancelados)</div></div>
      <div class="der">${selectorRango('gnRango')}<div class="seg" id="segSede">${['', 'Punta Cana', 'Orlando'].map(x => `<button class="${S.sede === x ? 'a' : ''}" data-sede="${x}">${x || 'Todas'}</button>`).join('')}</div></div></div>
    <div class="gn-nums">
      <div class="gn-n"><small>Venta</small><b>${dinero(t.venta)}</b>${flecha(cv)}</div>
      <div class="gn-n"><small>Costo</small><b>${dinero(t.costo)}</b><small class="sub2">choferes, transportistas y proveedores</small></div>
      <div class="gn-n dest"><small>Ganancia</small><b>${dinero(t.ganancia)}</b>${flecha(cg)}</div>
      <div class="gn-n"><small>Margen</small><b>${t.margen}%</b><small class="sub2">${t.reservas} reservas · ${t.servicios} servicios · ${t.pax} pax</small></div></div>
    ${t.sin_costo || t.sin_precio ? `<div class="hoy-nota" style="cursor:default">${ic('info')}${t.sin_costo ? `${t.sin_costo} servicio(s) sin costo: la ganancia real puede ser menor. ` : ''}${t.sin_precio ? `${t.sin_precio} sin precio de venta. ` : ''}${puedeVista('boletas') ? '<a href="#" data-ir="boletas" style="margin-left:6px">Corregir en Boletas →</a>' : ''}</div>` : ''}
    <div class="caja"><div class="hoy-graf-cab"><h3>${ic('trending-up')}${porMes ? 'Por mes' : 'Por día'}</h3><span><i class="pt venta"></i>venta <i class="pt gan"></i>ganancia</span></div>
      ${serie.some(x => x.venta) ? `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="gn-svg">${barras}</svg>` : '<div class="vacio">No hay servicios en estas fechas.</div>'}</div>
    <div class="rej r2" style="align-items:start">${tabla(ic('briefcase') + 'Por agencia', d.porAgencia, 'Agencia')}${tabla(ic('route') + 'Por tipo de servicio', d.porTipo, 'Servicio')}</div>
    ${tabla(ic('car') + 'Quién hizo el servicio', d.porQuien, 'Hecho por')}`;
}

    <details open style="margin-bottom:10px"><summary><b>+ Registrar pago de una reserva</b></summary>
      <div class="fila2" style="margin-top:8px"><input id="pgRes" placeholder="Número de reserva"><input id="pgMonto" type="number" step="0.01" min="0" placeholder="Monto"></div>
      <div class="fila2"><select id="pgMoneda"><option>US$</option><option>RD$</option><option>€</option></select><select id="pgMetodo">${['Transferencia', 'PayPal', 'Efectivo', 'Depósito', 'Otro'].map(m => `<option>${m}</option>`).join('')}</select></div>
      <div class="fila2"><select id="pgCuenta">${opcCuenta}</select><input id="pgRef" placeholder="Referencia o número de confirmación"></div>
      <div class="fila2"><input id="pgFecha" type="date" value="${esc(I.hoy || '')}"><input id="pgVoucher" type="file" accept=".jpg,.jpeg,.png,.webp,.pdf"></div>
      <button class="btn" id="pgGuardarPago" style="margin-top:6px">Guardar pago</button>
    </details>
    <div style="overflow-x:auto"><table><thead><tr><th>Fecha</th><th>Reserva</th><th>Monto</th><th>Método</th><th>Cuenta</th><th>Comprobante</th><th>Estado</th><th></th></tr></thead><tbody>${filas || '<tr><td colspan="8" class="vacio">Todavía no hay pagos registrados.</td></tr>'}</tbody></table></div>
  </div>`;
}
async function guardarCuenta() {
  const r = await api('/api/op/pagos/cuenta/guardar', { tipo: val('pgTipoCuenta'), nombre: val('pgNomCuenta'), titular: val('pgTitCuenta'), numero: val('pgNumCuenta'), detalle: val('pgDetCuenta') });
  if (!r.ok) return aviso(r.data.error || 'No se pudo guardar la cuenta.');
  aviso('Cuenta guardada.'); await vGanancias();
}
function leerArchivoBase64(f) { return new Promise((ok, no) => { const fr = new FileReader(); fr.onload = () => ok(String(fr.result).split(',')[1] || ''); fr.onerror = no; fr.readAsDataURL(f); }); }
async function guardarPago() {
  const files = (document.getElementById('pgVoucher') || {}).files;
  const archivo = files && files[0];
  const cuerpo = { reserva: val('pgRes'), monto: val('pgMonto'), moneda: val('pgMoneda'), metodo: val('pgMetodo'), cuenta_id: val('pgCuenta'), referencia: val('pgRef'), fecha: val('pgFecha') };
  if (archivo) {
    if (archivo.size > 5 * 1024 * 1024) return aviso('El comprobante tiene que pesar menos de 5 MB.');
    cuerpo.voucher = { nombre: archivo.name, base64: await leerArchivoBase64(archivo) };
  }
  const r = await api('/api/op/pagos/registrar', cuerpo);
  if (!r.ok) return aviso(r.data.error || 'No se pudo registrar el pago.');
  aviso('Pago registrado. Queda por verificar.'); await vGanancias();
}
document.addEventListener('click', async ev => {
  const b = ev.target.closest('#pgGuardarCuenta,#pgGuardarPago,[data-pago-verificar],[data-pago-rechazar],[data-cuenta-borrar]');
  if (!b) return;
  if (b.id === 'pgGuardarCuenta') return guardarCuenta();
  if (b.id === 'pgGuardarPago') return guardarPago();
  if (b.dataset.cuentaBorrar) {
    if (!confirm('¿Desactivar esta cuenta? El historial de pagos se conserva.')) return;
    await api('/api/op/pagos/cuenta/borrar', { id: b.dataset.cuentaBorrar }); return vGanancias();
  }
  const decision = b.dataset.pagoVerificar ? 'verificado' : 'rechazado';
  const id = b.dataset.pagoVerificar || b.dataset.pagoRechazar;
  if (decision === 'verificado' && !confirm('¿Confirmas que este pago ya está en tu cuenta?')) return;
  const nota = decision === 'rechazado' ? (prompt('Motivo del rechazo (opcional):') || '') : '';
  const r = await api('/api/op/pagos/verificar', { id, decision, nota });
  if (!r.ok) return aviso(r.data.error || 'No se pudo guardar.');
  aviso(decision === 'verificado' ? 'Pago verificado.' : 'Pago rechazado.'); await vGanancias();
});

/* ---------- Archivo de reservas: búsqueda de cualquier reserva, de cualquier año ---------- */
let ARCH = { q: '', anio: 0, pagina: 1, sel: 0 };
async function vArchivo() {
  const r = await api(`/api/op/archivo?q=${encodeURIComponent(ARCH.q)}&anio=${ARCH.anio}&pagina=${ARCH.pagina}`);
  const d = r.ok ? r.data : { total: 0, reservas: [] };
  const paginas = Math.max(1, Math.ceil(d.total / 50));
  $('#vista').innerHTML = cabeceraDia('Archivo de reservas', 'Todas las reservas desde el primer día, de cualquier año. Cada cambio queda como versión nueva; nada se borra.') +
    `<div class="caja"><div class="fila2" style="gap:8px"><input id="arQ" value="${esc(ARCH.q)}" placeholder="Nombre, número de reserva, agencia, hotel o vuelo" style="flex:1"><input id="arA" type="number" min="2000" max="2100" value="${ARCH.anio || ''}" placeholder="Año" style="max-width:120px"><button class="btn" id="arBuscar">Buscar</button></div>
     <div class="ay" style="margin:8px 0">${d.total} reserva(s) encontradas</div>
     <div style="overflow-x:auto"><table><thead><tr><th>Reserva</th><th>Cliente</th><th>Agencia</th><th>Servicio</th><th>Año</th><th>Versiones</th><th></th></tr></thead><tbody>${d.reservas.map(x => `<tr><td>#${x.reserva_id}</td><td>${esc(x.cliente || '—')}</td><td>${esc(x.agencia || '—')}</td><td>${esc(x.fecha_servicio || '—')}</td><td>${x.anio || '—'}</td><td>${x.version}</td><td><button class="btn-mini" data-arch-ver="${x.reserva_id}">Ver</button></td></tr>`).join('') || '<tr><td colspan="7" class="vacio">No hay reservas con esa búsqueda.</td></tr>'}</tbody></table></div>
     <div style="display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:10px"><button class="btn-mini" data-arch-pag="-1" ${ARCH.pagina <= 1 ? 'disabled' : ''}>← Anterior</button><span class="ay">Página ${ARCH.pagina} de ${paginas}</span><button class="btn-mini" data-arch-pag="1" ${ARCH.pagina >= paginas ? 'disabled' : ''}>Siguiente →</button></div></div>
     <div id="arDetalle"></div>`;
  if (ARCH.sel) await cargarArchivoDetalle(ARCH.sel);
}
async function cargarArchivoDetalle(id) {
  ARCH.sel = id;
  const r = await api('/api/op/archivo/detalle?reserva=' + id);
  const el = document.getElementById('arDetalle');
  if (!el) return;
  if (!r.ok) { el.innerHTML = `<div class="caja" style="margin-top:14px"><div class="vacio">${esc(r.data.error || 'No se pudo abrir la reserva.')}</div></div>`; return; }
  const x = r.data.reserva, s = x.snapshot;
  el.innerHTML = `<div class="caja" style="margin-top:14px"><div class="cab"><h3>Reserva #${x.reserva_id} · versión ${x.version}</h3><button class="btn-mini" data-arch-cerrar="1">Cerrar</button></div>
    <div class="fila2"><div><b>${esc(s.cliente || '—')}</b><div class="sub2">${esc(s.agencia || '—')} · ${esc(s.telefono || '')}</div></div><div><b>${esc(s.fecha_servicio || '—')} ${esc(s.hora || '')}</b><div class="sub2">${esc(s.hotel || '')}</div><div class="sub2">${esc(s.desde || '')} → ${esc(s.hasta || '')}</div></div></div>
    <p class="sub" style="margin:8px 0">Pasajeros: ${s.adultos || 0} adultos · ${s.ninos || 0} niños · ${s.infantes || 0} infantes${s.vuelo ? ' · Vuelo ' + esc(s.vuelo) : ''}</p>
    <h4>Servicios</h4>${(s.servicios || []).map(v => `<div class="sub2">${esc(v.fecha || '')} ${esc(v.hora || '')} · ${esc(v.estado || '')} · ${esc(v.chofer || v.proveedor || 'sin asignar')} · ${dinero(v.precio)}</div>`).join('') || '<div class="sub2">Sin servicios todavía.</div>'}
    ${r.data.pagos ? `<h4 style="margin-top:10px">Pagos</h4>${r.data.pagos.map(p => `<div class="sub2">${esc(p.fecha || '')} · ${esc(p.moneda)} ${Number(p.monto).toFixed(2)} · ${esc(p.metodo)} · ${esc(p.estado)}</div>`).join('') || '<div class="sub2">Sin pagos.</div>'}` : ''}
    <h4 style="margin-top:10px">Historial de versiones</h4>${r.data.versiones.map(v => `<div class="sub2"><b>Versión ${v.version}</b> · ${esc(new Date(v.creado).toLocaleString('es-DO'))} · ${esc(v.cambios)}</div>`).join('')}
  </div>`;
}
document.addEventListener('click', async ev => {
  const b = ev.target.closest('#arBuscar,[data-arch-ver],[data-arch-pag],[data-arch-cerrar]');
  if (!b) return;
  if (b.id === 'arBuscar') { ARCH.q = val('arQ').trim(); ARCH.anio = Number(val('arA')) || 0; ARCH.pagina = 1; ARCH.sel = 0; return vArchivo(); }
  if (b.dataset.archVer) return cargarArchivoDetalle(Number(b.dataset.archVer));
  if (b.dataset.archPag) { ARCH.pagina = Math.max(1, ARCH.pagina + Number(b.dataset.archPag)); ARCH.sel = 0; return vArchivo(); }
  if (b.dataset.archCerrar) { ARCH.sel = 0; const el = document.getElementById('arDetalle'); if (el) el.innerHTML = ''; }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target && ev.target.id === 'arQ') { ARCH.q = ev.target.value.trim(); ARCH.anio = Number(val('arA')) || 0; ARCH.pagina = 1; ARCH.sel = 0; vArchivo(); }
});

</script>
</body>
</html>
