<style>
:root{--bg:#f4f6fa;--card:#fff;--txt:#0f1b2d;--suave:#6b7a90;--borde:#e6ebf2;--nav:#0c1a2e;--nav2:#13253f;--oro:#c9a24a;--oro2:#e8c877;--azul:#1f5fae;--verde:#0f9d6b;--ambar:#c98a12;--violeta:#6d4bd8;--rojo:#d92d4b;--sombra:0 1px 2px rgba(15,27,45,.04),0 8px 24px rgba(15,27,45,.06)}

.logoE img{width:100%;height:100%;object-fit:contain;background:#fff}

a.item{text-decoration:none}.item:hover{background:rgba(255,255,255,.05);color:#fff}.item.a{background:rgba(201,162,74,.14);color:#fff;box-shadow:inset 3px 0 0 var(--oro)}.item.a .ic{color:var(--oro2)}

.gantt .g-fila{display:grid;grid-template-columns:160px 1fr;align-items:center;gap:10px;padding:5px 0}.g-n{font-weight:700;font-size:12.5px}.g-n small{display:block;color:var(--suave);font-weight:500}

.g-IN{background:linear-gradient(135deg,#0f9d6b,#22c08a)}.g-OUT{background:linear-gradient(135deg,#1f5fae,#3a86e0)}.g-ACTIVIDAD,.g-INTERHOTEL,.g-OTRO{background:linear-gradient(135deg,#6d4bd8,#8f72ee)}
.g-choque{background:repeating-linear-gradient(45deg,#d92d4b,#d92d4b 6px,#f04864 6px,#f04864 12px)!important}

.pop{position:fixed;z-index:60;background:var(--card);border:1px solid var(--borde);border-radius:14px;box-shadow:0 20px 50px rgba(12,26,46,.25);width:320px;max-height:420px;overflow:auto;padding:6px}

.dato{display:grid;grid-template-columns:130px 1fr;gap:8px;padding:6px 0;border-bottom:1px dashed var(--borde);font-size:13px}.dato span:first-child{color:var(--suave)}
.ev{display:flex;gap:10px;padding:7px 0;font-size:12.5px;border-bottom:1px solid var(--borde)}.ev small{color:var(--suave);white-space:nowrap}
.campo{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}.campo>input,.campo>select,.campo>textarea{width:100%}.rej>*{min-width:0}.campo>div>input{flex:1;min-width:0;width:100%}.ficha{border:1px solid var(--borde);border-radius:14px;padding:12px 14px 4px;margin-bottom:10px}.ficha.nueva{border-style:dashed;border-color:var(--oro)}.ficha .pie-f{display:flex;gap:6px;justify-content:flex-end;padding-bottom:10px}.campo label{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--suave);font-weight:700}
.rej{display:grid;gap:12px}.r2{grid-template-columns:1fr 1fr}.r3{grid-template-columns:repeat(3,1fr)}.r4{grid-template-columns:repeat(4,1fr)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--nav);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;opacity:0;transition:.2s;z-index:80;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.3)}.toast.v{opacity:1;transform:translateX(-50%)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--borde);margin-bottom:14px;flex-wrap:wrap}.tabs button{padding:9px 13px;border:0;background:none;color:var(--suave);font-weight:600;cursor:pointer;border-bottom:2px solid transparent}.tabs button.a{color:var(--txt);border-bottom-color:var(--oro)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--borde)}.switch b{display:block}.switch small{color:var(--suave)}
.sw{position:relative;width:42px;height:24px;flex:none}.sw input{opacity:0;width:0;height:0}.sw span{position:absolute;inset:0;background:#cbd5e1;border-radius:999px;transition:.15s;cursor:pointer}.sw span:before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}.sw input:checked+span{background:var(--verde)}.sw input:checked+span:before{transform:translateX(18px)}
.prox{max-width:560px;margin:12vh auto;text-align:center;background:var(--card);border-radius:22px;padding:40px 34px;box-shadow:var(--sombra);border:1px solid var(--borde)}.prox .tile{width:72px;height:72px;border-radius:20px;margin:0 auto 14px}.prox .tile .ic{width:36px;height:36px}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--bg);color:var(--suave)}
.plant{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:13px;border:1px solid var(--borde);margin-bottom:8px;cursor:pointer}.plant.a{border-color:var(--oro);background:rgba(201,162,74,.08)}.plant b{display:block}.plant small{color:var(--suave)}
.comp{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--borde)}.comp .d{flex:1;min-width:0}.comp .m{text-align:right;font-weight:700;white-space:nowrap}.comp .m small{display:block;color:var(--suave);font-weight:500}

<body>
<div class="app" id="app" style="display:none">
  <aside id="menu"></aside>
  <main id="vista"></main>
</div>
<div id="prox" style="display:none"></div>
<div class="fondo" id="fondo"></div>
<div class="panel-lat" id="lat"></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dinero = n => n === null || n === undefined || n === '' ? '—' : 'US$ ' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const iniciales = n => String(n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(x => x[0]).join('').toUpperCase();
const COLORES = ['#1f5fae', '#0f9d6b', '#c98a12', '#6d4bd8', '#d92d4b', '#0e7490', '#9333ea', '#475569'];
const colorDe = id => COLORES[(Number(id) || 0) % COLORES.length];
const minutos = h => { const m = String(h || '').match(/(\d{1,2}):(\d{2})/); return m ? Number(m[1]) * 60 + Number(m[2]) : null; };
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const fechaLarga = f => { if (!f) return 'Sin fecha'; const d = new Date(f + 'T12:00:00'); return `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`; };
const fechaCorta = f => { if (!f) return '—'; const d = new Date(f + 'T12:00:00'); return `${d.getDate()} ${MESES[d.getMonth()].slice(0, 3)}`; };
const masDias = (f, n) => { const d = new Date(f + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const TIPO = { IN: ['plane-landing', 'Llegada', 't-ve'], OUT: ['plane-takeoff', 'Salida', 't-az'], ACTIVIDAD: ['ticket', 'Tour / actividad', 't-vi'], INTERHOTEL: ['route', 'Inter-hotel', 't-vi'], OTRO: ['circle-dot', 'Servicio', 't-gr'] };
let I = null, S = { vista: 'operaciones', fecha: '', sede: '', filtro: 'por_asignar', q: '', sel: new Set(), servicios: [], ubicaciones: [], sinFecha: 0 };
const timers = {};

async function api(url, cuerpo) {
  const r = await fetch(url, cuerpo === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo) });
  let d = {}; try { d = await r.json(); } catch (e) {}
  if (r.status === 401) { location.href = '/'; }
  return { ok: r.ok, status: r.status, data: d };
}
function aviso(t, ms = 3800) { const el = $('#toast'); el.textContent = t; el.classList.add('v'); clearTimeout(timers.t); timers.t = setTimeout(() => el.classList.remove('v'), ms); }
function tema(oscuro) { document.body.classList.toggle('oscuro', oscuro); try { localStorage.setItem('opTema', oscuro ? 'oscuro' : 'claro'); } catch (e) {} }

async function iniciar() {
  try { tema(localStorage.getItem('opTema') === 'oscuro'); } catch (e) {}
  const r = await api('/api/op/inicio');
  if (r.status === 403 && r.data.proximamente) return proximamente();
  if (!r.ok) { document.body.innerHTML = `<div class="prox"><h2>No se pudo abrir Operaciones</h2><p>${esc(r.data.error || '')}</p><a href="/">Volver</a></div>`; return; }
  I = r.data;
  S.fecha = I.hoy;

/* ---------- línea de tiempo por chofer ---------- */
function htmlGantt() {
  const ini = 4 * 60, fin = 24 * 60, ancho = fin - ini;
  const pos = m => Math.max(0, Math.min(100, (m - ini) / ancho * 100));
  const filas = [];
  const usados = new Map();
  for (const x of S.servicios.filter(s => s.estado !== 'cancelado' && s.inicio !== null && (s.chofer_id || s.proveedor_id))) {
    const k = x.chofer_id ? 'c' + x.chofer_id : 'p' + x.proveedor_id;
    if (!usados.has(k)) usados.set(k, { nombre: x.chofer || x.proveedor, sub: x.chofer ? (x.vehiculo || 'propio') : 'transportista', lista: [] });
    usados.get(k).lista.push(x);
  }
  for (const c of I.choferes.filter(c => c.activo && !usados.has('c' + c.id))) usados.set('c' + c.id, { nombre: c.nombre, sub: (vehDe(c) || {}).nombre || 'propio', lista: [] });
  if (!usados.size) return '<div class="vacio">Cuando asignes servicios, aquí se ve el día de cada chofer y si dos servicios se cruzan.</div>';
  const ahora = new Date(); const esHoy = S.fecha === I.hoy; const mAhora = ahora.getHours() * 60 + ahora.getMinutes();
  for (const [, g] of usados) {
    filas.push(`<div class="g-fila"><div class="g-n">${esc(g.nombre)}<small>${esc(g.sub)}</small></div><div class="g-bar">${g.lista.map(x => `<div class="g-b g-${x.tipo} ${x.choques && x.choques.length ? 'g-choque' : ''}" data-id="${x.id}" title="${esc((x.recogida || x.hora) + ' · ' + (x.vuelo || x.actividad || '') + ' · ' + x.cliente)}" style="left:${pos(x.inicio)}%;width:${Math.max(3, pos(x.fin) - pos(x.inicio))}%">${esc((x.recogida || x.hora) + ' ' + (x.vuelo || x.actividad || x.cliente))}</div>`).join('')}${esHoy && mAhora > ini ? `<div class="g-ahora" style="left:${pos(mAhora)}%"></div>` : ''}</div></div>`);
  }
  return `<div class="g-horas"><div></div><div>${['4 a. m.', '6', '8', '10', '12 p. m.', '2', '4', '6', '8', '10', '12']. map(h => `<span>${h}</span>`).join('')}</div></div>${filas.join('')}<div class="nota-pie">${esHoy ? 'Línea roja = ahora · ' : ''}verde llegada · azul salida · violeta tour · rayado rojo = dos servicios que se cruzan</div>`;
}

  const x = S.servicios.find(s => s.id === id);
  if (!x) return;
  const ev = await api('/api/op/eventos?id=' + id);
  const [icono, nombre, cls] = TIPO[x.tipo] || TIPO.OTRO;
  const v = x.vuelo_vivo;
  $('#lat').innerHTML = `<div class="cabp"><div class="tile ${cls}">${ic(icono)}</div><div style="flex:1"><b style="font-size:16px">${esc(x.cliente || 'Sin nombre')}</b><div class="sub2">${esc(nombre)} · reserva #${x.reserva} · ${esc(x.agencia)}</div></div><button class="btn mini s" id="cerrarLat">${ic('x')}</button></div>
  <div class="cuerpo">
    ${x.alerta ? `<div class="caja" style="border-color:rgba(217,45,75,.35);padding:10px 12px"><div class="alerta" style="margin:0">${ic('triangle-alert')}${esc(x.alerta)}</div>${I.permisos.asignar_servicios ? `<button class="btn mini s" style="margin-top:8px" data-quitar-alerta="${x.id}">Ya lo revisé</button>` : ''}</div>` : ''}
    <div class="dato"><span>Fecha</span><span>${S.filtro === 'sin_fecha' || !x.fecha ? `<span style="color:var(--rojo)">Sin fecha</span>` : fechaLarga(x.fecha)}</span></div>
    <div class="dato"><span>${x.tipo === 'OUT' ? 'Vuelo sale' : x.tipo === 'IN' ? 'Vuelo llega' : 'Hora'}</span><span>${esc(x.hora || '—')}${x.tipo === 'OUT' ? ` · <b>recoger ${esc(x.recogida)}</b>` : ''}</span></div>
    ${x.vuelo ? `<div class="dato"><span>Vuelo</span><span>${esc(x.vuelo)} ${x.aeropuerto ? '· ' + esc(x.aeropuerto) : ''}${v && v.estado ? ` · <b>${esc(v.estado)}</b>${v.hora_estimada ? ' ' + esc(v.hora_estimada) : ''}${v.terminal ? ' · terminal ' + esc(v.terminal) : ''}${v.puerta ? ' · puerta ' + esc(v.puerta) : ''}` : ''}</span></div>` : ''}

    <div class="dato"><span>Pasajeros</span><span>${x.pax.adultos} adultos${x.pax.ninos ? ', ' + x.pax.ninos + ' niños' : ''}${x.pax.infantes ? ', ' + x.pax.infantes + ' infantes' : ''}</span></div>
    ${x.telefono ? `<div class="dato"><span>Teléfono</span><span>${esc(x.telefono)}</span></div>` : ''}
    ${x.nota ? `<div class="dato"><span>Nota de la reserva</span><span>${esc(x.nota)}</span></div>` : ''}
    <div class="dato"><span>Asignado a</span><span>${esc(x.chofer || x.proveedor || 'Nadie todavía')}${x.vehiculo ? ' · ' + esc(x.vehiculo) + (x.placa ? ' (' + esc(x.placa) + ')' : '') : ''}</span></div>
    ${I.permisos.ver_precios && I.modulos.precios ? `<div class="dato"><span>Precio venta</span><span><b>${dinero(x.precio)}</b><br><small class="sub2">${esc(x.tarifa_venta || '')}</small></span></div>
      <div class="dato"><span>Costo</span><span><b>${dinero(x.costo)}</b>${x.precio !== null && x.costo !== null ? ` · ganancia <b style="color:var(--verde)">${dinero(x.precio - x.costo)}</b>` : ''}<br><small class="sub2">${esc(x.tarifa_costo || '')}</small></span></div>` : ''}

  </div>`;
  $('#lat').dataset.id = id;
  $('#lat').classList.add('abierto'); $('#fondo').classList.add('abierto');
}
function cerrarLat() { $('#lat').classList.remove('abierto'); $('#fondo').classList.remove('abierto'); }
async function recargarYDetalle(id) { await cargar(); S.vista === 'vivo' ? pintarVivo() : pintarOperaciones(); if (id) abrirDetalle(id); }
$('#lat').addEventListener('click', async ev => {
  const id = Number($('#lat').dataset.id);
  const t = ev.target.closest('button');
  if (!t) return;
  if (t.id === 'cerrarLat') return cerrarLat();
  if (t.id === 'latAsignar') { cerrarLat(); return asignar([id], $('#latQuien').value); }
  if (t.dataset.est) {
    if (t.dataset.est === 'cancelado' && !confirm('¿Cancelar este servicio en Operaciones?')) return;
    const r = await api('/api/op/estado-servicio', { id, estado: t.dataset.est }); if (!r.ok) return aviso(r.data.error); return recargarYDetalle(id);
  }
  if (t.dataset.quitarAlerta) { await api('/api/op/notas', { id, notas: $('#latNotas') ? $('#latNotas').value : '', quitarAlerta: true }); return recargarYDetalle(id); }
  if (t.id === 'latGuardarNotas') { await api('/api/op/notas', { id, notas: $('#latNotas').value }); aviso('Notas guardadas.'); return recargarYDetalle(id); }
  if (t.id === 'latGuardarFecha') { const r = await api('/api/op/fecha', { id, fecha: $('#latFecha').value, hora: $('#latHora').value }); if (!r.ok) return aviso(r.data.error); cerrarLat(); aviso('Fecha guardada.'); return recargarYDetalle(); }
  if (t.id === 'latGuardarPrecio') { const r = await api('/api/op/precio', { id, precio: $('#latPrecio').value, costo: $('#latCosto').value, motivo: $('#latMotivo').value }); if (!r.ok) return aviso(r.data.error); aviso('Precio guardado.'); return recargarYDetalle(id); }
  if (t.id === 'latWa') { t.disabled = true; const r = await api('/api/op/whatsapp', { id }); aviso(r.ok ? '✔ WhatsApp enviado.' : r.data.error, 6000); return recargarYDetalle(id); }
  if (t.id === 'latVoucher') return imprimirVoucher([S.servicios.find(s => s.id === id)]);
});

/* ---------- vista: Choferes en vivo ---------- */
let mapa = null, marcas = [];
async function vVivo() { $('#vista').innerHTML = '<div class="vacio">Cargando…</div>'; S.filtro = S.filtro === 'sin_fecha' ? 'todo' : S.filtro; await cargar(); pintarVivo(); }
function estadoChofer(c) {
  if (!c.activo) return ['Inactivo', 't-gr'];
  if (c.libre_desde && c.libre_hasta && S.fecha >= c.libre_desde && S.fecha <= c.libre_hasta) return ['Día libre', 't-gr'];
  const mios = S.servicios.filter(s => s.chofer_id === c.id && s.estado !== 'cancelado');
  if (mios.some(s => ['en_camino', 'recogido'].includes(s.estado))) return ['En ruta', 't-az'];
  if (mios.some(s => s.estado === 'en_sitio')) return ['Esperando', 't-amb'];
  const prox = mios.filter(s => ['asignado'].includes(s.estado)).sort((a, b) => (a.inicio || 0) - (b.inicio || 0))[0];
  return prox ? ['Próximo ' + (prox.recogida || prox.hora), 't-ve'] : ['Libre', 't-ve'];
}
function pintarVivo() {
  const conMapa = I.modulos.app_chofer;
  $('#vista').innerHTML = cabeceraDia('Choferes en vivo', 'Dónde va cada vehículo y qué tiene asignado · ' + fechaLarga(S.fecha)) + `
    <div class="rej" style="grid-template-columns:minmax(0,1fr) 360px;align-items:start">
      <div class="caja" style="padding:12px">${conMapa ? '<div id="mapa"></div><div class="nota-pie">Ubicación que manda la app del chofer (se actualiza cada minuto mientras la tiene abierta).</div>'
        : `<div class="vacio" style="padding:60px 20px">${ic('map')}<br><b>El mapa se enciende con la app del chofer</b><br>Configuración → Módulos → App del chofer. Mientras tanto, abajo ves el día de cada chofer.</div>`}</div>
      <div class="caja"><h3>${ic('car')}Choferes</h3>${I.choferes.filter(c => c.activo).map(c => { const [t, cls] = estadoChofer(c); const u = S.ubicaciones.find(x => x.chofer_id === c.id);
        return `<div class="comp"><span class="mini-av" style="width:36px;height:36px;font-size:12px;background:${colorDe(c.id)}">${esc(iniciales(c.nombre))}</span><div class="d"><b>${esc(c.nombre)}</b><small class="sub2">${esc((vehDe(c) || {}).nombre || 'sin vehículo')}${u ? ' · ubicación ' + esc(new Date(u.fecha).toLocaleTimeString('es-DO', { hour: '2-digit', minute: '2-digit' })) : ''}</small></div><span class="tag ${cls}">${esc(t)}</span></div>`; }).join('') || '<div class="vacio">No hay choferes todavía.</div>'}</div></div>
    <div class="caja gantt">${'<h3>' + ic('timer') + 'El día de cada chofer</h3>'}${htmlGantt()}</div>`;
  if (conMapa) pintarMapa();
}
function pintarMapa() {
  const cargarLeaflet = () => new Promise(ok => { if (window.L) return ok(); const s = document.createElement('script'); s.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'; s.onload = ok; document.head.appendChild(s); });
  cargarLeaflet().then(() => {
    if (!$('#mapa')) return;
    mapa = L.map('mapa').setView(S.sede === 'Orlando' ? [28.42, -81.47] : [18.62, -68.42], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '© OpenStreetMap' }).addTo(mapa);
    const pts = [];
    for (const u of S.ubicaciones) {
      const c = I.choferes.find(x => x.id === u.chofer_id) || { nombre: u.nombre, id: u.chofer_id };
      const [t] = estadoChofer(c);
      const icono = L.divIcon({ className: '', html: `<div style="display:flex;flex-direction:column;align-items:center;gap:3px;transform:translate(-50%,-50%)"><span style="width:32px;height:32px;border-radius:50%;background:${colorDe(c.id)};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.3)">${esc(iniciales(c.nombre))}</span><span style="background:#fff;color:#0f1b2d;border-radius:7px;padding:2px 7px;font-size:11px;font-weight:700;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.2)">${esc(c.nombre.split(' ')[0])} · ${esc(t)}</span></div>` });
      L.marker([u.lat, u.lng], { icon: icono }).addTo(mapa); pts.push([u.lat, u.lng]);
    }
    if (pts.length) mapa.fitBounds(pts, { padding: [40, 40], maxZoom: 13 });
  });
}

      <div class="caja"><h3>${ic('calendar-days')}Al crear la reserva</h3><div class="sub2" style="line-height:1.6">• Traslados y transporte a los parques van a <b>Operaciones</b>, cada uno en su fecha.<br>• Las entradas quedan en <b>Entradas por emitir</b> para comprarlas y subir los códigos.<br>• Voucher y cotización con el logo, listos para imprimir o PDF.</div></div></div></div>`;
  pintarPiezas(); cotizar();
}
function prepararPiezas() {
  // Fechas por defecto: el primer parque el día siguiente a la llegada.
  let d = 1;
  for (const p of PQ.piezas) {
    if (p.tipo === 'ENTRADA') { p.fechas = Array.from({ length: p.dias || 1 }, (_, i) => masDias(PQ.desde, d + i)); p.parquesDia = (p.parques || []).slice(); d += p.dias || 1; }
    if (p.tipo === 'TRANSPORTE') p.fechas = Array.from({ length: p.dias || 1 }, (_, i) => masDias(PQ.desde, 1 + i));
    if (p.tipo === 'ACTIVIDAD' && !p.fecha) p.fecha = masDias(PQ.desde, 1);
  }
}
function pintarPiezas() {
  const ICONO = { IN: ['plane-landing', 't-ve'], OUT: ['plane-takeoff', 't-az'], ENTRADA: ['ticket', 't-az'], TRANSPORTE: ['bus', 't-vi'], ACTIVIDAD: ['star', 't-vi'], EXTRA: ['zap', 't-amb'] };
  const lin = PQ.cot ? PQ.cot.lineas : [];

      ${p.tipo === 'ENTRADA' ? `<div class="dias">${(p.fechas || []).map((f, k) => `<span class="dia"><input type="date" data-pfecha="${i}:${k}" value="${f}" style="width:120px"><input data-pparque="${i}:${k}" value="${esc((p.parquesDia || [])[k] || '')}" placeholder="Parque"></span>`).join('')}</div>` : ''}
      ${p.opcional ? `<label class="sub2" style="display:flex;gap:6px;align-items:center;margin-top:4px"><input type="checkbox" data-incluir="${i}" ${p.incluir ? 'checked' : ''}> Incluir en el precio</label>` : ''}</div>
      <div class="m">${l.precio === null || l.precio === undefined ? '<span class="sub2">sin tarifa</span>' : dinero(l.precio)}${I.permisos.ver_precios && l.costo !== null && l.costo !== undefined ? `<small>costo ${dinero(l.costo)}</small>` : ''}</div>
      <button class="btn mini s" data-quitarpieza="${i}" title="Quitar">${ic('x')}</button></div>`; }).join('') + `<div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap"><select id="pqTipoPieza">${[['ENTRADA', 'Entradas'], ['TRANSPORTE', 'Transporte'], ['ACTIVIDAD', 'Tour / actividad'], ['IN', 'Traslado llegada'], ['OUT', 'Traslado salida'], ['EXTRA', 'Extra']].map(([k, n]) => `<option value="${k}">${n}</option>`).join('')}</select><input id="pqNombrePieza" placeholder="Nombre (ej. SeaWorld 1 día)"><input id="pqDiasPieza" type="number" min="1" value="1" style="width:70px" title="Días"><button class="btn s" id="pqAgregarPieza">${ic('plus')}Agregar pieza</button></div>`;

function leerPaquete() {
  const g = id => ($(id) || {}).value || '';
  Object.assign(PQ, { agencia_id: g('#pqAgencia'), cliente: g('#pqCliente'), telefono: g('#pqTel'), desde: g('#pqDesde'), hasta: g('#pqHasta'), hotel: g('#pqHotel'), adultos: g('#pqAd'), ninos: g('#pqNi'), infantes: g('#pqIn'),
    vuelo_llega: g('#pqVL'), hora_llega: g('#pqHL'), vuelo_sale: g('#pqVS'), hora_sale: g('#pqHS'), aeropuerto: g('#pqAe') });

async function cotizar() {
  leerPaquete();
  const r = await api('/api/op/paquete/cotizar', { agencia_id: PQ.agencia_id, adultos: PQ.adultos, ninos: PQ.ninos, infantes: PQ.infantes, hotel: PQ.hotel, aeropuerto: PQ.aeropuerto, desde: PQ.desde,
    piezas: PQ.piezas.map(p => ({ ...p, fecha: p.tipo === 'OUT' ? PQ.hasta : p.fechas ? p.fechas[0] : p.fecha || PQ.desde })) });
  if (!r.ok) { $('#pqPrecio').innerHTML = `<div class="sub2">${esc(r.data.error || '')}</div>`; return; }
  PQ.cot = r.data;
  pintarPiezas();
  $('#pqPrecio').innerHTML = `<h3>${ic('wallet')}Precio del paquete</h3><div class="linea"><span>Venta</span><b>${dinero(r.data.venta)}</b></div>${I.permisos.ver_precios ? `<div class="linea"><span>Costo</span><b>${dinero(r.data.costo)}</b></div><div class="linea"><span>Ganancia</span><b style="color:var(--verde)">${dinero(r.data.ganancia)}${r.data.venta ? ' · ' + Math.round(r.data.ganancia / r.data.venta * 100) + '%' : ''}</b></div>` : ''}

async function crearPaquete() {
  leerPaquete();
  if (!PQ.cliente) return aviso('Escribe el nombre del cliente.');
  const lin = (PQ.cot && PQ.cot.lineas) || [];
  const servicios = [];
  PQ.piezas.forEach((p, i) => {
    const l = lin[i] || {};
    if (p.opcional && !p.incluir) return;
    if (p.tipo === 'IN') servicios.push({ tipo: 'IN', fecha: PQ.desde, hora: PQ.hora_llega, vuelo: PQ.vuelo_llega, aeropuerto: PQ.aeropuerto, precio: l.precio, costo: l.costo, tarifa: l.tarifa });
    else if (p.tipo === 'OUT') servicios.push({ tipo: 'OUT', fecha: PQ.hasta, hora: PQ.hora_sale, vuelo: PQ.vuelo_sale, aeropuerto: PQ.aeropuerto, precio: l.precio, costo: l.costo, tarifa: l.tarifa });
    else if (p.tipo === 'ENTRADA' || p.tipo === 'EXTRA') servicios.push({ tipo: 'ACTIVIDAD', clase: 'entrada', fecha: (p.fechas || [PQ.desde])[0] || PQ.desde, actividad: `Entradas: ${p.nombre}${p.parquesDia && p.parquesDia.length ? ' (' + p.fechas.map((f, k) => fechaCorta(f) + ' ' + (p.parquesDia[k] || '')).join(', ') + ')' : ''}`, precio: l.precio, costo: l.costo, tarifa: l.tarifa });
    else if (p.tipo === 'TRANSPORTE') { const fs = p.fechas || [PQ.desde]; const ent = PQ.piezas.find(x => x.tipo === 'ENTRADA'); fs.forEach((f, k) => servicios.push({ tipo: 'ACTIVIDAD', fecha: f, hora: '08:00', actividad: `${p.nombre}${ent && ent.parquesDia && ent.parquesDia[k] ? ' · ' + ent.parquesDia[k] : ''}`, precio: l.precio === null || l.precio === undefined ? null : Math.round(l.precio / fs.length * 100) / 100, costo: l.costo === null || l.costo === undefined ? '' : Math.round(l.costo / fs.length * 100) / 100, tarifa: l.tarifa })); }
    else servicios.push({ tipo: 'ACTIVIDAD', fecha: p.fecha || PQ.desde, hora: '08:00', actividad: p.nombre, precio: l.precio, costo: l.costo, tarifa: l.tarifa });
  });
  const ag = I.agencias.find(a => String(a.id) === String(PQ.agencia_id));
  const r = await api('/api/op/reserva', { agencia: ag ? ag.nombre : 'Directo (oficina)', cliente: PQ.cliente, telefono: PQ.telefono, adultos: PQ.adultos, ninos: PQ.ninos, infantes: PQ.infantes, hotel: PQ.hotel, referencia: 'Paquete ' + ((I.paquetes.find(p => p.id === PQ.plantilla) || {}).nombre || ''), servicios });
  if (!r.ok) return aviso(r.data.error || 'No se pudo crear');
  aviso(`✔ Paquete reservado: #${r.data.reserva} con ${r.data.servicios} servicio(s).`);
  imprimirCotizacion(true);
  PQ = null;
}

    ${[...grupos.keys()].sort().map(k => `<div style="margin:14px 0 4px;font-weight:800;color:#0b4f8a;font-size:14.5px">${titulo(k)}</div>${tabla(grupos.get(k).sort((a, b) => (a.inicio || 0) - (b.inicio || 0)))}`).join('') || '<div class="vacio">No hay servicios este día.</div>'}

      <div class="campo"><label>Llave de FlightAware ${CF.llaves.flightaware ? '<span class="tag t-ve">guardada</span>' : ''}</label><input type="password" id="vuFa" placeholder="${CF.llaves.flightaware ? '•••••• (escribe para cambiarla)' : 'x-apikey'}"></div>
      <button class="btn p" id="vuGuardar">${ic('save')}Guardar</button><p class="sub2">Las llaves se guardan cifradas en el servidor y nunca se vuelven a mostrar. Enciende "Vuelos en vivo" en General y módulos.</p></div>
    <div class="caja"><h3>${ic('search')}Probar un vuelo</h3><div style="display:flex;gap:6px"><input id="vuVuelo" placeholder="CM 241"><input type="date" id="vuFecha" value="${I.hoy}"><button class="btn s" id="vuProbar">Probar</button></div><pre id="vuRes" style="white-space:pre-wrap;font-size:12px;color:var(--suave)"></pre></div></div>`;
}
function cfWhatsapp() {
  const w = CF.whatsapp;
  const c = (k, t, extra = '') => `<div class="campo"><label>${t}</label><input id="wa_${k}" value="${esc(w[k] || '')}" ${extra}></div>`;
  $('#cfCuerpo').innerHTML = `<div class="rej r2" style="align-items:start"><div class="caja"><h3>${ic('message-circle')}Chatwoot</h3>${c('chatwoot_url', 'Dirección de Chatwoot', 'placeholder="https://redes.kaizenia.app"')}${c('cuenta', 'Número de cuenta (account id)')}${c('inbox_id', 'Bandeja de WhatsApp (inbox id)')}
      <div class="campo"><label>Token de acceso ${CF.llaves.chatwoot ? '<span class="tag t-ve">guardado</span>' : ''}</label><input type="password" id="wa_token" placeholder="${CF.llaves.chatwoot ? '•••••• (escribe para cambiarlo)' : 'api_access_token'}"></div>
      ${c('plantilla', 'Plantilla aprobada de WhatsApp (nombre)', 'placeholder="Opcional: obligatoria fuera de la ventana de 24 h"')}${c('idioma', 'Idioma de la plantilla')}
      <label class="sub2"><input type="checkbox" id="wa_auto" ${w.auto_al_asignar ? 'checked' : ''}> Enviar solo al asignar chofer</label></div>
    <div class="caja"><h3>${ic('pencil')}Mensaje</h3><textarea id="wa_mensaje" rows="6" style="width:100%">${esc(w.mensaje || '')}</textarea><p class="sub2">Variables: {cliente} {empresa} {fecha} {recogida} {chofer} {vehiculo} {placa} {punto} {vuelo}</p></div></div>
    <button class="btn p" id="waGuardar">${ic('save')}Guardar WhatsApp</button>`;
}
function leerFila(tr) {
  const d = { id: Number(tr.dataset.fila) || 0 };
  tr.querySelectorAll('[data-c]').forEach(el => { d[el.dataset.c] = el.type === 'checkbox' ? el.checked : el.value; });
  return d;
}
async function subirExcel(input, cuerpo) {
  const f = input.files[0]; if (!f) return;
  const b64 = await new Promise(ok => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.readAsDataURL(f); });
  const r = await api('/api/op/config/importar', { ...cuerpo, base64: b64 });
  aviso(r.ok ? `✔ Importadas ${r.data.importadas} filas de la hoja "${r.data.hoja}".` : r.data.error, 6000);
  if (r.ok) vConfig();
}

/* ---------- eventos ---------- */
document.addEventListener('click', async ev => {
  const t = ev.target;
  if (!t.closest('.pop') && !t.closest('[data-asig]')) cerrarPop();
  const irA = t.closest('[data-ir]'); if (irA) { ev.preventDefault(); if (irA.dataset.ir === 'operaciones') S.filtro = S.filtro || 'por_asignar'; return ir(irA.dataset.ir); }
  if (t.closest('#btnTema')) { tema(!document.body.classList.contains('oscuro')); return pintarMenu(); }
  if (t.closest('#fondo')) return cerrarLat();
  const dia = t.closest('[data-dia]'); if (dia) { const n = Number(dia.dataset.dia); S.fecha = n ? masDias(S.fecha, n) : I.hoy; if (S.filtro === 'sin_fecha') S.filtro = 'todo'; return ir(S.vista); }
  const sd = t.closest('[data-sede]'); if (sd) { S.sede = sd.dataset.sede; guardarEstado(); return ir(S.vista); }
  const fl = t.closest('[data-filtro]'); if (fl) { const antes = S.filtro; S.filtro = fl.dataset.filtro; S.sel.clear(); if (antes === 'sin_fecha' || S.filtro === 'sin_fecha') return vOperaciones(); return pintarOperaciones(); }
  const as = t.closest('[data-asig]'); if (as) { ev.stopPropagation(); return abrirPop(as, Number(as.dataset.asig)); }
  if (t.matches('[data-sel]')) { const id = Number(t.dataset.sel); t.checked ? S.sel.add(id) : S.sel.delete(id); return pintarOperaciones(); }
  if (t.closest('#btnLote')) return asignar([...S.sel], $('#loteQuien').value);
  if (t.closest('#btnLoteQuitar')) { S.sel.clear(); return pintarOperaciones(); }
  const gb = t.closest('.g-b'); if (gb) return abrirDetalle(Number(gb.dataset.id));
  const fila = t.closest('tr.fila[data-id]'); if (fila && !t.closest('input,button,[data-asig],select,textarea')) return abrirDetalle(Number(fila.dataset.id));
  if (t.closest('#btnImprimir')) { const w = window.open('', '_blank'); w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Operativo</title><style>body{font-family:'Segoe UI',Arial,sans-serif;margin:18px;color:#0f1b2d}table{width:100%;border-collapse:collapse}th{background:#f1f5f9;text-align:left}.sub2{color:#64748b;font-size:12px}@page{size:landscape}</style></head><body>${$('#hojaOp').innerHTML.replace(/src="\/empresa\/logo"/g, `src="${location.origin}/empresa/logo"`)}<script>setTimeout(()=>print(),400)<\/script></body></html>`); w.document.close(); return; }
  // reserva manual
  if (t.closest('#nAgregar')) { const u = nuevos[nuevos.length - 1] || {}; nuevos.push({ tipo: 'OUT', fecha: u.fecha || S.fecha, hora: '', vuelo: '', aeropuerto: u.aeropuerto || 'PUJ', actividad: '' }); return pintarNuevos(); }
  const qn = t.closest('[data-quitar]'); if (qn) { nuevos.splice(Number(qn.dataset.quitar), 1); return pintarNuevos(); }
  if (t.closest('#nGuardar')) return guardarNueva();
  // paquetes
  const pl = t.closest('[data-plantilla]'); if (pl) { const p = I.paquetes.find(x => x.id === Number(pl.dataset.plantilla)); leerPaquete(); PQ.plantilla = p.id; PQ.piezas = JSON.parse(JSON.stringify(p.piezas)); prepararPiezas(); return vPaquetes(); }
  const qp = t.closest('[data-quitarpieza]'); if (qp) { PQ.piezas.splice(Number(qp.dataset.quitarpieza), 1); return cotizar(); }
  if (t.closest('#pqAgregarPieza')) { const tipo = $('#pqTipoPieza').value, nombre = $('#pqNombrePieza').value.trim(); if (!nombre) return aviso('Escribe el nombre de la pieza.'); const dias = Number($('#pqDiasPieza').value) || 1; const p = { tipo, nombre, dias }; if (tipo === 'ENTRADA') { p.fechas = Array.from({ length: dias }, (_, i) => masDias(PQ.desde, 1 + i)); p.parquesDia = []; } if (tipo === 'TRANSPORTE') p.fechas = Array.from({ length: dias }, (_, i) => masDias(PQ.desde, 1 + i)); if (tipo === 'ACTIVIDAD') p.fecha = masDias(PQ.desde, 1); if (tipo === 'EXTRA') p.opcional = true; PQ.piezas.push(p); return cotizar(); }
  if (t.closest('#pqCotizacion')) { leerPaquete(); return imprimirCotizacion(false); }
  if (t.closest('#pqCrear')) return crearPaquete();
  // entradas
  const gc = t.closest('[data-guardarcod]'); if (gc) { const id = gc.dataset.guardarcod; const r = await api('/api/op/entrada', { id, codigos: document.querySelector(`[data-codigos="${id}"]`).value }); aviso(r.ok ? 'Guardado.' : r.data.error); return vEntradas(); }
  // reportes
  const rt = t.closest('[data-rtipo]'); if (rt) { RP.tipo = rt.dataset.rtipo; RP.clave = ''; return vReportes(); }
  const rc = t.closest('[data-rclave]'); if (rc) { RP.clave = rc.dataset.rclave; return pintarReporte(); }
  if (t.closest('#rExcel')) { location.href = `/api/op/reporte.csv?desde=${RP.desde}&hasta=${RP.hasta}&tipo=${RP.tipo}&sede=${encodeURIComponent(RP.sede)}`; return; }
  if (t.closest('#rPdf')) return imprimirReporte();
  // configuración
  const ct = t.closest('[data-cftab]'); if (ct) { cfTab = ct.dataset.cftab; return pintarConfig(); }
  const gu = t.closest('[data-guardar]'); if (gu) {
    const tr = gu.closest('[data-fila]'); const d = leerFila(tr); const nombre = gu.dataset.guardar;
    if (nombre === 'tarifas') d.tarifario_id = cfTarifario;
    if (nombre === 'paquetes') { try { d.piezas = JSON.parse(d.piezas || '[]'); } catch (e) { return aviso('Las piezas no son un JSON válido.'); } }
    if (nombre === 'choferes' && !d.pin) delete d.pin;
    const r = await api(`/api/op/config/${nombre}/guardar`, d); aviso(r.ok ? '✔ Guardado.' : r.data.error); if (r.ok) { await vConfig(); const ini = await api('/api/op/inicio'); if (ini.ok) I = ini.data; } return;
  }
  const bo = t.closest('[data-borrar]'); if (bo) {
    const id = bo.dataset.id || (bo.closest('[data-fila]') || {}).dataset.fila;
    if (!confirm(bo.dataset.borrar === 'tarifarios' ? '¿Borrar el tarifario y todas sus tarifas?' : '¿Borrar esta fila?')) return;
    const r = await api(`/api/op/config/${bo.dataset.borrar}/borrar`, { id }); aviso(r.ok ? 'Borrado.' : r.data.error); return vConfig();
  }
  const tf = t.closest('[data-tarifario]'); if (tf) { cfTarifario = Number(tf.dataset.tarifario); return cfTarifarios(); }
  if (t.closest('#ntCrear')) { const tipo = $('#ntTipo').value; const r = await api('/api/op/config/tarifarios/guardar', { nombre: $('#ntNombre').value, tipo, agencia_id: tipo === 'venta' ? $('#ntAgencia').value : '', proveedor_id: tipo === 'costo' ? $('#ntProveedor').value : '', activo: true }); if (!r.ok) return aviso(r.data.error); cfTarifario = r.data.id; return vConfig(); }
  if (t.closest('#cfRecalcular')) { const r = await api('/api/op/recalcular', {}); return aviso(r.ok ? `✔ ${r.data.recalculados} servicio(s) recalculados (los ajustados a mano no cambian).` : r.data.error, 6000); }
  if (t.closest('#cfGuardarPl')) {
    const pl2 = JSON.parse(JSON.stringify(CF.plantillas));
    document.querySelectorAll('[data-pl]').forEach(el => { const [d, k] = el.dataset.pl.split('.'); pl2[d][k] = k === 'validez_dias' ? Number(el.value) || 0 : el.value; });
    document.querySelectorAll('[data-plbool]').forEach(el => { const [d, k] = el.dataset.plbool.split('.'); pl2[d][k] = el.checked; });
    pl2.operativo.columnas = [...document.querySelectorAll('[data-plcol]')].filter(x => x.checked).map(x => x.dataset.plcol);
    const r = await api('/api/op/config/plantillas', pl2); aviso(r.ok ? '✔ Plantillas guardadas.' : r.data.error); if (r.ok) { I.plantillas = pl2; CF.plantillas = pl2; } return;
  }
  if (t.closest('#cfGuardarRg')) {
    const d = {}; document.querySelectorAll('[data-rg]').forEach(el => { d[el.dataset.rg] = el.value; });
    d.tiempos_zona = Object.fromEntries($('#rgZonas').value.split('\n').map(l => l.split('=')).filter(x => x.length === 2 && x[0].trim()).map(([z, m]) => [z.trim(), Number(m) || 0]));
    const r = await api('/api/op/config/reglas', d); aviso(r.ok ? '✔ Reglas guardadas.' : r.data.error); return;
  }
  if (t.closest('#vuGuardar')) { const r = await api('/api/op/config/vuelos', { proveedor: $('#vuProv').value, rapidapi_host: $('#vuHost').value, llave_aerodatabox: $('#vuAdb').value, llave_flightaware: $('#vuFa').value }); aviso(r.ok ? '✔ Guardado.' : r.data.error); return vConfig(); }
  if (t.closest('#vuProbar')) { $('#vuRes').textContent = 'Consultando…'; const r = await api('/api/op/config/vuelos/probar', { proveedor: $('#vuProv').value, vuelo: $('#vuVuelo').value, fecha: $('#vuFecha').value }); $('#vuRes').textContent = r.ok ? JSON.stringify(r.data.resultado, null, 2) || 'Sin datos para ese vuelo y fecha.' : r.data.error; return; }
  if (t.closest('#waGuardar')) { const d = {}; ['chatwoot_url', 'cuenta', 'inbox_id', 'plantilla', 'idioma', 'token'].forEach(k => { d[k] = $('#wa_' + k).value; }); d.mensaje = $('#wa_mensaje').value; d.auto_al_asignar = $('#wa_auto').checked; const r = await api('/api/op/config/whatsapp', d); aviso(r.ok ? '✔ Guardado.' : r.data.error); return vConfig(); }
});
document.addEventListener('change', async ev => {
  const t = ev.target;
  if (t.id === 'fFecha') { S.fecha = t.value || I.hoy; if (S.filtro === 'sin_fecha') S.filtro = 'todo'; return ir(S.vista); }
  const n = t.closest('#nServicios [data-i]'); if (n && t.dataset.k) { nuevos[Number(n.dataset.i)][t.dataset.k] = t.value; if (t.dataset.k === 'tipo') pintarNuevos(); return; }
  if (t.closest('#vista') && S.vista === 'paquetes') {
    if (t.dataset.pfecha) { const [i, k] = t.dataset.pfecha.split(':').map(Number); PQ.piezas[i].fechas[k] = t.value; }
    if (t.dataset.pparque) { const [i, k] = t.dataset.pparque.split(':').map(Number); PQ.piezas[i].parquesDia[k] = t.value; }
    if (t.dataset.incluir) PQ.piezas[Number(t.dataset.incluir)].incluir = t.checked;
    if (t.id === 'pqDesde') { leerPaquete(); prepararPiezas(); }
    return cotizar();
  }
  if (t.id === 'rDesde' || t.id === 'rHasta' || t.id === 'rSede') { RP.desde = $('#rDesde').value; RP.hasta = $('#rHasta').value; RP.sede = $('#rSede').value; return vReportes(); }
  if (t.id === 'cfPublico') { if (t.checked && !confirm('¿Abrir Operaciones a los usuarios? Cada uno verá lo que su permiso le da.')) { t.checked = false; return; } const r = await api('/api/op/config/publico', { publico: t.checked }); aviso(r.ok ? (t.checked ? 'Operaciones abierto a los usuarios.' : 'Solo tú lo ves ("Próximamente" para los demás).') : r.data.error); I.publico = t.checked; return pintarMenu(); }
  if (t.dataset.mod) { const r = await api('/api/op/config/modulos', { [t.dataset.mod]: t.checked }); if (r.ok) { I.modulos = r.data.modulos; CF.modulos = r.data.modulos; pintarMenu(); aviso('✔ Módulo ' + (t.checked ? 'encendido' : 'apagado') + '.'); } return; }
  if (t.id === 'cfExcelTarifas') return subirExcel(t, { tipo: 'tarifas', tarifario_id: cfTarifario, reemplazar: $('#cfReemplazar').checked });
  if (t.id === 'cfExcelHoteles') return subirExcel(t, { tipo: 'hoteles' });
});
document.addEventListener('input', ev => { if (ev.target.id === 'fBuscar') { S.q = ev.target.value; clearTimeout(timers.q); timers.q = setTimeout(() => { const pos = ev.target.selectionStart; pintarOperaciones(); const b = $('#fBuscar'); b.focus(); b.setSelectionRange(pos, pos); }, 250); } });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') { cerrarPop(); cerrarLat(); } });
iniciar();
</script>
