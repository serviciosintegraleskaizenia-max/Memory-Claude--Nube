<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zentralia App · Asistente</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23f97316'/%3E%3Cstop offset='1' stop-color='%23fbbf24'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='4' y='4' width='56' height='56' rx='14' fill='url(%23g)'/%3E%3Cpath d='M19 18h26v6L28 41h17v6H19v-6l17-17H19z' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root { --verde:#008069; --tarjeta:#fff; --texto:#111b21; --suave:#667781; --borde:#e9edef; --chat:#efeae2; }
  body.oscuro { --tarjeta:#202c33; --texto:#e9edef; --suave:#8696a0; --borde:#2a3942; --chat:#0b141a; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { font-family:'Segoe UI',Arial,sans-serif; background:#f0f2f5; color:var(--texto); margin:0; display:flex; flex-direction:column; }
  body.oscuro { background:#111b21; }
  header { background:var(--verde); color:#fff; padding:10px 14px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:17px; font-weight:600; }
  main { flex:1; min-height:0; display:flex; flex-direction:column; padding:0; }
  .caja { background:transparent; padding:6px 12px; }
  .ayuda { font-size:12.5px; line-height:1.45; color:var(--suave); margin:0; }
  .ayuda b { color:var(--texto); }
  .barra { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:0 0 4px; }
  select, textarea { font-family:inherit; font-size:14px; padding:8px 10px; border:1px solid var(--borde); border-radius:8px; background:var(--tarjeta); color:var(--texto); }
  .btn, .btn-sec, .mini { border-radius:8px; cursor:pointer; font-size:13.5px; border:0; font-family:inherit; }
  .btn { background:var(--verde); color:#fff; padding:9px 16px; font-weight:600; border-radius:999px; }
  .btn-sec { background:var(--tarjeta); color:var(--texto); padding:8px 12px; border:1px solid var(--borde); }
  .mini { background:#fff; color:var(--verde); padding:3px 10px; font-size:12px; border:1px solid #d1d7db; border-radius:999px; }
  .chat { flex:1; min-height:0; display:flex; flex-direction:column; gap:6px; background:var(--chat); padding:12px 10px; overflow-y:auto; }
  .burbuja { max-width:80%; padding:6px 9px 4px; border-radius:8px; font-size:14.2px; line-height:1.38; white-space:pre-wrap; overflow-wrap:anywhere; box-shadow:0 1px 0.5px rgba(11,20,26,.13); }
  .cliente { align-self:flex-end; background:#d9fdd3; color:#111b21; border-top-right-radius:0; }
  .bot { align-self:flex-start; background:#fff; color:#111b21; border-top-left-radius:0; }
  body.oscuro .cliente { background:#005c4b; color:#e9edef; }
  body.oscuro .bot { background:#202c33; color:#e9edef; }
  .meta { align-self:flex-start; font-size:12px; color:var(--suave); display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin:-2px 0 2px 2px; }
  .chip { display:inline-block; border-radius:999px; padding:1px 8px; font-size:11.5px; font-weight:600; background:#fff; color:var(--verde); border:1px solid #d1d7db; }
  .asesor { align-self:flex-start; max-width:80%; background:#fef3c7; color:#78350f; border:1px solid #fde68a; border-radius:10px; padding:7px 10px; font-size:13px; }
  .error { align-self:flex-start; background:#fee2e2; color:#991b1b; border:1px solid #fecaca; border-radius:10px; padding:7px 10px; font-size:13px; }
  .sugerir { align-self:flex-start; width:min(560px,92%); background:#fff; border:1px solid #d1d7db; border-radius:10px; padding:10px; }
  .sugerir textarea { width:100%; resize:vertical; border-radius:8px; }
  .regla-ok { font-size:12px; color:var(--verde); }
  .escribir { display:flex; gap:6px; align-items:flex-end; padding:8px; background:#f0f2f5; }
  .escribir textarea { flex:1; resize:none; height:42px; border-radius:22px; border:0; background:#fff; padding:11px 14px; font-size:15px; }
  .escribir .btn-sec { border-radius:50%; width:42px; height:42px; padding:0; display:flex; align-items:center; justify-content:center; background:transparent; border:0; color:#54656f; }
  .escribir .btn-sec svg { width:20px; height:20px; }
  .escribir .btn { border-radius:50%; width:42px; height:42px; padding:0; display:flex; align-items:center; justify-content:center; }
  .escribir .btn svg { width:20px; height:20px; }
  .dictado { display:flex; align-items:center; gap:10px; margin:0 8px 6px; padding:6px 6px 6px 14px; border-radius:24px; background:#fff; color:#3b4a54; font-size:14px; box-shadow:0 1px 2px rgba(11,20,26,.12); }
  .dictado[hidden] { display:none; }
  .dictado .punto { width:10px; height:10px; border-radius:50%; background:#ea0038; animation:parpadeo 1s infinite; flex:none; }
  @keyframes parpadeo { 50% { opacity:.25; } }
  .dictado b { font-variant-numeric:tabular-nums; font-size:15px; }
  .dictado .btn-sec { margin-left:auto; width:40px; height:40px; border-radius:50%; background:#111b21; color:#fff; border:0; padding:0; display:flex; align-items:center; justify-content:center; }
  .vacio { text-align:center; color:var(--suave); padding:40px 10px; font-size:14px; }
  .toast { position:fixed; right:16px; bottom:16px; background:#111b21; color:#fff; padding:10px 15px; border-radius:10px; font-size:13.5px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.visible { opacity:1; }
  @media (max-width:600px) { .burbuja, .asesor { max-width:88%; } }
  /* Interruptor claro/oscuro */
  .tema-switch { position: relative; width: 58px; height: 28px; border-radius: 999px; background: rgba(0,0,0,.25); border: 1px solid rgba(255,255,255,.3); cursor: pointer; padding: 0; flex: none; transition: background .25s, box-shadow .2s; }
  .tema-switch:hover { box-shadow: 0 0 0 3px rgba(255,255,255,.18); }
  .tema-switch svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tema-switch .ts-pista { position: absolute; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: rgba(255,255,255,.85); }
  .tema-switch .ts-pista svg { width: 16px; height: 16px; }
  .tema-switch .ts-sol { color: #fbbf24; }
  .tema-switch .ts-luna { color: #c7d2fe; }
  .tema-switch .ts-sol { left: 7px; } .tema-switch .ts-luna { right: 7px; }
  .tema-switch .ts-bola { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; color: #f59e0b; display: flex; align-items: center; justify-content: center; transition: left .25s, color .25s; }
  .tema-switch .ts-bola svg { width: 14px; height: 14px; }
  .tema-switch .ico-luna { display: none; color: #4f46e5; }
  .tema-switch.on { background: #0f172a; border-color: rgba(255,255,255,.22); }
  .tema-switch.on .ts-bola { left: 35px; }
  .tema-switch.on .ico-sol { display: none; }
  .tema-switch.on .ico-luna { display: block; }
  /* Selector Entrenar / Vender: píldora aprobada */
  .modo { display:flex; align-items:center; gap:2px; background:rgba(0,0,0,.22); border:1px solid rgba(255,255,255,.2); border-radius:999px; padding:2px; }
  .modo button { height:26px; border:0; border-radius:999px; background:transparent; color:#d1fae5; font-family:inherit; font-size:11.5px; font-weight:600; display:flex; align-items:center; gap:5px; padding:0 10px 0 8px; cursor:pointer; }
  .modo button svg { width:13px; height:13px; flex:none; }
  .modo button.on { color:#fff; }
  .modo button[data-modo="entrenamiento"].on { background:#1679c2; }
  .modo button[data-modo="venta"].on { background:#f97316; }
  .grabando { background:#ea0038 !important; color:#fff !important; }
</style>
</head>
<body>
<header>
  <div><h1>🤖 Asistente</h1></div>
  <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    <div class="modo" id="modo" role="group" aria-label="Modo del asistente"><button type="button" data-modo="entrenamiento" title="Entrenamiento"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M2 9.5L12 5l10 4.5L12 14z"/><path d="M6.5 11.5V16c0 1.4 2.5 2.8 5.5 2.8s5.5-1.4 5.5-2.8v-4.5"/><path d="M22 9.5v5"/></svg><span>Entrenar</span></button><button type="button" data-modo="venta" title="Venta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><circle cx="9" cy="20" r="1.6"/><circle cx="18" cy="20" r="1.6"/><path d="M2 3.5h3l2.6 11.6a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.5L22 7H6.2"/></svg><span>Vender</span></button></div>
    <button class="tema-switch" id="btnTema" type="button" title="Cambiar a modo oscuro" aria-label="Cambiar entre modo claro y oscuro" aria-pressed="false"><span class="ts-pista ts-sol"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span><span class="ts-pista ts-luna"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span><span class="ts-bola"><span class="ico-sol"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span><span class="ico-luna"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span></span></button>
  </div>
</header>
<main>
  <div class="caja">
    <p class="ayuda">Escribe como cliente. Esto es solo una prueba: no le llega a nadie.</p>
    <p class="ayuda" id="ayudaModo" style="margin-top:8px"></p>
  </div>
  <div class="caja">
    <div class="barra">
      <select id="sede" title="Oficina"></select>
      <button class="btn-sec" id="nueva">↺ Nueva conversación</button>
    </div>
    <div class="chat" id="chat"><div class="vacio">Cargando…</div></div>
    <div class="dictado" id="dictadoBarra" hidden>
      <span class="punto"></span>
      <span>Escuchando <b id="dictadoTiempo">0:00</b></span>
      <button class="btn-sec" id="dictadoParar" type="button" title="Parar"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
    </div>
    <div class="escribir">
      <textarea id="texto" placeholder="Ej: Hola, ¿cuánto cuesta Isla Saona para 2 adultos y un niño de 7?"></textarea>
      <button class="btn-sec" id="dictarTexto" title="Dictar por voz"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <button class="btn" id="enviar" title="Enviar"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg></button>
    </div>
  </div>
</main>
<div class="toast" id="toast"></div>
<script>
const IDIOMAS = { es: 'Español', pt: 'Portugués', en: 'Inglés', fr: 'Francés', it: 'Italiano', de: 'Alemán' };
let mensajes = [];          // { rol: 'cliente'|'asistente', texto, info, error, abierto, borrador, ensenada }
let pensando = false;
let modo = 'entrenamiento'; // 'entrenamiento' (🎓) o 'venta' (🛒)
let puedeEnsenar = false;   // permiso entrenar_ia
let dictando = null;        // { r, destino, boton } mientras se dicta
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
// Las direcciones que manda el asistente se pueden tocar: un clic abre el archivo (Drive) o la página.
function conEnlaces(t) {
  return esc(t).replace(/(https?:\/\/[^\s<>"';,]+)/g, u => {
    const limpia = u.replace(/[.)]+$/, '');
    const cola = u.slice(limpia.length);
    const etiqueta = /drive\.google/.test(limpia) ? '📎 Abrir archivo' : limpia.replace(/^https?:\/\//, '').slice(0, 40) + (limpia.length > 46 ? '…' : '');
    return `<a href="${limpia}" target="_blank" rel="noopener noreferrer">${etiqueta}</a>${cola}`;
  });
}
function aviso(t) { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('visible'); clearTimeout(aviso.t); aviso.t = setTimeout(() => el.classList.remove('visible'), 3500); }
async function api(url, cuerpo) {
  try {
    const r = await fetch(url, cuerpo === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo) });
    let d = {}; try { d = await r.json(); } catch (e) {}
    if (r.status === 401) location.href = '/';
    return { ok: r.ok, data: d };
  } catch (e) { return { ok: false, data: { error: 'No hay conexión con el panel.' } }; }
}
// Textos de la ayuda según el modo.
function pintarModo() {
  document.querySelectorAll('#modo [data-modo]').forEach(b => b.classList.toggle('on', b.dataset.modo === modo));
  const ayuda = document.getElementById('ayudaModo');
  ayuda.innerHTML = modo === 'venta'
    ? '<b>🛒 Venta:</b> responde solo con las reglas aprobadas.'
    : '<b>🎓 Entrenamiento:</b> en una respuesta, toca 💡 Enseñar para proponer una regla.';
  document.getElementById('texto').placeholder = 'Escribe como cliente…';
}
function pintar() {
  const c = document.getElementById('chat');
  if (!mensajes.length) { c.innerHTML = '<div class="vacio">Empieza la conversación como si fueras un cliente.</div>'; return; }
  c.innerHTML = mensajes.map((m, i) => {
    if (m.rol === 'cliente') return `<div class="burbuja cliente">${esc(m.texto)}</div>`;
    if (m.error) return `<div class="error">⛔ ${esc(m.error)}</div>`;
    const x = m.info || {};
    const ensenar = modo === 'entrenamiento' && puedeEnsenar && !m.abierto;
    return `<div class="burbuja bot">${conEnlaces(m.texto)}</div>` +
      (x.pasar_a_asesor ? `<div class="asesor">👤 <b>Aquí pasaría a un asesor de ${esc(x.sede)}</b> <small>(este recuadro es solo para la prueba: el cliente no lo ve; en Messenger o Instagram le llega al asesor como nota privada)</small>${x.motivo_texto ? ' · ' + esc(x.motivo_texto) : ''}${x.resumen_para_asesor ? `<br>${esc(x.resumen_para_asesor)}` : ''}</div>` : '') +
      `<div class="meta">${x.idioma ? `<span class="chip">${esc(IDIOMAS[x.idioma] || x.idioma)}</span>` : ''}${x.web && x.web.usada ? '<span class="chip">🌐 buscó en internet</span>' : ''}` +
      `${ensenar ? `<button class="mini" data-ensenar="${i}" title="Enseñar: cómo debió responder">💡 Enseñar</button>` : ''}` +
      `${m.ensenada ? '<span class="regla-ok">✔ Regla enviada para confirmar</span>' : ''}</div>` +
      (m.abierto ? `<div class="sugerir"><b style="font-size:13px">¿Cómo debió responder?</b>
        <textarea id="sug${i}" rows="4" placeholder="Escribe la regla o dicta (ej. el precio del niño es otro, ofrecer el traslado siempre…)">${esc(m.borrador || '')}</textarea>
        <div style="display:flex;gap:6px;justify-content:flex-end;margin-top:6px"><button class="btn-sec" data-dictar="sug${i}" title="Dictar por voz"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button><button class="btn-sec" data-cancelar="${i}">Cancelar</button><button class="btn" data-proponer="${i}">Proponer regla</button></div></div>` : '');
  }).join('') + (pensando ? '<div class="burbuja bot" style="opacity:.6">escribiendo…</div>' : '');
  c.scrollTop = c.scrollHeight;
}
const historial = hasta => mensajes.slice(0, hasta).filter(m => !m.error).map(m => ({ rol: m.rol, texto: m.texto }));
async function enviar() {
  const caja = document.getElementById('texto');
  const t = caja.value.trim(); if (!t || pensando) return;
  mensajes.push({ rol: 'cliente', texto: t }); caja.value = ''; pensando = true; pintar();
  const r = await api('/api/asistente/chat', { sede: document.getElementById('sede').value, mensajes: historial(mensajes.length), modo });
  pensando = false;
  mensajes.push(r.ok ? { rol: 'asistente', texto: r.data.respuesta, info: r.data } : { rol: 'asistente', error: r.data.error || 'No respondió.' });
  pintar(); caja.focus();
}
// Enseñar: la persona escribe o dicta cómo debió responder; eso se propone como regla (no se guarda como aprobada).
async function proponerRegla(i) {
  const m = mensajes[i];
  const ta = document.getElementById('sug' + i);
  const v = (ta ? ta.value : (m.borrador || '')).trim();
  if (!v) return aviso('Escribe o dicta la regla primero.');
  const medio = ta && ta.dataset.medio === 'voz' ? 'voz' : 'texto';
  const r = await api('/api/entrenamiento/proponer', { texto: v, medio, origen: 'prueba del asistente' });
  if (!r.ok) return aviso(r.data.error || 'No se pudo enviar la regla.');
  m.ensenada = true; m.abierto = false; m.borrador = ''; pintar();
  aviso('Regla enviada. Confírmala en Base del asistente → Entrenamiento.');
}
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (t.id === 'enviar') return enviar();
  if (t.id === 'nueva') { mensajes = []; return pintar(); }
  if (t.id === 'dictadoParar') { if (dictando) dictando.r.stop(); return; }
  if (t.closest && t.closest('#modo')) { modo = t.dataset.modo; try { localStorage.setItem('modoAsis', modo); } catch (er) {} pintarModo(); return pintar(); }
  if (d.ensenar !== undefined) { const m = mensajes[d.ensenar]; m.abierto = true; pintar(); const ta = document.getElementById('sug' + d.ensenar); if (ta) ta.focus(); return; }
  if (d.cancelar !== undefined) { mensajes[d.cancelar].abierto = false; return pintar(); }
  if (d.proponer !== undefined) return proponerRegla(Number(d.proponer));
  if (t.closest && t.closest('#btnTema')) { document.body.classList.toggle('oscuro'); pintarTemaAsis(); try { localStorage.setItem('tema', document.body.classList.contains('oscuro') ? 'oscuro' : 'claro'); } catch (er) {} return; }
  if (t.id === 'dictarTexto') return dictar(document.getElementById('texto'), t);
  if (d.dictar) return dictar(document.getElementById(d.dictar), t);
});
// Interruptor claro/oscuro: la bola va al lado de la luna cuando está en oscuro.
function pintarTemaAsis() {
  const b = document.getElementById('btnTema');
  const o = document.body.classList.contains('oscuro');
  b.classList.toggle('on', o);
  b.title = o ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro';
}
// Dictar por voz (Chrome o Edge): el texto aparece mientras se habla, con contador y botón para parar.
// No se envía solo: queda en el cuadro para revisarlo.
function dictar(destino, boton) {
  if (dictando) { dictando.r.stop(); return; }
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!R) { aviso('Este navegador no permite dictar. Usa Chrome o Edge.'); return; }
  const r = new R();
  r.lang = 'es-PE'; r.continuous = true; r.interimResults = true; r.maxAlternatives = 1;
  const base = destino.value ? destino.value + ' ' : '';
  let fijo = '';
  const barra = document.getElementById('dictadoBarra');
  const tiempo = document.getElementById('dictadoTiempo');
  const t0 = Date.now();
  const reloj = setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000); tiempo.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }, 250);
  tiempo.textContent = '0:00'; barra.hidden = false; boton.classList.add('grabando');
  dictando = { r, destino, boton };
  r.onresult = e => {
    let interino = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const tx = e.results[i][0].transcript;
      if (e.results[i].isFinal) fijo += tx; else interino += tx;
    }
    destino.value = base + fijo + interino;
    destino.dataset.medio = 'voz';
    destino.dispatchEvent(new Event('input', { bubbles: true }));
  };
  r.onerror = ev => { if (ev.error !== 'no-speech' && ev.error !== 'aborted') aviso('No pude escuchar. Revisa el micrófono y el permiso del navegador.'); };
  r.onend = () => { clearInterval(reloj); barra.hidden = true; boton.classList.remove('grabando'); dictando = null; };
  r.start();
}
document.addEventListener('input', e => {
  const id = e.target.id || '';
  if (!id.startsWith('sug')) return;
  const m = mensajes[id.slice(3)]; if (m) m.borrador = e.target.value;
  if (e.isTrusted) e.target.dataset.medio = 'texto'; // escrito con el teclado; lo dictado llega como evento propio
});
document.getElementById('texto').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviar(); } });
document.getElementById('sede').addEventListener('change', () => { if (mensajes.length) { mensajes = []; pintar(); aviso('Nueva conversación en la otra oficina.'); } });
(async () => {
  try { if (localStorage.getItem('tema') === 'oscuro') { document.body.classList.add('oscuro'); pintarTemaAsis(); } } catch (e) {}
  try { const g = localStorage.getItem('modoAsis'); if (g === 'venta' || g === 'entrenamiento') modo = g; } catch (e) {}
  pintarModo();
  const s = await api('/api/sesion');
  if (!s.ok) return;
  if (!s.data.permisos || !s.data.permisos.probar_asistente) { document.getElementById('chat').innerHTML = '<div class="vacio">No tienes permiso para probar el asistente. Pídeselo al gerente o a Kaizen IA.</div>'; return; }
  puedeEnsenar = !!s.data.permisos.entrenar_ia;
  const i = await api('/api/asistente/info');
  if (!i.ok) { document.getElementById('chat').innerHTML = `<div class="vacio">${esc(i.data.error || 'El asistente no está disponible.')}</div>`; return; }
  const sel = document.getElementById('sede');
  sel.innerHTML = (i.data.sedes.length ? i.data.sedes : ['']).map(x => `<option value="${esc(x)}">${x ? 'Oficina de ' + esc(x) : 'General'}</option>`).join('');
  pintar();
  setInterval(() => api('/api/latido', { activo: true }), 60000);
})();
</script>
