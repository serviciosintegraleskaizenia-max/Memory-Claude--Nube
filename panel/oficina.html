<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zentralia App · Oficina</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23f97316'/%3E%3Cstop offset='1' stop-color='%23fbbf24'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='4' y='4' width='56' height='56' rx='14' fill='url(%23g)'/%3E%3Cpath d='M19 18h26v6L28 41h17v6H19v-6l17-17H19z' fill='%23fff'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --fondo:#f1f5f9; --tarjeta:#fff; --texto:#0f172a; --suave:#64748b; --borde:#e2e8f0; --hover:#f8fafc; --azul:#1679c2; --verde:#16a34a; --rojo:#dc2626; --ambar:#d97706; --lateral:#0b1f3a; --lateral2:#1e3a5f; }
  body.oscuro { --fondo:#0f172a; --tarjeta:#1e293b; --texto:#e2e8f0; --suave:#94a3b8; --borde:#334155; --hover:#273449; --lateral:#020617; --lateral2:#1e293b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Segoe UI',Arial,sans-serif; background:var(--fondo); color:var(--texto); display:flex; min-height:100vh; }
  aside { width:236px; background:var(--lateral); color:#cbd5e1; padding:16px 12px; flex:none; display:flex; flex-direction:column; gap:3px; position:sticky; top:0; height:100vh; overflow-y:auto; }
  .marca { display:flex; align-items:center; gap:10px; padding:4px 8px 16px; color:#fff; }
  .marca .logo { width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg,#f97316,#fbbf24); display:grid; place-items:center; font-family:'Montserrat','Segoe UI',Arial,sans-serif; font-weight:800; font-size:20px; flex:none; transform:rotate(-6deg); box-shadow:0 2px 6px rgba(249,115,22,.35); }
  .marca b { font-family:'Montserrat','Segoe UI',Arial,sans-serif; font-weight:800; letter-spacing:.2px; }
  .marca b { display:block; font-size:15px; } .marca small { color:#94a3b8; font-size:11px; }
  aside button.nav { all:unset; cursor:pointer; color:#cbd5e1; padding:9px 12px; border-radius:9px; font-size:14px; display:flex; gap:10px; align-items:center; }
  aside button.nav:hover { background:#16304f; }
  aside button.nav.activo { background:var(--lateral2); color:#fff; font-weight:600; }
  aside .num { margin-left:auto; background:#dc2626; color:#fff; border-radius:999px; font-size:11px; padding:0 7px; }
  aside .sep { font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:#64748b; padding:12px 12px 4px; }
  aside .pie { margin-top:auto; padding-top:12px; display:flex; flex-direction:column; gap:6px; }
  aside .pie button { all:unset; cursor:pointer; color:#94a3b8; font-size:13px; padding:6px 12px; border-radius:8px; }
  aside .pie button:hover { background:#16304f; color:#fff; }
  main { flex:1; padding:22px 28px 40px; min-width:0; }
  .cabeza { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .cabeza h1 { margin:0; font-size:22px; } .cabeza p { margin:3px 0 0; color:var(--suave); font-size:13px; }
  .acciones { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .btn, .btn-sec, .btn-mini { border-radius:8px; cursor:pointer; font-size:13px; border:1px solid var(--borde); font-family:inherit; }
  .btn { background:var(--azul); color:#fff; border-color:var(--azul); padding:8px 14px; font-weight:600; }
  .btn-sec { background:var(--tarjeta); color:var(--texto); padding:8px 14px; }
  .btn-mini { background:var(--tarjeta); color:var(--texto); padding:4px 9px; font-size:12px; margin:1px; }
  .btn-mini.p { background:var(--azul); color:#fff; border-color:var(--azul); }
  .btn-mini.peligro { color:var(--rojo); border-color:#fca5a5; }
  .btn-ayuda { width:30px; height:30px; border-radius:50%; border:1px solid var(--borde); background:var(--tarjeta); color:var(--azul); font-weight:800; cursor:pointer; font-size:14px; }
  .ayuda { display:none; background:#eff6ff; border:1px solid #bfdbfe; color:#1e3a8a; border-radius:12px; padding:12px 16px; font-size:13.5px; line-height:1.5; margin-bottom:16px; }
  body.oscuro .ayuda { background:#172554; border-color:#1e3a8a; color:#dbeafe; }
  .ayuda.abierta { display:block; } .ayuda ul { margin:6px 0 0; padding-left:20px; }
  select, input, textarea { font-family:inherit; font-size:13px; padding:7px 9px; border:1px solid var(--borde); border-radius:8px; background:var(--tarjeta); color:var(--texto); }
  .kpis { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-bottom:16px; }
  .kpi { background:var(--tarjeta); border-radius:14px; padding:14px 16px; box-shadow:0 1px 3px #0f172a14; border-left:4px solid var(--azul); min-width:0; }
  .kpi .e { font-size:12px; color:var(--suave); text-transform:uppercase; letter-spacing:.4px; }
  .kpi .n { font-size:24px; font-weight:700; margin-top:4px; font-variant-numeric:tabular-nums; }
  .kpi .d { font-size:12px; color:var(--suave); margin-top:2px; }
  .rej { display:grid; gap:16px; } .r2 { grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); } .r21 { grid-template-columns:minmax(0,2fr) minmax(0,1fr); }
  .caja { background:var(--tarjeta); border-radius:14px; padding:16px 18px; box-shadow:0 1px 3px #0f172a14; margin-bottom:16px; min-width:0; overflow-x:auto; }
  .caja h2 { margin:0 0 4px; font-size:15px; } .caja .sub { margin:0 0 12px; color:var(--suave); font-size:12px; }
  .caja .cab { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; flex-wrap:wrap; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--borde); white-space:nowrap; }
  th { color:var(--suave); font-size:12px; font-weight:600; }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
  td.envolver { white-space:normal; min-width:160px; }
  tr.apagado td { opacity:.5; }
  .chip { display:inline-block; border-radius:999px; padding:2px 9px; font-size:12px; font-weight:600; white-space:nowrap; }
  .ok { background:#dcfce7; color:#166534; } .mal { background:#fee2e2; color:#991b1b; } .ojo { background:#fef3c7; color:#92400e; } .gris { background:var(--hover); color:var(--suave); } .az { background:#dbeafe; color:#1e40af; } .mor { background:#ede9fe; color:#5b21b6; }
  body.oscuro .ok { background:#14532d; color:#bbf7d0; } body.oscuro .mal { background:#450a0a; color:#fecaca; } body.oscuro .ojo { background:#451a03; color:#fde68a; } body.oscuro .az { background:#172554; color:#bfdbfe; } body.oscuro .mor { background:#2e1065; color:#ddd6fe; }
  .alerta { display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-bottom:1px solid var(--borde); font-size:13px; }
  .alerta:last-child { border:none; } .alerta .i { font-size:18px; width:24px; text-align:center; flex:none; } .alerta small { display:block; color:var(--suave); }
  .alerta button { margin-left:auto; flex:none; }
  .punto { width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:6px; flex:none; }
  .p-bien { background:var(--verde); } .p-falla { background:var(--rojo); } .p-aviso { background:var(--ambar); } .p-gris { background:#94a3b8; }
  .vacio { text-align:center; color:var(--suave); padding:22px; font-size:13px; }
  .barra { height:8px; background:var(--borde); border-radius:6px; overflow:hidden; min-width:80px; } .barra i { display:block; height:8px; border-radius:6px; background:#2a78d6; }
  /* Calendario */
  .cal { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px; }
  .cal .dn { font-size:12px; color:var(--suave); text-align:center; font-weight:600; padding-bottom:2px; }
  .cal .d { background:var(--tarjeta); border:1px solid var(--borde); border-radius:10px; min-height:104px; padding:6px; font-size:12px; cursor:pointer; min-width:0; }
  .cal .d:hover { border-color:#93c5fd; }
  .cal .d.fuera { opacity:.4; } .cal .d.hoy { border:2px solid var(--azul); }
  .cal .d b { display:block; margin-bottom:4px; }
  .ev { display:block; border-radius:6px; padding:2px 6px; margin-bottom:3px; font-size:11px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
  .ev.hecho { text-decoration:line-through; opacity:.6; }
  /* Negocios */
  .negocios { display:grid; grid-template-columns:repeat(auto-fill,minmax(360px,1fr)); gap:14px; }
  .negocio { background:var(--tarjeta); border-radius:14px; padding:14px 16px; box-shadow:0 1px 3px #0f172a14; border-top:4px solid var(--verde); min-width:0; }
  .negocio.falla { border-top-color:var(--rojo); } .negocio.aviso { border-top-color:var(--ambar); } .negocio.gris { border-top-color:#94a3b8; }
  .negocio h3 { margin:0; font-size:16px; display:flex; justify-content:space-between; gap:8px; align-items:center; }
  .negocio .url { font-size:12px; color:var(--suave); }
  .revision { display:flex; gap:8px; align-items:flex-start; padding:6px 0; border-bottom:1px solid var(--borde); font-size:13px; }
  .revision .nom { width:150px; flex:none; font-weight:600; } .revision .det { color:var(--suave); min-width:0; overflow-wrap:anywhere; }
  .persona { display:inline-flex; align-items:center; gap:5px; background:var(--hover); border-radius:999px; padding:3px 4px 3px 10px; font-size:12px; margin:3px 4px 0 0; }
  /* Enlaces */
  .enlaces { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; }
  .enlace { border:1px solid var(--borde); border-radius:12px; padding:10px 12px; display:flex; gap:10px; align-items:center; font-size:13px; background:var(--tarjeta); min-width:0; position:relative; }
  .enlace a { color:var(--texto); text-decoration:none; font-weight:700; } .enlace a:hover { color:var(--azul); }
  .enlace .ic { width:36px; height:36px; border-radius:9px; display:grid; place-items:center; font-size:18px; flex:none; background:var(--hover); }
  .enlace small { display:block; color:var(--suave); font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .enlace .min { min-width:0; flex:1; }
  .enlace .editar { position:absolute; top:6px; right:6px; border:none; background:none; cursor:pointer; opacity:.4; font-size:13px; }
  .enlace:hover .editar { opacity:1; }
  /* Chat */
  .chat { display:grid; grid-template-columns:300px minmax(0,1fr); gap:0; background:var(--tarjeta); border-radius:14px; box-shadow:0 1px 3px #0f172a14; height:calc(100vh - 150px); min-height:420px; overflow:hidden; }
  .chat-lista { border-right:1px solid var(--borde); overflow-y:auto; }
  .chat-grupo { font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--suave); padding:12px 14px 4px; font-weight:700; }
  .chat-persona { display:flex; gap:10px; align-items:center; padding:9px 14px; cursor:pointer; border-bottom:1px solid var(--borde); }
  .chat-persona:hover, .chat-persona.activo { background:var(--hover); }
  .chat-persona .quien { flex:1; min-width:0; } .chat-persona .quien small { display:block; color:var(--suave); font-size:11.5px; }
  .avatar { width:32px; height:32px; border-radius:50%; display:grid; place-items:center; color:#fff; font-weight:700; font-size:12px; flex:none; }
  .chat-conv { display:flex; flex-direction:column; min-height:0; }
  .chat-cab { padding:12px 16px; border-bottom:1px solid var(--borde); font-weight:700; }
  .chat-cab small { display:block; font-weight:400; color:var(--suave); }
  .chat-mensajes { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:6px; background:var(--fondo); }
  .burbuja { max-width:75%; padding:8px 11px; border-radius:12px; font-size:13.5px; line-height:1.35; white-space:pre-wrap; overflow-wrap:anywhere; }
  .burbuja.mia { align-self:flex-end; background:var(--azul); color:#fff; border-bottom-right-radius:4px; }
  .burbuja.otra { align-self:flex-start; background:var(--tarjeta); border:1px solid var(--borde); border-bottom-left-radius:4px; }
  .burbuja small { display:block; font-size:10.5px; opacity:.75; margin-top:3px; }
  .chat-escribir { display:flex; gap:8px; padding:10px; border-top:1px solid var(--borde); }
  .chat-escribir textarea { flex:1; resize:none; height:60px; }
  /* Marco para Empresas y Herramientas */
  iframe.marco { width:100%; height:calc(100vh - 120px); min-height:500px; border:none; border-radius:14px; background:var(--tarjeta); box-shadow:0 1px 3px #0f172a14; }
  /* Ventana de formulario */
  .fondo-modal { position:fixed; inset:0; background:rgba(15,23,42,.55); display:none; align-items:center; justify-content:center; z-index:50; padding:16px; }
  .fondo-modal.abierto { display:flex; }
  .modal { background:var(--tarjeta); border-radius:14px; width:min(560px,100%); max-height:92vh; overflow-y:auto; padding:18px 20px; box-shadow:0 20px 50px rgba(0,0,0,.3); }
  .modal h2 { margin:0 0 12px; font-size:17px; }
  .campo { margin-bottom:12px; } .campo label { display:block; font-size:13px; font-weight:600; margin-bottom:4px; }
  .campo .ay { font-size:12px; color:var(--suave); margin-top:3px; }
  .campo input:not([type=checkbox]), .campo select, .campo textarea { width:100%; }
  .campo.chk label { display:flex; gap:8px; align-items:center; font-weight:500; }
  .fila2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .modal .pie { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; flex-wrap:wrap; }
  .modal .pie .izq { margin-right:auto; }
  .error-form { color:var(--rojo); font-size:13px; min-height:18px; }
  .toast { position:fixed; right:18px; bottom:18px; background:#0f172a; color:#fff; padding:11px 16px; border-radius:10px; font-size:13.5px; z-index:80; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.visible { opacity:1; }
  /* Base del asistente */
  .modal.ancho { width:min(920px,100%); }
  .k-doc { border:1px solid var(--borde); border-radius:10px; margin-bottom:10px; }
  .k-doc summary { cursor:pointer; padding:9px 12px; font-weight:600; font-size:13.5px; }
  .k-doc pre, .k-res pre { margin:0; padding:10px 12px; border-top:1px solid var(--borde); white-space:pre-wrap; overflow-wrap:anywhere; font-family:inherit; font-size:12.5px; line-height:1.45; max-height:420px; overflow-y:auto; background:var(--hover); }
  .k-quitado { background:#fef2f2; border:1px solid #fecaca; color:#7f1d1d; border-radius:10px; padding:10px 12px; font-size:12.5px; margin-bottom:12px; }
  body.oscuro .k-quitado { background:#450a0a; border-color:#7f1d1d; color:#fecaca; }
  .k-quitado ul { margin:4px 0 0; padding-left:18px; } .k-quitado li { margin:2px 0; }
  .k-avisos { background:#fffbeb; border:1px solid #fde68a; color:#78350f; border-radius:10px; padding:8px 12px; font-size:12.5px; margin-bottom:12px; }
  body.oscuro .k-avisos { background:#451a03; border-color:#92400e; color:#fde68a; }
  .k-res { border:1px solid var(--borde); border-radius:10px; margin-top:10px; }
  .k-res .t { padding:8px 12px; font-size:13px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .k-clave { font-family:Consolas,monospace; font-size:12.5px; background:var(--hover); border:1px solid var(--borde); border-radius:8px; padding:6px 9px; overflow-wrap:anywhere; }
  .pestanas { display:flex; gap:4px; border-bottom:1px solid var(--borde); margin:-4px 0 16px; flex-wrap:wrap; }
  .pestana { all:unset; cursor:pointer; padding:9px 14px; font-size:14px; border-bottom:3px solid transparent; color:var(--suave); border-radius:8px 8px 0 0; }
  .pestana:hover { background:var(--hover); color:var(--texto); }
  .pestana.activa { color:var(--azul); border-bottom-color:var(--azul); font-weight:600; }
  .num-p { background:#d97706; color:#fff; border-radius:999px; font-size:11px; padding:0 7px; margin-left:3px; }
  .rd-rejilla { display:grid; gap:16px; margin-bottom:16px; }
  .rd-sede { margin:0 0 8px; font-size:15px; }
  .rd-tarjeta { background:var(--tarjeta); border-radius:14px; box-shadow:0 1px 3px #0f172a14; margin-bottom:12px; border-left:4px solid #94a3b8; overflow:hidden; }
  .rd-tarjeta.conectada { border-left-color:var(--azul); } .rd-tarjeta.activa { border-left-color:var(--verde); } .rd-tarjeta.proximo { opacity:.7; }
  .rd-cab { padding:10px 14px; font-weight:700; font-size:14px; border-bottom:1px solid var(--borde); display:flex; gap:8px; align-items:center; }
  .rd-bandeja { padding:10px 14px; border-bottom:1px solid var(--borde); font-size:13px; } .rd-bandeja:last-child { border-bottom:none; }
  .rd-stats { font-size:12px; color:var(--suave); }
  .rd-vacio { padding:12px 14px; font-size:13px; color:var(--suave); text-align:center; }
  @media (max-width: 900px) { .rd-rejilla { grid-template-columns:minmax(0,1fr) !important; } }
  .k-progreso { font-size:13px; color:var(--suave); margin-top:8px; min-height:18px; }
  .k-chat { display:flex; flex-direction:column; gap:8px; background:var(--fondo); border-radius:12px; padding:12px; min-height:200px; max-height:520px; overflow-y:auto; margin:10px 0; }
  .k-chat .burbuja.mia { background:#dcf8c6; color:#0f172a; } body.oscuro .k-chat .burbuja.mia { background:#14532d; color:#e2e8f0; }
  .k-meta { align-self:flex-start; max-width:85%; font-size:11.5px; color:var(--suave); margin:-3px 0 4px 4px; }
  .k-meta details summary { cursor:pointer; } .k-meta ol { margin:4px 0 0; padding-left:18px; }
  .k-asesor { align-self:flex-start; max-width:85%; background:#fef3c7; color:#78350f; border:1px solid #fde68a; border-radius:10px; padding:7px 10px; font-size:12.5px; }
  body.oscuro .k-asesor { background:#451a03; color:#fde68a; border-color:#92400e; }
  .menu-movil { display:none; }
  @media (max-width: 900px) {
    body { display:block; }
    aside { position:fixed; left:-260px; z-index:60; transition:left .2s; height:100vh; }
    aside.abierto { left:0; }
    .menu-movil { display:inline-block; margin-bottom:10px; }
    main { padding:14px 16px 30px; }
    .kpis { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .r2, .r21 { grid-template-columns:minmax(0,1fr); }
    .chat { grid-template-columns:minmax(0,1fr); height:auto; }
    .chat-lista { max-height:260px; border-right:none; border-bottom:1px solid var(--borde); }
    .cal .d { min-height:70px; }
    .negocios { grid-template-columns:minmax(0,1fr); }
  }
</style>
</head>
<body>
<aside id="lateral">
  <div class="marca"><div class="logo">Z</div><div><b>Zentralia App</b><small>Oficina · Kaizen IA</small></div></div>
  <button class="nav" data-ir="inicio">🏠 Inicio</button>
  <button class="nav" data-ir="negocios">🩺 Estado de cada negocio <span class="num" id="numNegocios" style="display:none"></span></button>
  <button class="nav" data-ir="clientes">🏢 Clientes y cobros <span class="num" id="numCobros" style="display:none"></span></button>
  <button class="nav" data-ir="gastos">💸 Gastos</button>
  <button class="nav" data-ir="calendario">📅 Calendario</button>
  <button class="nav" data-ir="chat">💬 Chat con los negocios <span class="num" id="numChat" style="display:none"></span></button>
  <button class="nav" data-ir="enlaces">🔗 Enlaces</button>
  <button class="nav" data-ir="conocimiento">📚 Base del asistente <span class="num" id="numConocimiento" style="display:none;background:#d97706"></span></button>
  <button class="nav" data-ir="redes">📲 Redes sociales</button>
  <div class="sep">Administrar</div>
  <button class="nav" data-ir="empresas">🏗️ Empresas y demo</button>
  <button class="nav" data-ir="herramientas">🛠️ Herramientas</button>
  <div class="pie">
    <button id="btnTema">🌙 Modo oscuro</button>
    <button id="btnSalir">↩ Salir</button>
  </div>
</aside>
<main>
  <button class="btn-sec menu-movil" id="btnMenu">☰ Menú</button>
  <div id="vista"><div class="vacio">Cargando…</div></div>
</main>
<div class="fondo-modal" id="fondoModal"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
const ZONA = 'America/Santo_Domingo';
let D = null;                 // datos de /api/oficina/datos
let negocios = null;          // estado de cada negocio

/* ---------- Utilidades ---------- */
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
async function api(url, cuerpo) {
  try {
    const r = await fetch(url, cuerpo === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo) });
    let data = {}; try { data = await r.json(); } catch (e) {}
    if (r.status === 401) { location.href = '/'; }
    return { ok: r.ok, status: r.status, data };
  } catch (e) { return { ok: false, status: 0, data: { error: 'No hay conexión con el servidor.' } }; }
}
function aviso(t) { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('visible'); clearTimeout(timers.toast); timers.toast = setTimeout(() => el.classList.remove('visible'), 3500); }
function hoy() { return new Date().toLocaleDateString('sv-SE', { timeZone: ZONA }); }
function mesMas(m, n) { const d = new Date(m + '-15T12:00:00Z'); d.setUTCMonth(d.getUTCMonth() + n); return d.toISOString().slice(0, 7); }
function nombreMes(m) { const t = new Date(m + '-15T12:00:00Z').toLocaleDateString('es-DO', { month: 'long', year: 'numeric', timeZone: 'UTC' }); return t.charAt(0).toUpperCase() + t.slice(1); }
function fechaCorta(f) { if (!f) return '—'; return new Date(f.slice(0, 10) + 'T12:00:00Z').toLocaleDateString('es-DO', { day: 'numeric', month: 'short', timeZone: 'UTC' }); }
function fechaLarga(f) { return new Date(f + 'T12:00:00Z').toLocaleDateString('es-DO', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' }); }
function dinero(n, m = 'US$') { return `${m} ${Number(n || 0).toLocaleString('es-DO', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 })}`; }
function totalTexto(obj) { const e = Object.entries(obj || {}).filter(([, v]) => v); return e.length ? e.map(([m, v]) => dinero(v, m)).join(' + ') : 'US$ 0'; }
function diasEntre(a, b) { return Math.round((Date.parse(b + 'T12:00:00Z') - Date.parse(a + 'T12:00:00Z')) / 86400000); }
const COLORES = ['#2563eb', '#db2777', '#059669', '#d97706', '#7c3aed', '#0891b2', '#dc2626', '#4f46e5', '#65a30d', '#c2410c'];
function colorDe(t) { let h = 0; for (const c of String(t)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return COLORES[h % COLORES.length]; }
function iniciales(n) { return String(n || '?').trim().split(/\s+/).slice(0, 2).map(p => p[0]).join('').toUpperCase(); }
function haceCuanto(f) { if (!f) return ''; const m = Math.round((Date.now() - new Date(f).getTime()) / 60000); return m < 1 ? 'ahora' : m < 60 ? `hace ${m} min` : m < 1440 ? `hace ${Math.round(m / 60)} h` : `hace ${Math.round(m / 1440)} d`; }

function cabecera(titulo, sub, extra = '') {
  return `<div class="cabeza"><div><h1>${titulo}</h1><p>${sub}</p></div><div class="acciones">${extra}<button class="btn-ayuda" data-ayuda title="Ayuda">?</button></div></div>
    <div class="ayuda" id="cajaAyuda">${AYUDA[vista] || ''}</div>`;
}
function selectorMes() {
  const ops = []; for (let i = -12; i <= 1; i++) { const m = mesMas(hoy().slice(0, 7), i); ops.push(`<option value="${m}" ${m === mes ? 'selected' : ''}>${nombreMes(m)}</option>`); }
  return `<select id="selMes" title="Mes">${ops.reverse().join('')}</select>`;
}

/* ---------- Carga ---------- */
async function cargarDatos() {
  const r = await api('/api/oficina/datos?mes=' + encodeURIComponent(mes));
  if (!r.ok) { document.getElementById('vista').innerHTML = `<div class="vacio">${esc(r.data.error || 'No se pudo cargar la Oficina.')}</div>`; return false; }
  D = r.data;
  const vencidos = D.pagos.filter(p => p.estado === 'vencido' || p.estado === 'hoy').length;
  const n = document.getElementById('numCobros'); n.textContent = vencidos; n.style.display = vencidos ? '' : 'none';
  return true;
}
async function cargarNegocios() {
  const r = await api('/api/oficina/negocios');
  if (r.ok) negocios = r.data.negocios;
  const fallas = (negocios || []).filter(x => x.revisiones.some(v => v.estado === 'falla')).length;
  const n = document.getElementById('numNegocios'); n.textContent = fallas; n.style.display = fallas ? '' : 'none';
}
async function cargarServicios() {
  const r = await api('/api/oficina/servicios');
  if (r.ok) servicios = new Map(r.data.servicios.map(s => [s.id, s]));
}
async function cargarChatContactos() {
  const r = await api('/api/oficina/chat/contactos');
  if (!r.ok) return;
  chatEmpresas = r.data.empresas;
  const total = chatEmpresas.reduce((a, e) => a + e.gente.reduce((b, p) => b + p.noLeidos, 0), 0);
  const n = document.getElementById('numChat'); n.textContent = total; n.style.display = total ? '' : 'none';
  if (vista === 'chat') pintarListaChat();
}

async function ir(v, recargar = true) {
  vista = v;
  document.querySelectorAll('aside .nav').forEach(b => b.classList.toggle('activo', b.dataset.ir === v));
  document.getElementById('lateral').classList.remove('abierto');
  try { localStorage.setItem('oficinaVista', v); } catch (e) {}
  if (recargar) {
    if (['inicio', 'clientes', 'gastos', 'calendario', 'enlaces'].includes(v)) await cargarDatos();
    if (v === 'inicio' || v === 'negocios') await cargarNegocios();
    if (v === 'inicio' || v === 'enlaces') await cargarServicios();
    if (v === 'chat') await cargarChatContactos();
    if (v === 'conocimiento' || v === 'redes') await cargarConocimiento();
    if (v === 'redes' && R && R.tieneToken && R.cuenta && !rProbe) { const r = await api('/api/oficina/redes/probar', { empresa_id: kEmpresa }); if (r.ok) rProbe = r.data; }
    if (v === 'conocimiento' && kTab === 'config' && R && R.tieneToken && R.cuenta && !rProbe) { const r = await api('/api/oficina/redes/probar', { empresa_id: kEmpresa }); if (r.ok) rProbe = r.data; }
  }
  pintar();
}
function pintar() {
  const f = { inicio: vInicio, negocios: vNegocios, clientes: vClientes, gastos: vGastos, calendario: vCalendario, chat: vChat, enlaces: vEnlaces, conocimiento: vConocimiento, redes: vRedes, empresas: vEmpresas, herramientas: vHerramientas }[vista];
  if ((['inicio', 'clientes', 'gastos', 'calendario', 'enlaces'].includes(vista) && !D)) return;
  if ((vista === 'conocimiento' || vista === 'redes') && !K) return;
  document.getElementById('vista').innerHTML = f();
  if (vista === 'calendario') pintarCalendario();
  if (vista === 'chat') { pintarListaChat(); if (chatSel) cargarConversacion(true); }
}

/* ---------- Inicio ---------- */
function alertas() {
  const h = hoy(); const lista = [];
  for (const p of D.pagos) {
    if (p.pagado_el) continue;
    const d = diasEntre(h, p.vence);
    if (d < 0) lista.push(['⛔', `${p.empresa || 'Cobro'}: ${dinero(p.monto, p.moneda)} vencido hace ${-d} día(s)`, p.concepto, `<button class="btn-mini p" data-pagado="${p.id}">Pagado ✔</button>`, 0]);
    else if (d === 0) lista.push(['💳', `${p.empresa || 'Cobro'}: ${dinero(p.monto, p.moneda)} vence hoy`, p.concepto, `<button class="btn-mini p" data-pagado="${p.id}">Pagado ✔</button>`, 1]);
    else if (d <= 3) lista.push(['🔔', `${p.empresa || 'Cobro'}: ${dinero(p.monto, p.moneda)} vence en ${d} día(s)`, p.concepto + ' · ' + fechaCorta(p.vence), '', 3]);
  }
  for (const n of negocios || []) for (const r of n.revisiones) if (r.estado === 'falla') lista.push(['🩺', `${n.nombre}: ${r.nombre}`, r.detalle, `<button class="btn-mini" data-ir="negocios">Ver</button>`, 0]);
  for (const n of negocios || []) for (const a of n.alertas || []) lista.push(['⚠️', `${n.nombre}: alerta abierta`, a.texto, '', 1]);
  for (const x of D.enlaces) { const s = servicios.get(x.id); if (x.vigilar && s && !s.ok) lista.push(['🔌', `${x.nombre} no responde`, s.error || ('Código ' + s.codigo), `<a class="btn-mini" href="${esc(x.url)}" target="_blank" rel="noopener">Abrir</a>`, 1]); }
  for (const e of D.empresas) if (e.ia && e.ia.restante !== null && e.ia.restante !== undefined && e.ia.restante < 3) lista.push(['🪙', `${e.nombre}: a su clave de IA le quedan ${dinero(e.ia.restante)}`, 'Súbele el límite o recarga en OpenRouter', '', 2]);
  for (const ev of D.eventos) if (!ev.hecho && ev.fecha <= h) lista.push(['🛠️', `${ev.fecha < h ? 'Pendiente desde ' + fechaCorta(ev.fecha) : 'Hoy'}: ${ev.titulo}`, ev.empresa || ev.nota || '', `<button class="btn-mini" data-hecho="${ev.id}">Hecho ✔</button>`, 2]);
  return lista.sort((a, b) => a[4] - b[4]);
}
function proximos(dias) {
  const h = hoy(); const fin = new Date(h + 'T12:00:00Z'); fin.setUTCDate(fin.getUTCDate() + dias); const hasta = fin.toISOString().slice(0, 10);
  return itemsCalendario(h.slice(0, 7)).concat(itemsCalendario(mesMas(h.slice(0, 7), 1))).filter(x => x.fecha >= h && x.fecha <= hasta && !x.hecho && !x.listo)
    .sort((a, b) => a.fecha.localeCompare(b.fecha) || (a.hora || '').localeCompare(b.hora || ''));
}

  return cabecera(`${saludo} 👋`, `${fechaLarga(hoy())} · todo tu negocio en una pantalla`, selectorMes()) + `
  <div class="kpis">
    <div class="kpi"><div class="e">Cobrado en ${esc(D.nombreMes)}</div><div class="n">${totalTexto(t.cobrado)}</div><div class="d">Ingreso fijo mensual: ${totalTexto(t.ingresoFijo)}</div></div>
    <div class="kpi" style="border-color:var(--ambar)"><div class="e">Por cobrar</div><div class="n">${totalTexto(t.porCobrar)}</div><div class="d">${Object.keys(t.vencido).length ? 'Vencido: ' + totalTexto(t.vencido) : 'Nada vencido'}</div></div>
    <div class="kpi" style="border-color:var(--rojo)"><div class="e">Gastos del mes</div><div class="n">${totalTexto(t.gastos)}</div><div class="d">IA ${totalTexto(t.ia)} · fijos al mes ${totalTexto(t.gastosFijos)}</div></div>
    <div class="kpi" style="border-color:var(--verde)"><div class="e">Te queda (US$)</div><div class="n">${dinero(Math.round(ganancia * 100) / 100)}</div><div class="d">cobrado − gastos del mes</div></div>
  </div>
  <div class="rej r2">
    <div class="caja"><h2>⚠️ Requiere tu atención</h2><p class="sub">${al.length ? al.length + ' cosa(s)' : 'Todo en orden'}</p>
      ${al.length ? al.map(([i, b, s, btn]) => `<div class="alerta"><span class="i">${i}</span><div><b>${esc(b)}</b><small>${esc(s)}</small></div>${btn}</div>`).join('') : '<div class="vacio">✅ No hay nada pendiente. ¡Buen trabajo!</div>'}

      ${(negocios || []).length ? `<table>${negocios.map(n => { const peor = estadoPeor(n); return `<tr><td><span class="punto p-${peor}"></span>${esc(n.nombre)}${n.es_demo ? ' <span class="chip mor">demo</span>' : ''}</td><td class="n">${(n.conectados || []).length} conectado(s)</td></tr>`; }).join('')}</table>` : '<div class="vacio">Sin negocios todavía.</div>'}
      ${[...servicios.values()].length ? `<table style="margin-top:8px">${D.enlaces.filter(x => x.vigilar).map(x => { const s = servicios.get(x.id) || {}; return `<tr><td><span class="punto p-${s.ok ? 'bien' : 'falla'}"></span>${esc(x.nombre)}</td><td class="n">${s.ok ? s.ms + ' ms' : 'no responde'}</td></tr>`; }).join('')}</table>` : ''}
    </div>
  </div>
  <div class="rej r2">
    <div class="caja"><h2>Cobrado y gastado (6 meses, US$)</h2><p class="sub">Azul = cobrado · naranja = gastos</p>${grafica(D.serie)}</div>
    <div class="caja"><div class="cab"><div><h2>📅 Próximos 7 días</h2><p class="sub">Del calendario</p></div><button class="btn-mini" data-nuevo-evento="${hoy()}">+ Tarea</button></div>
      ${prox.length ? prox.map(x => `<div class="alerta"><span class="i">${x.icono}</span><div><b>${esc(fechaCorta(x.fecha))}${x.hora ? ' · ' + esc(x.hora) : ''} · ${esc(x.titulo)}</b><small>${esc(x.detalle || '')}</small></div></div>`).join('') : '<div class="vacio">Nada en los próximos 7 días.</div>'}
    </div>
  </div>`;
}
function estadoPeor(n) { const e = n.revisiones.map(r => r.estado); return e.includes('falla') ? 'falla' : e.includes('aviso') ? 'aviso' : 'bien'; }
function grafica(serie) {
  const W = 600, H = 200, izq = 46, abajo = 26, arriba = 16;
  const max = Math.max(10, ...serie.map(s => Math.max(s.cobrado, s.gastos)));
  const paso = Math.pow(10, Math.floor(Math.log10(max))) * (max / Math.pow(10, Math.floor(Math.log10(max))) > 5 ? 2 : 1);
  const tope = Math.ceil(max / paso) * paso;
  const y = v => arriba + (H - arriba - abajo) * (1 - v / tope);
  const ancho = (W - izq - 10) / serie.length;
  let s = '';
  for (let v = 0; v <= tope; v += paso) s += `<line x1="${izq}" x2="${W - 10}" y1="${y(v)}" y2="${y(v)}" stroke="var(--borde)"/><text x="${izq - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--suave)">${v}</text>`;
  serie.forEach((m, i) => {
    const x = izq + ancho * i + ancho / 2;
    const g = Math.min(24, ancho * 0.3);
    s += `<rect x="${x - g - 1}" y="${y(m.cobrado)}" width="${g}" height="${y(0) - y(m.cobrado)}" rx="3" fill="#2a78d6"><title>Cobrado ${dinero(m.cobrado)}</title></rect>`;
    s += `<rect x="${x + 1}" y="${y(m.gastos)}" width="${g}" height="${y(0) - y(m.gastos)}" rx="3" fill="#eb6834"><title>Gastos ${dinero(m.gastos)}</title></rect>`;
    s += `<text x="${x}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--suave)">${nombreMes(m.mes).slice(0, 3)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Cobrado y gastos por mes">${s}</svg>`;
}

function gastoDelMes(g, m) {
  if (!g.activo) return 0;
  if (g.frecuencia === 'mensual') return new Date(g.creado).toISOString().slice(0, 7) <= m ? g.monto : 0;
  if (!g.fecha) return 0;
  if (g.frecuencia === 'anual') return g.fecha.slice(5, 7) === m.slice(5, 7) && g.fecha.slice(0, 7) <= m ? g.monto : 0;
  return g.fecha.slice(0, 7) === m ? g.monto : 0;
}

const ICONOS_EVENTO = { tarea: '🛠️', demo: '🎯', cita: '📞', cobro: '💳', otro: '📌' };
function itemsCalendario(m) {
  const items = [];
  for (const p of D.pagos) if (p.vence.slice(0, 7) === m) items.push({ fecha: p.vence, icono: p.pagado_el ? '✅' : '💳', titulo: `${p.pagado_el ? 'Pagado' : 'Cobro'} ${p.empresa || ''} ${dinero(p.monto, p.moneda)}`, detalle: p.concepto, clase: p.pagado_el ? 'ok' : p.estado === 'vencido' ? 'mal' : 'az', pago: p.id, listo: !!p.pagado_el });
  for (const g of D.gastos) {
    if (!g.activo) continue;
    let f = null;
    if (g.frecuencia === 'mensual') f = `${m}-${String(Math.min(28, g.dia || 1)).padStart(2, '0')}`;
    else if (g.frecuencia === 'anual' && g.fecha && g.fecha.slice(5, 7) === m.slice(5, 7) && g.fecha.slice(0, 7) <= m) f = m + g.fecha.slice(7);
    else if (g.frecuencia === 'unico' && g.fecha && g.fecha.slice(0, 7) === m) f = g.fecha;
    if (f) items.push({ fecha: f, icono: '💸', titulo: `${g.nombre} ${dinero(g.monto, g.moneda)}`, detalle: D.categorias[g.categoria], clase: 'ojo', gasto: g.id });
  }
  for (const ev of D.eventos) if (ev.fecha.slice(0, 7) === m) items.push({ fecha: ev.fecha, hora: ev.hora, icono: ICONOS_EVENTO[ev.tipo] || '📌', titulo: ev.titulo, detalle: [ev.empresa, ev.nota].filter(Boolean).join(' · '), clase: ev.tipo === 'demo' ? 'mor' : 'ok', evento: ev.id, hecho: ev.hecho });
  return items;
}
function vCalendario() {
  mesCal = mesCal || hoy().slice(0, 7);
  return cabecera('📅 Calendario', 'Cobros y gastos aparecen solos · toca un día para agregar una tarea, demo o cita',
    `<button class="btn-sec" data-cal="-1">‹</button><b style="min-width:150px;text-align:center">${esc(nombreMes(mesCal))}</b><button class="btn-sec" data-cal="1">›</button><button class="btn-sec" data-cal="0">Hoy</button><button class="btn" data-nuevo-evento="${hoy()}">+ Tarea</button>`) +
    `<div class="caja"><div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap"><span class="chip az">💳 Cobros</span><span class="chip ok">✅ Pagados · 🛠️ Tareas</span><span class="chip mor">🎯 Demos</span><span class="chip ojo">💸 Gastos</span><span class="chip mal">⛔ Vencidos</span></div><div class="cal" id="cal"></div></div>`;
}
async function pintarCalendario() {
  // El calendario puede mostrar otro mes: si no está en los datos cargados, se piden.
  if (mesCal.slice(0, 7) !== D.mes && !(D.eventos.some(e => e.fecha.slice(0, 7) === mesCal))) {
    const r = await api('/api/oficina/datos?mes=' + mesCal);
    if (r.ok) D = { ...D, eventos: r.data.eventos, pagos: r.data.pagos };
  }
  const items = itemsCalendario(mesCal);
  const primero = new Date(mesCal + '-01T12:00:00Z');
  const inicio = new Date(primero); inicio.setUTCDate(1 - primero.getUTCDay());
  const h = hoy();
  let html = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'].map(d => `<div class="dn">${d}</div>`).join('');
  for (let i = 0; i < 42; i++) {
    const d = new Date(inicio); d.setUTCDate(inicio.getUTCDate() + i);
    const f = d.toISOString().slice(0, 10);
    if (i >= 35 && f.slice(0, 7) !== mesCal) break;
    const del = items.filter(x => x.fecha === f).sort((a, b) => (a.hora || '').localeCompare(b.hora || ''));
    html += `<div class="d ${f.slice(0, 7) !== mesCal ? 'fuera' : ''} ${f === h ? 'hoy' : ''}" data-dia="${f}"><b>${d.getUTCDate()}</b>
      ${del.map(x => `<span class="ev chip ${x.clase} ${x.hecho ? 'hecho' : ''}" title="${esc(x.titulo + (x.detalle ? ' · ' + x.detalle : ''))}" ${x.evento ? `data-editar-evento="${x.evento}"` : x.pago ? `data-editar-pago="${x.pago}"` : x.gasto ? `data-editar-gasto="${x.gasto}"` : ''}>${x.icono} ${x.hora ? esc(x.hora) + ' ' : ''}${esc(x.titulo)}</span>`).join('')}</div>`;
  }
  const cal = document.getElementById('cal'); if (cal) cal.innerHTML = html;
}

async function guardarInstrucciones() {

  const r = await api('/api/oficina/conocimiento/instrucciones', { empresa_id: kEmpresa, nombre: document.getElementById('iNombre').value, modelo: document.getElementById('iModelo').value.trim(), instrucciones: document.getElementById('iGeneral').value, sedes, bienvenidas, web });
  aviso(r.ok ? 'Instrucciones guardadas. Pruébalas en 💬 Chat de prueba.' : (r.data.error || 'No se pudo guardar.'));
  if (r.ok) await cargarConocimiento();
}

function base64De(archivo) {
  return new Promise((ok, mal) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = () => mal(r.error); r.readAsDataURL(archivo); });
}
async function subirArchivos(lista) {
  const validos = [...lista].filter(f => /\.(xlsx|xlsm|pdf|xls)$/i.test(f.name) && !f.name.startsWith('~$'));
  const omitidos = lista.length - validos.length;
  const prog = document.getElementById('kProgreso');
  const errores = [];
  for (let i = 0; i < validos.length; i++) {
    const f = validos[i];
    if (prog) prog.textContent = `Subiendo ${i + 1} de ${validos.length}: ${f.name}…`;
    if (f.size > 15 * 1024 * 1024) { errores.push(`${f.name}: pesa más de 15 MB`); continue; }
    const r = await api('/api/oficina/conocimiento/subir', { empresa_id: kEmpresa, nombre: f.name, datos: await base64De(f) });
    if (!r.ok) errores.push(`${f.name}: ${r.data.error || 'error'}`);
  }
  await ir('conocimiento');
  const p = document.getElementById('kProgreso');
  if (p) p.innerHTML = `${validos.length - errores.length} archivo(s) subido(s)${omitidos ? ` · ${omitidos} ignorado(s) (no son Excel ni PDF)` : ''}.` + (errores.length ? `<br><span style="color:var(--rojo)">${errores.map(esc).join('<br>')}</span>` : '');
}

document.addEventListener('keydown', e => {
  if (e.target.id === 'kPregunta' && e.key === 'Enter') { e.preventDefault(); probarConocimiento(); }
  if (e.target.id === 'kChatTexto' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviarChatK(); }
});

/* ---------- Empresas y Herramientas (las pantallas de siempre, dentro de la Oficina) ---------- */
function vEmpresas() { return cabecera('🏗️ Empresas y demo', 'Crear empresas, módulos, cobro y recordatorio, anuncios, pausa y demo de ventas') + `<iframe class="marco" src="/?incrustado=empresas" title="Empresas"></iframe>`; }
function vHerramientas() { return cabecera('🛠️ Herramientas', 'Usuarios, grupos, auditoría, bloqueos y estado del sistema del central') + `<iframe class="marco" src="/?incrustado=herramientas" title="Herramientas"></iframe>`; }

/* ---------- Formularios ---------- */
function opcionesEmpresa(elegida, vacio = 'Ninguno (general)') {
  return [`<option value="">${vacio}</option>`].concat(D.empresas.map(e => `<option value="${e.id}" ${Number(elegida) === e.id ? 'selected' : ''}>${esc(e.nombre)}</option>`)).join('');
}
function opciones(obj, elegida) { return Object.entries(obj).map(([k, v]) => `<option value="${k}" ${k === elegida ? 'selected' : ''}>${esc(v)}</option>`).join(''); }
function campo(id, etiqueta, control, ayuda = '') { return `<div class="campo"><label for="${id}">${etiqueta}</label>${control}${ayuda ? `<div class="ay">${ayuda}</div>` : ''}</div>`; }
const v = id => (document.getElementById(id) || {}).value || '';
function abrirModal(html) { document.getElementById('modal').classList.remove('ancho'); document.getElementById('modal').innerHTML = html; document.getElementById('fondoModal').classList.add('abierto'); const p = document.querySelector('#modal input, #modal select, #modal textarea'); if (p) p.focus(); }
function cerrarModal() { document.getElementById('fondoModal').classList.remove('abierto'); }
function pieModal(borrar) { return `<div class="error-form" id="errForm"></div><div class="pie">${borrar ? `<button class="btn-sec izq" id="fBorrar" style="color:var(--rojo)">Borrar</button>` : ''}<button class="btn-sec" data-cerrar-modal>Cancelar</button><button class="btn" id="fGuardar">Guardar</button></div>`; }
async function enviarForm(url, cuerpo, ok) {
  const r = await api(url, cuerpo);
  if (!r.ok) { document.getElementById('errForm').textContent = r.data.error || 'No se pudo guardar.'; return false; }
  cerrarModal(); aviso(ok); await ir(vista); return true;
}
function conBorrar(tipo, id, texto) {
  const b = document.getElementById('fBorrar');
  if (b) b.onclick = async () => { if (!confirm(texto)) return; await enviarForm(`/api/oficina/borrar/${tipo}`, { id }, 'Borrado.'); };
}

function formPago(p = {}) {
  abrirModal(`<h2>${p.id ? 'Editar cobro' : 'Nuevo cobro'}</h2>
    ${campo('fEmp', 'Cliente', `<select id="fEmp">${opcionesEmpresa(p.empresa_id, 'Sin cliente')}</select>`)}
    ${campo('fCon', 'Concepto', `<input id="fCon" value="${esc(p.concepto || '')}" placeholder="Ej.: Instalación del sistema">`, 'Lo que estás cobrando. Las mensualidades se crean solas.')}
    <div class="fila2">${campo('fMon', 'Monto', `<input id="fMon" type="number" step="0.01" min="0" value="${p.monto ?? ''}" placeholder="150">`)}${campo('fMone', 'Moneda', `<select id="fMone">${['US$', 'RD$', '€'].map(m => `<option ${m === (p.moneda || 'US$') ? 'selected' : ''}>${m}</option>`).join('')}</select>`)}</div>
    ${campo('fVen', 'Vence', `<input id="fVen" type="date" value="${esc(p.vence || hoy())}">`)}
    ${campo('fNota', 'Nota (opcional)', `<input id="fNota" value="${esc(p.nota || '')}" placeholder="Ej.: 50 % al empezar">`)}
    ${pieModal(p.id)}`);
  document.getElementById('fGuardar').onclick = () => enviarForm('/api/oficina/guardar/pagos', { id: p.id, empresa_id: v('fEmp'), concepto: v('fCon'), monto: v('fMon'), moneda: v('fMone'), vence: v('fVen'), forma: p.forma || '', nota: v('fNota') }, 'Cobro guardado.');
  conBorrar('pagos', p.id, '¿Borrar este cobro? Si es una mensualidad automática se volverá a crear.');
}
function formPagado(p) {
  abrirModal(`<h2>Registrar pago</h2><p style="margin-top:-6px;color:var(--suave);font-size:13px">${esc(p.empresa || '')} · ${esc(p.concepto)} · <b>${dinero(p.monto, p.moneda)}</b></p>
    ${campo('fFec', '¿Qué día te pagaron?', `<input id="fFec" type="date" value="${hoy()}">`)}
    ${campo('fFor', 'Forma de pago', `<select id="fFor">${['Transferencia', 'PayPal', 'Efectivo', 'Depósito', 'Otro'].map(x => `<option>${x}</option>`).join('')}</select>`)}
    ${p.auto_mes ? '<div class="ay" style="font-size:12px;color:var(--suave)">Al guardar, en el panel del cliente se quita el aviso de pago de ese mes.</div>' : ''}
    ${pieModal(false)}`);
  document.getElementById('fGuardar').onclick = async () => {
    const r = await api('/api/oficina/pagado', { id: p.id, fecha: v('fFec'), forma: v('fFor') });
    if (!r.ok) { document.getElementById('errForm').textContent = r.data.error || 'No se pudo guardar.'; return; }
    cerrarModal(); aviso(r.data.avisoQuitado ? 'Pago registrado. Se quitó el aviso en el panel del cliente.' : 'Pago registrado.'); ir(vista);
  };
}
function formGasto(g = {}) {
  const frec = g.frecuencia || 'mensual';
  abrirModal(`<h2>${g.id ? 'Editar gasto' : 'Nuevo gasto'}</h2>
    ${campo('fNom', 'Nombre', `<input id="fNom" value="${esc(g.nombre || '')}" placeholder="Ej.: Servidor Hostinger KVM 4">`)}
    <div class="fila2">${campo('fCat', 'Categoría', `<select id="fCat">${opciones(D.categorias, g.categoria || 'servidor')}</select>`)}${campo('fFrec', '¿Cada cuánto?', `<select id="fFrec">${opciones(D.frecuencias, frec)}</select>`)}</div>
    <div class="fila2">${campo('fMon', 'Monto', `<input id="fMon" type="number" step="0.01" min="0" value="${g.monto ?? ''}" placeholder="41.29">`)}${campo('fMone', 'Moneda', `<select id="fMone">${['US$', 'RD$', '€'].map(m => `<option ${m === (g.moneda || 'US$') ? 'selected' : ''}>${m}</option>`).join('')}</select>`)}</div>
    <div id="fCuando">${campo('fDia', 'Día del mes en que se paga', `<input id="fDia" type="number" min="1" max="28" value="${g.dia || 1}">`)}${campo('fFec', 'Fecha del pago (o de la próxima renovación)', `<input id="fFec" type="date" value="${esc(g.fecha || hoy())}">`)}</div>
    ${campo('fEmp', '¿Es de un cliente en particular? (opcional)', `<select id="fEmp">${opcionesEmpresa(g.empresa_id, 'No, es general')}</select>`)}
    ${campo('fUrl', 'Enlace (opcional)', `<input id="fUrl" value="${esc(g.url || '')}" placeholder="https://hpanel.hostinger.com">`, 'Donde lo pagas o lo administras.')}
    ${campo('fNota', 'Nota (opcional)', `<input id="fNota" value="${esc(g.nota || '')}">`)}
    <div class="campo chk"><label><input type="checkbox" id="fAct" ${g.activo === false ? '' : 'checked'}> Lo sigo pagando (desmárcalo para pausarlo sin borrarlo)</label></div>
    ${pieModal(g.id)}`);
  const cambia = () => { const f = v('fFrec'); document.getElementById('fDia').closest('.campo').style.display = f === 'mensual' ? '' : 'none'; document.getElementById('fFec').closest('.campo').style.display = f === 'mensual' ? 'none' : ''; };
  document.getElementById('fFrec').onchange = cambia; cambia();
  document.getElementById('fGuardar').onclick = () => enviarForm('/api/oficina/guardar/gastos', { id: g.id, nombre: v('fNom'), categoria: v('fCat'), frecuencia: v('fFrec'), monto: v('fMon'), moneda: v('fMone'), dia: v('fDia'), fecha: v('fFec'), empresa_id: v('fEmp'), url: v('fUrl'), nota: v('fNota'), activo: document.getElementById('fAct').checked }, 'Gasto guardado.');
  conBorrar('gastos', g.id, '¿Borrar este gasto? Si solo dejaste de pagarlo, mejor desmarca "Lo sigo pagando".');
}
function formEvento(ev = {}, fecha) {
  abrirModal(`<h2>${ev.id ? 'Editar' : 'Nueva tarea, demo o cita'}</h2>
    ${campo('fTit', '¿Qué hay que hacer?', `<input id="fTit" value="${esc(ev.titulo || '')}" placeholder="Ej.: Demo con Caribe Tours">`)}
    <div class="fila2">${campo('fFec', 'Fecha', `<input id="fFec" type="date" value="${esc(ev.fecha || fecha || hoy())}">`)}${campo('fHora', 'Hora (opcional)', `<input id="fHora" type="time" value="${esc(ev.hora || '')}">`)}</div>
    <div class="fila2">${campo('fTipo', 'Tipo', `<select id="fTipo">${opciones(D.tiposEvento, ev.tipo || 'tarea')}</select>`)}${campo('fEmp', 'Cliente (opcional)', `<select id="fEmp">${opcionesEmpresa(ev.empresa_id, 'Ninguno')}</select>`)}</div>
    ${campo('fNota', 'Nota (opcional)', `<textarea id="fNota" rows="3" placeholder="Ej.: por Zoom, llevar precios">${esc(ev.nota || '')}</textarea>`)}
    ${ev.id ? `<div class="campo chk"><label><input type="checkbox" id="fHecho" ${ev.hecho ? 'checked' : ''}> Ya está hecho</label></div>` : ''}
    ${pieModal(ev.id)}`);
  document.getElementById('fGuardar').onclick = () => enviarForm('/api/oficina/guardar/eventos', { id: ev.id, titulo: v('fTit'), fecha: v('fFec'), hora: v('fHora'), tipo: v('fTipo'), empresa_id: v('fEmp'), nota: v('fNota'), hecho: ev.id ? document.getElementById('fHecho').checked : false }, 'Guardado en el calendario.');
  conBorrar('eventos', ev.id, '¿Borrar esta tarea del calendario?');
}
function formEnlace(x = {}) {
  const grupos = [...new Set(D.enlaces.map(e => e.grupo).concat(['Infraestructura', 'Mis redes', 'Cobros', 'Mi negocio']))];
  abrirModal(`<h2>${x.id ? 'Editar enlace' : 'Nuevo enlace'}</h2>
    <div class="fila2">${campo('fNom', 'Nombre', `<input id="fNom" value="${esc(x.nombre || '')}" placeholder="Ej.: Instagram de Kaizen">`)}${campo('fIco', 'Ícono (emoji)', `<input id="fIco" value="${esc(x.icono || '🔗')}" maxlength="4">`)}</div>
    ${campo('fUrl', 'Dirección', `<input id="fUrl" value="${esc(x.url || '')}" placeholder="https://instagram.com/kaizenia">`)}
    ${campo('fGru', 'Grupo', `<input id="fGru" list="listaGrupos" value="${esc(x.grupo || 'Mis redes')}"><datalist id="listaGrupos">${grupos.map(g => `<option value="${esc(g)}">`).join('')}</datalist>`, 'Escribe uno nuevo o elige uno de la lista.')}
    ${campo('fNota', 'Descripción (opcional)', `<input id="fNota" value="${esc(x.nota || '')}">`)}
    <div class="campo chk"><label><input type="checkbox" id="fVig" ${x.vigilar ? 'checked' : ''}> Vigilar: revisar cada minuto que responda y avisarme si se cae</label></div>
    ${pieModal(x.id)}`);
  document.getElementById('fGuardar').onclick = () => enviarForm('/api/oficina/guardar/enlaces', { id: x.id, nombre: v('fNom'), icono: v('fIco'), url: v('fUrl'), grupo: v('fGru'), nota: v('fNota'), vigilar: document.getElementById('fVig').checked }, 'Enlace guardado.');
  conBorrar('enlaces', x.id, '¿Borrar este enlace?');
}
function formCliente(e) {
  const p = e.pago || {};
  abrirModal(`<h2>${esc(e.nombre)}</h2>
    ${campo('fPlan', 'Plan', `<input id="fPlan" value="${esc(e.plan || '')}" placeholder="Ej.: Completo, Básico">`)}
    <div class="campo chk"><label><input type="checkbox" id="fCobrar" ${p.activo ? 'checked' : ''}> Cobrar una mensualidad (con recordatorio en su panel)</label></div>
    <div class="fila2">${campo('fCuota', 'Cuota mensual', `<input id="fCuota" type="number" step="0.01" min="0" value="${esc(String(p.monto || '').replace(/[^0-9.]/g, ''))}" placeholder="150">`)}${campo('fDia', 'Día de cobro (1 a 28)', `<input id="fDia" type="number" min="1" max="28" value="${p.dia || 5}">`)}</div>
    ${campo('fMone', 'Moneda', `<select id="fMone">${['US$', 'RD$', '€'].map(m => `<option ${m === (p.moneda || 'US$') ? 'selected' : ''}>${m}</option>`).join('')}</select>`, 'El recordatorio en su panel, los días de aviso y los textos se ajustan en Empresas y demo → Cobro y recordatorio.')}
    <div class="fila2">${campo('fCont', 'Persona de contacto', `<input id="fCont" value="${esc(e.contacto || '')}" placeholder="Ej.: Juan Pérez (gerente)">`)}${campo('fTel', 'Teléfono / WhatsApp', `<input id="fTel" value="${esc(e.telefono || '')}" placeholder="+1 809 000 0000">`)}</div>
    ${campo('fMail', 'Correo de contacto', `<input id="fMail" value="${esc(e.correo_contacto || '')}">`)}
    ${campo('fIa', 'Clave de OpenRouter de este cliente (para medir su gasto de IA)', `<input id="fIa" type="password" autocomplete="off" placeholder="${e.tieneClaveIA ? '•••• guardada · déjalo vacío para no cambiarla' : 'sk-or-v1-…'}">`,
      e.externa ? 'Es la misma que está en su config.js. Créala en openrouter.ai → Keys (una por cliente) y ponle un límite.' : (e.tieneClaveIA && !e.claveIAPropia ? 'Se está usando la clave de su config.js. Solo pon una aquí si quieres medir con otra.' : 'Crea una en openrouter.ai → Keys (una por cliente) y ponle un límite.'))}
    ${e.claveIAPropia ? '<div class="campo chk"><label><input type="checkbox" id="fBorrarIa"> Quitar la clave guardada aquí</label></div>' : ''}
    ${campo('fNotas', 'Notas', `<textarea id="fNotas" rows="3">${esc(e.notas || '')}</textarea>`)}
    ${pieModal(false)}`);
  document.getElementById('fGuardar').onclick = async () => {
    const r = await api('/api/oficina/empresa/' + e.id, { plan: v('fPlan'), contacto: v('fCont'), telefono: v('fTel'), correo_contacto: v('fMail'), notas: v('fNotas'), ia_clave: v('fIa'), borrarClave: !!(document.getElementById('fBorrarIa') || {}).checked });
    if (!r.ok) { document.getElementById('errForm').textContent = r.data.error || 'No se pudo guardar.'; return; }
    const cambioCobro = !!p.activo !== document.getElementById('fCobrar').checked || String(p.monto || '') !== v('fCuota') || Number(p.dia || 5) !== Number(v('fDia')) || (p.moneda || 'US$') !== v('fMone');
    if (cambioCobro) {
      const r2 = await api(`/api/central/empresas/${e.id}/pago`, { ...p, activo: document.getElementById('fCobrar').checked, monto: v('fCuota'), dia: Number(v('fDia')), moneda: v('fMone'), diasAntes: p.diasAntes ?? 3 });
      if (!r2.ok) { document.getElementById('errForm').textContent = r2.data.error || 'No se pudo guardar la cuota.'; return; }
    }
    cerrarModal(); aviso('Cliente guardado.'); ir(vista);
  };
}

/* ---------- Eventos ---------- */
const buscar = (lista, id) => lista.find(x => String(x.id) === String(id));
document.addEventListener('click', async ev => {
  const t = ev.target.closest('[data-ir],[data-ayuda],[data-nuevo-pago],[data-editar-pago],[data-pagado],[data-deshacer],[data-nuevo-gasto],[data-editar-gasto],[data-nuevo-evento],[data-editar-evento],[data-hecho],[data-nuevo-enlace],[data-editar-enlace],[data-editar-cliente],[data-filtro-pagos],[data-cal],[data-dia],[data-chat-usuario],[data-cerrar-modal],[data-recargar]');
  if (!t) return;
  if (t.tagName === 'A' && !t.dataset.ir && !t.dataset.editarCliente) return;
  ev.preventDefault();
  const d = t.dataset;
  if (d.ir) return ir(d.ir);
  if ('ayuda' in d) return document.getElementById('cajaAyuda').classList.toggle('abierta');
  if ('cerrarModal' in d) return cerrarModal();
  if ('recargar' in d) { await cargarNegocios(); return pintar(); }
  if ('nuevoPago' in d) return formPago();
  if (d.editarPago) { const p = buscar(D.pagos, d.editarPago); return p && formPago(p); }
  if (d.pagado) { const p = buscar(D.pagos, d.pagado); return p && formPagado(p); }
  if (d.deshacer) { if (!confirm('¿Marcar este cobro como NO pagado?')) return; await api('/api/oficina/pagado', { id: d.deshacer, deshacer: true }); aviso('Listo.'); return ir(vista); }
  if ('nuevoGasto' in d) return formGasto();
  if (d.editarGasto) { const g = buscar(D.gastos, d.editarGasto); return g && formGasto(g); }
  if (d.nuevoEvento) return formEvento({}, d.nuevoEvento);
  if (d.editarEvento) { const e = buscar(D.eventos, d.editarEvento); return e && formEvento(e); }
  if (d.hecho) { await api('/api/oficina/evento-hecho', { id: d.hecho, hecho: true }); aviso('Marcado como hecho.'); return ir(vista); }
  if ('nuevoEnlace' in d) return formEnlace();
  if (d.editarEnlace) { const x = buscar(D.enlaces, d.editarEnlace); return x && formEnlace(x); }
  if (d.editarCliente) { const e = buscar(D.empresas, d.editarCliente); return e && formCliente(e); }
  if (d.filtroPagos) { filtroPagos = d.filtroPagos; return pintar(); }
  if (d.cal) { mesCal = d.cal === '0' ? hoy().slice(0, 7) : mesMas(mesCal, Number(d.cal)); return pintar(); }
  if (d.dia) return formEvento({}, d.dia);
  if (d.chatUsuario) return abrirChatCon(d.chatEmpresa, d.chatUsuario, d.chatNombre);
});
document.addEventListener('change', e => { if (e.target.id === 'selMes') { mes = e.target.value; ir(vista); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') cerrarModal();
  if (e.target.id === 'chatTexto' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviarChat(); }
});
document.addEventListener('click', e => { if (e.target.id === 'chatEnviar') enviarChat(); if (e.target.id === 'fondoModal') cerrarModal(); });
document.getElementById('btnMenu').onclick = () => document.getElementById('lateral').classList.toggle('abierto');
document.getElementById('btnSalir').onclick = async () => { await api('/api/logout', {}); location.href = '/'; };
document.getElementById('btnTema').onclick = () => { const o = document.body.classList.toggle('oscuro'); try { localStorage.setItem('tema', o ? 'oscuro' : 'claro'); } catch (e) {} };

/* ---------- Arranque ---------- */
(async () => {
  try { if (localStorage.getItem('tema') === 'oscuro') document.body.classList.add('oscuro'); } catch (e) {}
  const s = await api('/api/sesion');
  if (!s.ok || !s.data.central || s.data.grupo !== 'Programador') { location.href = '/'; return; }
  mes = hoy().slice(0, 7);
  let inicial = 'inicio';
  try { inicial = localStorage.getItem('oficinaVista') || 'inicio'; } catch (e) {}
  const pedida = new URLSearchParams(location.search).get('ir'); if (pedida) inicial = pedida;
  await ir(['inicio', 'negocios', 'clientes', 'gastos', 'calendario', 'chat', 'enlaces', 'conocimiento', 'redes', 'empresas', 'herramientas'].includes(inicial) ? inicial : 'inicio');
  cargarChatContactos();
  // Se mantiene al día solo: lo de la pantalla cada minuto, el chat cada pocos segundos.
  setInterval(async () => {
    if (document.hidden || document.getElementById('fondoModal').classList.contains('abierto')) return;
    if (['inicio', 'negocios'].includes(vista)) { if (vista === 'inicio') { await cargarDatos(); await cargarServicios(); } await cargarNegocios(); pintar(); }
  }, 60000);
  setInterval(() => { if (!document.hidden) { cargarChatContactos(); if (vista === 'chat' && chatSel) cargarConversacion(false); } }, 5000);
  // Latido para que el central sepa que sigues conectado.
  const latido = () => api('/api/latido', { activo: true });
  latido(); setInterval(latido, 60000);
})();
</script>
