/* ---------- Utilidades ---------- */
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
async function api(url, cuerpo) {
  try {
    const r = await fetch(url, cuerpo === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo) });
    let data = {}; try { data = await r.json(); } catch (e) {}
    if (r.status === 401) { location.href = '/'; }
    return { ok: r.ok, status: r.status, data };
  } catch (e) { return { ok: false, status: 0, data: { error: 'No hay conexión con el servidor.' } }; }
}
function aviso(t) { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('visible'); clearTimeout(timers.toast); timers.toast = setTimeout(() => el.classList.remove('visible'), 3500); }
function hoy() { return new Date().toLocaleDateString('sv-SE', { timeZone: ZONA }); }
function mesMas(m, n) { const d = new Date(m + '-15T12:00:00Z'); d.setUTCMonth(d.getUTCMonth() + n); return d.toISOString().slice(0, 7); }
function nombreMes(m) { const t = new Date(m + '-15T12:00:00Z').toLocaleDateString('es-DO', { month: 'long', year: 'numeric', timeZone: 'UTC' }); return t.charAt(0).toUpperCase() + t.slice(1); }
function fechaCorta(f) { if (!f) return '—'; return new Date(f.slice(0, 10) + 'T12:00:00Z').toLocaleDateString('es-DO', { day: 'numeric', month: 'short', timeZone: 'UTC' }); }
function fechaLarga(f) { return new Date(f + 'T12:00:00Z').toLocaleDateString('es-DO', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' }); }
function dinero(n, m = 'US$') { return `${m} ${Number(n || 0).toLocaleString('es-DO', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 })}`; }
function totalTexto(obj) { const e = Object.entries(obj || {}).filter(([, v]) => v); return e.length ? e.map(([m, v]) => dinero(v, m)).join(' + ') : 'US$ 0'; }
function diasEntre(a, b) { return Math.round((Date.parse(b + 'T12:00:00Z') - Date.parse(a + 'T12:00:00Z')) / 86400000); }
const COLORES = ['#2563eb', '#db2777', '#059669', '#d97706', '#7c3aed', '#0891b2', '#dc2626', '#4f46e5', '#65a30d', '#c2410c'];
function colorDe(t) { let h = 0; for (const c of String(t)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return COLORES[h % COLORES.length]; }
function iniciales(n) { return String(n || '?').trim().split(/\s+/).slice(0, 2).map(p => p[0]).join('').toUpperCase(); }
function haceCuanto(f) { if (!f) return ''; const m = Math.round((Date.now() - new Date(f).getTime()) / 60000); return m < 1 ? 'ahora' : m < 60 ? `hace ${m} min` : m < 1440 ? `hace ${Math.round(m / 60)} h` : `hace ${Math.round(m / 1440)} d`; }

function cabecera(titulo, sub, extra = '') {
  return `<div class="cabeza"><div><h1>${titulo}</h1><p>${sub}</p></div><div class="acciones">${extra}<button class="btn-ayuda" data-ayuda title="Ayuda">?</button></div></div>
    <div class="ayuda" id="cajaAyuda">${AYUDA[vista] || ''}</div>`;
}
function selectorMes() {
  const ops = []; for (let i = -12; i <= 1; i++) { const m = mesMas(hoy().slice(0, 7), i); ops.push(`<option value="${m}" ${m === mes ? 'selected' : ''}>${nombreMes(m)}</option>`); }
  return `<select id="selMes" title="Mes">${ops.reverse().join('')}</select>`;
}

/* ---------- Alarma de pagos: 2 días antes del vencimiento hasta que lo marques pagado ---------- */
let ALARMAS = [];
const textoDias = d => d > 1 ? `vence en ${d} días` : d === 1 ? 'vence mañana' : d === 0 ? 'vence HOY' : `venció hace ${-d} día${d === -1 ? '' : 's'}`;
function cajaAlarmas() {
  if (!ALARMAS.length || !puedeSec('gastos')) return '';
  const urg = ALARMAS.some(a => a.dias <= 0);
  return `<div class="alarma-pagos ${urg ? 'urg' : ''}"><div class="t">⏰ <b>${ALARMAS.length === 1 ? 'Hay un pago por hacer' : `Hay ${ALARMAS.length} pagos por hacer`}</b> <span>para que no se corte ningún servicio</span>
      ${typeof Notification !== 'undefined' && Notification.permission === 'default' ? '<button class="btn-mini" data-alarma-notif>🔔 Avisarme también en Windows</button>' : ''}</div>
    ${ALARMAS.map(a => `<div class="al ${a.dias <= 0 ? 'urg' : ''}"><span class="d">${textoDias(a.dias)}</span><b>${esc(a.nombre)}</b><span class="m">${esc(a.moneda)} ${Number(a.monto).toLocaleString('en-US')}</span><small>${esc(fechaCorta(a.vence))}</small>
      ${a.url ? `<a class="btn-mini" href="${esc(a.url)}" target="_blank" rel="noopener">Ir a pagar</a>` : ''}<button class="btn-mini p" data-alarma-pagado="${a.id}" data-vence="${a.vence}">✓ Ya lo pagué</button></div>`).join('')}</div>`;
}
function avisarAlarmas() {
  const n = document.getElementById('numGastos');
  if (n) { n.textContent = ALARMAS.length; n.style.display = ALARMAS.length && puedeSec('gastos') ? '' : 'none'; n.style.background = ALARMAS.some(a => a.dias <= 0) ? '' : '#d97706'; }
  // Notificación de Windows: una vez al día por cada pago (si diste permiso).
  if (!ALARMAS.length || typeof Notification === 'undefined' || Notification.permission !== 'granted' || !puedeSec('gastos')) return;
  const hoyK = hoy();
  for (const a of ALARMAS) {
    const k = `alarmaPago:${a.id}:${a.vence}:${hoyK}`;
    try { if (localStorage.getItem(k)) continue; localStorage.setItem(k, '1'); } catch (e) {}
    try { new Notification(`⏰ ${a.nombre}: ${textoDias(a.dias)}`, { body: `${a.moneda} ${a.monto} · ${fechaCorta(a.vence)}. Págalo para que no se corte el servicio.`, tag: 'pago-' + a.id }); } catch (e) {}
  }
}
setInterval(async () => { if (document.hidden) return; const r = await api('/api/oficina/alarmas'); if (r.ok) { const antes = ALARMAS.length; ALARMAS = r.data.alarmas; avisarAlarmas(); if (antes !== ALARMAS.length) pintar(); } }, 30 * 60 * 1000);
document.addEventListener('click', async e => {
  if (e.target.closest('[data-alarma-notif]')) { try { await Notification.requestPermission(); } catch (err) {} avisarAlarmas(); return pintar(); }
  const b = e.target.closest('[data-alarma-pagado]'); if (!b) return;
  const r = await api('/api/oficina/gastos/pagado', { id: b.dataset.alarmaPagado, vence: b.dataset.vence });
  if (!r.ok) return aviso(r.data.error || 'No se pudo marcar.');
  ALARMAS = r.data.alarmas; avisarAlarmas(); pintar(); aviso('✓ Marcado como pagado. La alarma vuelve el próximo vencimiento.');
});

}

function primeraSec() { return ['inicio', 'negocios', 'administracion', 'calendario', 'chat', 'enlaces', 'conocimiento', 'redes', 'respaldos'].find(puedeSec) || 'inicio'; }
async function ir(v, recargar = true) {
  if (v === 'aprobaciones') { kTab = 'entrenar'; v = 'conocimiento'; try { localStorage.setItem('oficinaTabK', kTab); } catch (e) {} }

async function cargarSeccion(v) {
  const tareas = [];
  if (['inicio', 'clientes', 'gastos', 'administracion', 'calendario', 'enlaces'].includes(v)) tareas.push(cargarDatos());

  if (v === 'gastos' || v === 'administracion') tareas.push(cargarProyectos());
  if (v === 'inicio' || v === 'enlaces') tareas.push(cargarServicios());
  if (v === 'apis') tareas.push(cargarApis());
  if (v === 'apps') tareas.push(cargarApps());
  if (v === 'integraciones') tareas.push(cargarIntegraciones());
  if (v === 'chat') tareas.push(cargarChatContactos());
  if (v === 'respaldos' || v === 'inicio') tareas.push(cargarRespaldo());
  if (v === 'conocimiento' || v === 'redes') tareas.push(cargarConocimiento());
  await Promise.all(tareas);
  if (v === 'redes' && R && R.tieneToken && R.cuenta && !rProbe) { const r = await api('/api/oficina/redes/probar', { empresa_id: kEmpresa }); if (r.ok) rProbe = r.data; }
  if (v === 'conocimiento' && kTab === 'config' && R && R.tieneToken && R.cuenta && !rProbe) { const r = await api('/api/oficina/redes/probar', { empresa_id: kEmpresa }); if (r.ok) rProbe = r.data; }
}
function pintar() {
  const f = { inicio: vInicio, negocios: vNegocios, clientes: vAdministracion, gastos: vAdministracion, administracion: vAdministracion, calendario: vCalendario, chat: vChat, enlaces: vEnlaces, apis: vApis, apps: vApps, integraciones: vIntegraciones, conocimiento: vConocimiento, redes: vRedes, respaldos: vRespaldos, empresas: vEmpresas, herramientas: vHerramientas }[vista];

function haceCuanto(iso) {
  const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
  return m < 1 ? 'hace un momento' : m < 60 ? `hace ${m} min` : m < 48 * 60 ? `hace ${Math.round(m / 60)} h` : `hace ${Math.round(m / 1440)} días`;
}
// Zentralia en el servidor: el servidor hace la copia cifrada a las 2:00 a. m. y la PC la baja a las 3:00 a. m.
function vRespaldosServidor() {
  const titulo = cabecera('💾 Respaldos', 'Cada noche a las 2:00 a. m. el servidor hace una copia cifrada de todo; a las 3:00 a. m. tu PC la baja al USB, C:, D: y Google Drive.');
  const u = RESP.ultimo, pc = RESP.pc;
  const iconos = { 'Servidor': '🖥️', 'USB': '🔌', 'Disco C:': '💽', 'Disco D:': '💽', 'Google Drive': '☁️' };
  const boton = RESP.enCurso
    ? `<button class="btn" disabled>⏳ Respaldando… (empezó ${haceCuanto(RESP.enCurso.inicio)})</button>`
    : `<button class="btn" data-k="respaldar">💾 Respaldar ahora</button>`;
  if (!u) return titulo + `<div class="caja"><div class="vacio">Todavía no hay ningún respaldo en el servidor.</div>${boton}</div>`;
  const pcDeEsta = pc && u.archivo && pc.archivo === u.archivo;

function alertas() {
  const h = hoy(); const lista = [];
  for (const p of D.pagos) {
    if (p.pagado_el) continue;
    const d = diasEntre(h, p.vence);
    if (d < 0) lista.push(['⛔', `${p.empresa || 'Cobro'}: ${dinero(p.monto, p.moneda)} vencido hace ${-d} día(s)`, p.concepto, `<button class="btn-mini p" data-pagado="${p.id}">Pagado ✔</button>`, 0]);
    else if (d === 0) lista.push(['💳', `${p.empresa || 'Cobro'}: ${dinero(p.monto, p.moneda)} vence hoy`, p.concepto, `<button class="btn-mini p" data-pagado="${p.id}">Pagado ✔</button>`, 1]);
    else if (d <= 3) lista.push(['🔔', `${p.empresa || 'Cobro'}: ${dinero(p.monto, p.moneda)} vence en ${d} día(s)`, p.concepto + ' · ' + fechaCorta(p.vence), '', 3]);
  }
  for (const n of negocios || []) for (const r of n.revisiones) if (r.estado === 'falla') lista.push(['🩺', `${n.nombre}: ${r.nombre}`, r.detalle, `<button class="btn-mini" data-ir="negocios">Ver</button>`, 0]);
  for (const n of negocios || []) for (const a of n.alertas || []) lista.push(['⚠️', `${n.nombre}: alerta abierta`, a.texto, '', 1]);
  for (const x of D.enlaces) { const s = servicios.get(x.id); if (x.vigilar && s && !s.ok) lista.push(['🔌', `${x.nombre} no responde`, s.error || ('Código ' + s.codigo), `<a class="btn-mini" href="${esc(x.url)}" target="_blank" rel="noopener">Abrir</a>`, 1]); }
  for (const e of D.empresas) if (e.ia && e.ia.restante !== null && e.ia.restante !== undefined && e.ia.restante < 3) lista.push(['🪙', `${e.nombre}: a su clave de IA le quedan ${dinero(e.ia.restante)}`, 'Súbele el límite o recarga en OpenRouter', '', 2]);
  for (const ev of D.eventos) if (!ev.hecho && ev.fecha <= h) lista.push(['🛠️', `${ev.fecha < h ? 'Pendiente desde ' + fechaCorta(ev.fecha) : 'Hoy'}: ${ev.titulo}`, ev.empresa || ev.nota || '', `<button class="btn-mini" data-hecho="${ev.id}">Hecho ✔</button>`, 2]);
  if (RESP && RESP.disponible) {
    const u = RESP.ultimo;
    if (!u) lista.push(['💾', 'Todavía no hay ningún respaldo', 'Haz el primero desde Respaldos', '<button class="btn-mini" data-ir="respaldos">Ver</button>', 1]);
    else if (Date.now() - Date.parse(u.fin) > 36 * 3600 * 1000) lista.push(['💾', `El último respaldo es de ${haceCuanto(u.fin)}`, 'El respaldo diario no se está haciendo', '<button class="btn-mini" data-ir="respaldos">Ver</button>', 1]);
    else if (!u.ok) lista.push(['💾', u.algunoOk ? 'El último respaldo tuvo avisos' : 'El último respaldo falló', u.problemas.slice(0, 2).join(' · '), '<button class="btn-mini" data-ir="respaldos">Ver</button>', u.algunoOk ? 2 : 0]);
    if (u && RESP.servidor && (!RESP.pc || Date.now() - Date.parse(RESP.pc.fecha) > 48 * 3600 * 1000)) lista.push(['💾', 'Tu PC no está bajando los respaldos', RESP.pc ? `La última copia que bajó fue ${haceCuanto(RESP.pc.fecha)}` : 'Todavía no ha bajado ninguna copia del servidor', '<button class="btn-mini" data-ir="respaldos">Ver</button>', 2]);
  }
  return lista.sort((a, b) => a[4] - b[4]);
}

function estadoPeor(n) { const e = n.revisiones.map(r => r.estado); return e.includes('falla') ? 'falla' : e.includes('aviso') ? 'aviso' : 'bien'; }
function grafica(serie) {
  const W = 600, H = 200, izq = 46, abajo = 26, arriba = 16;
  const max = Math.max(10, ...serie.map(s => Math.max(s.cobrado, s.gastos)));
  const paso = Math.pow(10, Math.floor(Math.log10(max))) * (max / Math.pow(10, Math.floor(Math.log10(max))) > 5 ? 2 : 1);
  const tope = Math.ceil(max / paso) * paso;
  const y = v => arriba + (H - arriba - abajo) * (1 - v / tope);
  const ancho = (W - izq - 10) / serie.length;
  let s = '';
  for (let v = 0; v <= tope; v += paso) s += `<line x1="${izq}" x2="${W - 10}" y1="${y(v)}" y2="${y(v)}" stroke="var(--borde)"/><text x="${izq - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--suave)">${v}</text>`;
  serie.forEach((m, i) => {
    const x = izq + ancho * i + ancho / 2;
    const g = Math.min(24, ancho * 0.3);
    s += `<rect x="${x - g - 1}" y="${y(m.cobrado)}" width="${g}" height="${y(0) - y(m.cobrado)}" rx="3" fill="#2a78d6"><title>Cobrado ${dinero(m.cobrado)}</title></rect>`;
    s += `<rect x="${x + 1}" y="${y(m.gastos)}" width="${g}" height="${y(0) - y(m.gastos)}" rx="3" fill="#eb6834"><title>Gastos ${dinero(m.gastos)}</title></rect>`;
    s += `<text x="${x}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--suave)">${nombreMes(m.mes).slice(0, 3)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Cobrado y gastos por mes">${s}</svg>`;
}

      ${(n.alertas || []).length ? `<div style="margin-top:8px">${n.alertas.map(a => `<div class="alerta"><span class="i">⚠️</span><div><b>${esc(a.texto)}</b><small>${esc(haceCuanto(a.creada))}</small></div></div>`).join('')}</div>` : ''}
      <div style="margin-top:8px;font-size:12px;color:var(--suave)">Conectados ahora:</div>
      <div>${(n.conectados || []).length ? n.conectados.map(p => `<span class="persona"><span class="punto p-${p.estado === 'ausente' ? 'aviso' : 'bien'}"></span>${esc(p.nombre || p.usuario)} <small style="color:var(--suave)">${esc(p.grupo)}</small><button class="btn-mini" data-chat-empresa="${n.id}" data-chat-usuario="${esc(p.usuario)}" data-chat-nombre="${esc(p.nombre || p.usuario)}" title="Escribirle">💬</button></span>`).join('') : '<span style="font-size:12px;color:var(--suave)">Nadie conectado (o el panel todavía no tiene la versión que lo informa).</span>'}</div>
    </div>`; }).join('')}</div>` : '<div class="vacio">Todavía no hay negocios. Créalos en Empresas y demo.</div>');
}

/* ---------- Clientes y cobros ---------- */
function proximoCobro(e) {
  const pend = D.pagos.filter(p => p.empresa_id === e.id && !p.pagado_el).sort((a, b) => a.vence.localeCompare(b.vence))[0];
  if (pend) return `<span class="chip ${pend.estado === 'vencido' ? 'mal' : pend.estado === 'hoy' ? 'mal' : 'ojo'}">${pend.estado === 'vencido' ? 'Vencido ' + fechaCorta(pend.vence) : pend.estado === 'hoy' ? 'Vence hoy' : fechaCorta(pend.vence)}</span>`;
  if (e.pago && e.pago.activo) { const dia = Math.min(28, Number(e.pago.dia) || 1); let m = hoy().slice(0, 7); if (Number(hoy().slice(8)) >= dia) m = mesMas(m, 1); return `<span class="chip ok">Al día · ${fechaCorta(m + '-' + String(dia).padStart(2, '0'))}</span>`; }
  return '<span class="chip gris">Sin cuota</span>';
}

        <td>${esc(e.plan || '—')}</td>

        <td class="n">${!ia.tiene ? '<span class="chip gris" title="Pon la clave de OpenRouter de este cliente en Editar">sin clave</span>' : ia.error ? `<span class="chip mal" title="${esc(ia.error)}">error</span>` : ia.delMes === null ? '<span title="Se empieza a medir desde hoy">midiendo…</span>' : dinero(gasto) + (ia.compartida ? ` <span class="chip ojo" title="Usa la misma clave que ${esc(ia.compartida.join(', '))}: el gasto es de todos juntos">compartida</span>` : '')}</td>
        <td class="n"><b>${cuota ? dinero(Math.round((cuota - gasto) * 100) / 100, e.pago.moneda || 'US$') : '—'}</b></td>

/* ---------- Gastos ---------- */
function gastoDelMes(g, m) {
  if (!g.activo) return 0;
  if (g.frecuencia === 'mensual') return new Date(g.creado).toISOString().slice(0, 7) <= m ? g.monto : 0;
  if (!g.fecha) return 0;
  if (g.frecuencia === 'anual') return g.fecha.slice(5, 7) === m.slice(5, 7) && g.fecha.slice(0, 7) <= m ? g.monto : 0;
  return g.fecha.slice(0, 7) === m ? g.monto : 0;
}
function barraGastos() {
  if (enAdmin) return '';
  if (YO && YO.grupo !== 'Programador') {
    const p = YO.permisos || {};
    if (!p.oficina_gastos || !p.oficina_creacion) return '';
  }
  return `<div class="pestanas"><button class="pestana ${gastosTab === 'negocio' ? 'activa' : ''}" data-gastos-tab="negocio">💸 Gastos del negocio</button><button class="pestana ${gastosTab === 'creacion' ? 'activa' : ''}" data-gastos-tab="creacion">🏗️ Creación del sistema · socios</button><button class="pestana ${gastosTab === 'resumen' ? 'activa' : ''}" data-gastos-tab="resumen">📊 Resumen del mes</button></div>`;
}
// Gasto mensual estimado: fijos por mes (mensuales + anuales ÷ 12) + IA del mes llevada a 30 días si el mes no ha terminado.
function estimadoMes() {
  const fijos = Number((D.totales.gastosFijos || {})['US$']) || 0;
  const ia = Number((D.totales.ia || {})['US$']) || 0;
  const esteMes = mes === hoy().slice(0, 7), dia = Number(hoy().slice(8, 10)) || 1;
  const diasMes = new Date(Number(mes.slice(0, 4)), Number(mes.slice(5, 7)), 0).getDate();
  return Math.round((fijos + (esteMes ? ia / dia * diasMes : ia)) * 100) / 100;
}
function administracionDe(g) { return g.administracion || 'kaizen'; }
function admin(clave) { return (D.administraciones || []).find(a => a.clave === clave) || { clave, nombre: clave === 'centralia' ? 'Centralia' : 'Kaizen IA' }; }
function barraAdmin() {
  return `<div class="pestanas">${permitidasAdmin().map(c => `<button class="pestana ${adminVista === c ? 'activa' : ''}" data-admin="${c}">${esc(admin(c).nombre)}</button>`).join('')}</div>`;
}
function vGastos() {
  if (gastosTab === 'creacion') return vCreacion();
  if (gastosTab === 'resumen') return vResumen();
  if (!permitidasAdmin().includes(adminVista)) adminVista = permitidasAdmin()[0] || 'kaizen';
  const gastosAdmin = D.gastos.filter(g => administracionDe(g) === adminVista);
  const ia = D.empresas.filter(e => !e.es_demo && (e.administracion || 'kaizen') === adminVista);
  const mesAdmin = {}, porCat = {};
  for (const g of gastosAdmin) { const v = gastoDelMes(g, mes); if (v) { mesAdmin[g.moneda] = (mesAdmin[g.moneda] || 0) + v; if (g.moneda === 'US$') porCat[g.categoria] = (porCat[g.categoria] || 0) + v; } }
  const iaMes = ia.reduce((t, e) => t + (e.ia && e.ia.delMes && !e.ia.repetida ? e.ia.delMes : 0), 0);
  if (iaMes) { mesAdmin['US$'] = (mesAdmin['US$'] || 0) + iaMes; porCat.ia = (porCat.ia || 0) + iaMes; }
  // Ingresos cobrados del mes de las empresas de esta administración (pagos marcados como pagados ese mes).
  const empresaDe = id => D.empresas.find(e => e.id === id);
  const ingresos = (D.pagos || []).reduce((t, p) => {
    const e = empresaDe(p.empresa_id);
    if (!e || (e.administracion || 'kaizen') !== adminVista || !p.pagado_el || p.pagado_el.slice(0, 7) !== mes || p.moneda !== 'US$') return t;
    return t + (Number(p.monto) || 0);
  }, 0);
  const gastoMesUS = mesAdmin['US$'] || 0;
  const utilidad = Math.round((ingresos - gastoMesUS) * 100) / 100;
  // Centralia reparte 60/40 con su socio. Kaizen IA no reparte: todo es tuyo.
  const reparto = adminVista === 'centralia'
    ? `<div class="kpi" style="border-color:var(--verde)"><div class="e">Reparto 60 / 40 · ${esc(D.nombreMes)}</div><div class="n">Tú ${dinero(Math.round(utilidad * 0.6 * 100) / 100)}</div><div class="d">Socio ${dinero(Math.round(utilidad * 0.4 * 100) / 100)} · utilidad ${dinero(utilidad)} (cobrado − gastos)</div></div>`
    : `<div class="kpi" style="border-color:var(--verde)"><div class="e">Utilidad 100% tuya · ${esc(D.nombreMes)}</div><div class="n">${dinero(utilidad)}</div><div class="d">cobrado − gastos · sin reparto</div></div>`;
  const fijos = gastosAdmin.reduce((s, g) => s + (g.activo && g.frecuencia === 'mensual' ? g.monto : g.activo && g.frecuencia === 'anual' ? g.monto / 12 : 0), 0);
  const maxCat = Math.max(1, ...Object.values(porCat));
  const a = admin(adminVista), otra = adminVista === 'kaizen' ? 'centralia' : 'kaizen';
  const empresas = D.empresas.filter(e => !e.es_demo && (e.administracion || 'kaizen') === adminVista);
  return cabecera('💸 Gastos', 'Cada administración tiene sus propios gastos, datos y empresas', selectorMes() + `<button class="btn" data-nuevo-gasto>+ Gasto</button>`) + barraGastos() + barraAdmin() + `
  <div class="kpis">
    <div class="kpi" style="border-color:var(--rojo)"><div class="e">Gastos de ${esc(a.nombre)} · ${esc(D.nombreMes)}</div><div class="n">${totalTexto(mesAdmin)}</div><div class="d">lo que toca pagar este mes</div></div>
    <div class="kpi"><div class="e">Fijos por mes</div><div class="n">${dinero(Math.round(fijos * 100) / 100)}</div><div class="d">mensuales + anuales ÷ 12</div></div>
    <div class="kpi"><div class="e">Cobrado · ${esc(D.nombreMes)}</div><div class="n">${dinero(Math.round(ingresos * 100) / 100)}</div><div class="d">pagos recibidos de ${esc(a.nombre)}</div></div>
    ${reparto}
    <div class="kpi" style="border-color:var(--verde)"><div class="e">Gastos activos</div><div class="n">${gastosAdmin.filter(g => g.activo).length}</div><div class="d">de ${esc(a.nombre)}</div></div>
  </div>
  <div class="rej r21">
    <div class="caja">
      <h2 style="display:flex;justify-content:space-between;align-items:center;gap:8px">Datos de ${esc(a.nombre)}<span style="display:flex;gap:6px">${a.socio_porcentaje > 0 ? '<button class="btn-mini" data-retiro-socio>Retiro del socio</button>' : ''}<button class="btn-mini" data-editar-admin="${adminVista}">Editar</button></span></h2>
      <div style="display:flex;gap:14px;align-items:center;margin:6px 0 10px">${a.logo ? `<img src="${a.logo}" alt="Logo de ${esc(a.nombre)}" style="max-width:150px;max-height:60px;object-fit:contain">` : '<div style="width:150px;height:56px;border:1px dashed var(--suave);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--suave)">Sin logo</div>'}<small style="color:var(--suave)">Sale en los recibos de ${esc(a.nombre)}.</small></div>
      <table><tbody>
        <tr><td>Nombre legal</td><td>${esc(a.legal || '—')}</td></tr>
        <tr><td>Documento fiscal</td><td>${esc(a.documento || '—')}</td></tr>
        <tr><td>Dirección</td><td>${esc(a.direccion || '—')}</td></tr>
        <tr><td>Correo y teléfono</td><td>${esc([a.correo, a.telefono].filter(Boolean).join(' · ') || '—')}</td></tr>
        <tr><td>Web</td><td>${esc(a.web || '—')}</td></tr>
        <tr><td>Socio</td><td>${esc(a.socio_nombre || '—')} · ${Number(a.socio_porcentaje) || 0}% de la utilidad</td></tr>
      </tbody></table>
    </div>
    <div class="caja"><h2>Empresas de ${esc(a.nombre)}</h2><p class="sub">Cada empresa pertenece a una sola administración.</p>
      ${empresas.length ? empresas.map(x => `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #e5e7eb"><b>${esc(x.nombre)}</b><button class="btn-mini" data-mover-empresa="${x.id}:${otra}">Pasar a ${esc(admin(otra).nombre)}</button></div>`).join('') : '<div class="vacio">Todavía no hay empresas en esta administración.</div>'}
    </div>
  </div>
  <div class="caja"><h2>Recibos de ${esc(a.nombre)}</h2><p class="sub">Cada administración numera sus recibos por separado.</p>
    ${(D.recibos || []).some(r => r.administracion === adminVista) ? `<table><thead><tr><th>Nº</th><th>Fecha</th><th>Tipo</th><th>Quién</th><th class="n">Monto</th><th></th></tr></thead><tbody>
      ${(D.recibos || []).filter(r => r.administracion === adminVista).slice(0, 50).map(r => `<tr><td>${String(r.numero).padStart(4, '0')}</td><td>${fechaCorta(r.fecha)}</td><td>${r.tipo === 'socio' ? 'Retiro de socio' : 'Pago de cliente'}</td><td>${esc(r.tipo === 'socio' ? (r.socio || 'Socio') : (r.empresa || '—'))}</td><td class="n">${dinero(r.monto, r.moneda)}</td><td><button class="btn-mini" data-recibo="${r.id}">Ver / imprimir</button></td></tr>`).join('')}
    </tbody></table>` : '<div class="vacio">Todavía no hay recibos en esta administración.</div>'}
  </div>
  <div class="rej r21">
    <div class="caja"><h2>Lista de gastos</h2><p class="sub">Toca Editar para cambiar el monto o pausar un gasto que ya no pagas</p>
      ${gastosAdmin.length ? `<table><thead><tr><th>Gasto</th><th>Categoría</th><th class="n">Monto</th><th>Cada</th><th>Cuándo</th><th class="n">En ${esc(D.nombreMes.split(' ')[0])}</th><th></th></tr></thead><tbody>
      ${gastosAdmin.map(g => `<tr class="${g.activo ? '' : 'apagado'}"><td class="envolver"><b>${g.url ? `<a href="${esc(g.url)}" target="_blank" rel="noopener">${esc(g.nombre)}</a>` : esc(g.nombre)}</b>${g.empresa || g.nota ? `<br><small style="color:var(--suave)">${esc([g.empresa && 'Cliente: ' + g.empresa, g.nota].filter(Boolean).join(' · '))}</small>` : ''}</td>
        <td><span class="chip az">${esc(D.categorias[g.categoria] || g.categoria)}</span></td><td class="n">${dinero(g.monto, g.moneda)}</td>

      </tbody></table>` : `<div class="vacio">Todavía no hay gastos. Toca <b>+ Gasto</b> y agrega cada gasto del mes, por ejemplo:<br>servidor · hosting de la página web · publicidad en Meta · dominio (cada año) · Chatwoot · n8n…<br>Se suman solos en "Fijos por mes".</div>`}
    </div>
    <div class="caja"><h2>Por categoría</h2><p class="sub">${esc(D.nombreMes)} · US$</p>

    </div>
  </div>
  <div class="caja"><h2 style="display:flex;justify-content:space-between;align-items:center;gap:8px">🤖 IA por cliente (OpenRouter)<span style="display:flex;gap:8px;align-items:center;font-size:12px;font-weight:500;color:var(--suave)">${D.leido ? 'Actualizado ' + new Date(D.leido).toLocaleTimeString('es-DO', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + '' : ''}<button class="btn-mini" data-ia-fresco title="Preguntar a OpenRouter ahora">↻ Actualizar</button>${sinVivo().length ? '<button class="btn-mini" data-nueva-recarga>+ Recarga</button>' : ''}</span></h2><p class="sub">Se mide con la clave de OpenRouter de cada cliente · ponla en Clientes → Editar · si varios comparten clave, su gasto se cuenta una sola vez · <b>Recargado y saldo salen en vivo de OpenRouter</b> (se actualiza solo cada minuto) · no se suman a los gastos</p>

    </tbody></table>
    ${P && P.recargas.length && sinVivo().length ? `<details style="margin-top:10px"><summary style="cursor:pointer;font-size:13px;color:var(--suave)">Recargas anotadas a mano (${P.recargas.length}) · solo se usan si OpenRouter no da el saldo</summary><table style="margin-top:6px"><thead><tr><th>Fecha</th><th>Cliente</th><th class="n">Monto</th><th>Nota</th><th></th></tr></thead><tbody>
      ${P.recargas.map(r => `<tr><td>${fechaCorta(r.fecha)}</td><td>${esc((D.empresas.find(e => e.id === r.empresa_id) || {}).nombre || '—')}</td><td class="n">${dinero(r.monto)}</td><td class="envolver">${esc(r.nota)}</td><td><button class="btn-mini" data-editar-recarga="${r.id}">Editar</button></td></tr>`).join('')}</tbody></table></details>` : ''}
  </div>`;
}

/* ---------- Gastos → Creación del sistema (solo Christian y su socio; no se suma a los gastos del negocio) ---------- */
const redondo = n => Math.round((Number(n) || 0) * 100) / 100;

// Recargas de OpenRouter de un cliente: saldo = recargado − lo que lleva gastado la clave; días = saldo ÷ gasto diario del mes.
function celdasRecarga(e) {
  const x = e.ia || {};
  const dia = Number(hoy().slice(8, 10)) || 1;
  const porDia = x.delMes ? x.delMes / (mes === hoy().slice(0, 7) ? dia : 30) : 0;
  const duracion = saldo => {
    const dias = porDia > 0 && saldo > 0 ? Math.floor(saldo / porDia) : null;
    return saldo <= 0 ? '<span class="chip mal">sin saldo</span>' : dias !== null && dias < 7 ? `<span class="chip mal">~${dias} días</span>` : dias !== null ? `<span class="chip ok">~${dias} días</span>` : '';
  };
  // En vivo: lo que dice OpenRouter de la cuenta (total recargado y total gastado).
  if (x.cuenta) return `<td class="n" title="Total recargado en la cuenta de OpenRouter (en vivo)">${dinero(x.cuenta.recargado)} <span class="chip az" title="Leído de OpenRouter hace menos de un minuto">en vivo</span></td><td class="n" title="Gastado en la cuenta: ${dinero(x.cuenta.usado)}">${dinero(x.cuenta.saldo)} ${duracion(x.cuenta.saldo)}</td>`;
  // Si OpenRouter no da el saldo con esta clave: lo anotado a mano con "+ Recarga".
  const recs = P ? P.recargas.filter(r => r.empresa_id === e.id) : [];
  const aviso = x.cuentaError ? `<br><small style="color:var(--suave)">${esc(x.cuentaError)}</small>` : '';
  if (!recs.length) return `<td class="n" style="color:var(--suave)">—${aviso}</td><td class="n">${x.tiene ? `<a href="#" data-nueva-recarga="${e.id}">anotar recarga</a>` : ''}</td>`;
  const recargado = redondo(recs.reduce((a, r) => a + r.monto, 0));
  if (!x.tiene || x.error || x.total === undefined || x.total === null) return `<td class="n">${dinero(recargado)}</td><td class="n" style="color:var(--suave)">falta la clave</td>`;
  const saldo = redondo(recargado - x.total);
  return `<td class="n">${dinero(recargado)} <span class="chip ojo" title="Anotado a mano con + Recarga">a mano</span>${aviso}</td><td class="n">${dinero(saldo)} ${duracion(saldo)}</td>`;
}
function cuentasCreacion(p) {
  const comision = redondo(p.cobrado * p.comision_pct / 100);
  const neto = redondo(p.cobrado - comision);
  const esAdelanto = g => g.categoria === 'adelanto';
  // Gastos de creación (los adelantos de ganancia no son costo del sistema).
  const costos = p.gastos.filter(g => !esAdelanto(g));
  const gastos = redondo(costos.reduce((a, g) => a + g.monto, 0));
  // Gastos para todos: se descuentan antes de repartir.
  const compartidos = redondo(costos.filter(g => g.para_socio == null).reduce((a, g) => a + g.monto, 0));
  const queda = redondo(neto - compartidos);
  // Lo que realmente queda para los socios: cobro neto, menos todos los gastos y todos los adelantos.
  const adelantosTotal = redondo(p.gastos.filter(esAdelanto).reduce((a, g) => a + g.monto, 0));
  const quedaTotal = redondo(neto - gastos - adelantosTotal);
  // Gastos y adelantos para una persona: solo se descuentan de su parte.
  const socios = (p.socios || []).map((s, i) => {
    const parte = redondo(queda * s.pct / 100);
    const gastosA = redondo(costos.filter(g => g.para_socio === i).reduce((a, g) => a + g.monto, 0));
    const adelantos = redondo(p.gastos.filter(g => esAdelanto(g) && g.para_socio === i).reduce((a, g) => a + g.monto, 0));
    return { ...s, parte, gastosA, adelantos, monto: redondo(parte - gastosA - adelantos) };
  });
  const activos = p.mensuales.filter(m => m.activo);
  const alMes = m => m.frecuencia === 'anual' ? redondo(m.monto / 12) : m.monto;
  const fijo = redondo(activos.filter(m => m.frecuencia !== 'variable').reduce((a, m) => a + alMes(m), 0));
  const variables = activos.filter(m => m.frecuencia === 'variable');
  // Gasto de IA medido este mes para el cliente de este sistema (con su clave de OpenRouter).
  const emp = D && p.cliente ? D.empresas.find(e => e.nombre.toLowerCase().includes(p.cliente.toLowerCase()) || p.cliente.toLowerCase().includes(e.nombre.toLowerCase())) : null;
  const iaMes = emp && emp.ia && emp.ia.delMes ? redondo(emp.ia.delMes) : 0;
  const variable = redondo(variables.reduce((a, m) => a + (m.categoria === 'ia' && iaMes ? iaMes : m.monto), 0));
  return { comision, neto, gastos, compartidos, queda, quedaTotal, adelantos: adelantosTotal, socios, fijo, variables, iaMes, emp, variable, total: redondo(fijo + variable), alMes };
}

const ICONOS_EVENTO = { tarea: '🛠️', demo: '🎯', cita: '📞', cobro: '💳', otro: '📌' };
function itemsCalendario(m) {
  const items = [];
  for (const p of D.pagos) if (p.vence.slice(0, 7) === m) items.push({ fecha: p.vence, icono: p.pagado_el ? '✅' : '💳', titulo: `${p.pagado_el ? 'Pagado' : 'Cobro'} ${p.empresa || ''} ${dinero(p.monto, p.moneda)}`, detalle: p.concepto, clase: p.pagado_el ? 'ok' : p.estado === 'vencido' ? 'mal' : 'az', pago: p.id, listo: !!p.pagado_el });
  for (const g of D.gastos) {
    if (!g.activo) continue;
    let f = null;
    if (g.frecuencia === 'mensual') f = `${m}-${String(Math.min(28, g.dia || 1)).padStart(2, '0')}`;
    else if (g.frecuencia === 'anual' && g.fecha && g.fecha.slice(5, 7) === m.slice(5, 7) && g.fecha.slice(0, 7) <= m) f = m + g.fecha.slice(7);
    else if (g.frecuencia === 'unico' && g.fecha && g.fecha.slice(0, 7) === m) f = g.fecha;
    if (f) items.push({ fecha: f, icono: '💸', titulo: `${g.nombre} ${dinero(g.monto, g.moneda)}`, detalle: D.categorias[g.categoria], clase: 'ojo', gasto: g.id });
  }
  for (const ev of D.eventos) if (ev.fecha.slice(0, 7) === m) items.push({ fecha: ev.fecha, hora: ev.hora, icono: ICONOS_EVENTO[ev.tipo] || '📌', titulo: ev.titulo, detalle: [ev.empresa, ev.nota].filter(Boolean).join(' · '), clase: ev.tipo === 'demo' ? 'mor' : 'ok', evento: ev.id, hecho: ev.hecho });
  return items;
}
function vCalendario() {
  mesCal = mesCal || hoy().slice(0, 7);
  return cabecera('📅 Calendario', 'Cobros y gastos aparecen solos · toca un día para agregar una tarea, demo o cita',
    `<button class="btn-sec" data-cal="-1">‹</button><b style="min-width:150px;text-align:center">${esc(nombreMes(mesCal))}</b><button class="btn-sec" data-cal="1">›</button><button class="btn-sec" data-cal="0">Hoy</button><button class="btn" data-nuevo-evento="${hoy()}">+ Tarea</button>`) +

}
async function pintarCalendario() {
  // El calendario puede mostrar otro mes: si no está en los datos cargados, se piden.
  if (mesCal.slice(0, 7) !== D.mes && !(D.eventos.some(e => e.fecha.slice(0, 7) === mesCal))) {
    const r = await api('/api/oficina/datos?mes=' + mesCal);
    if (r.ok) D = { ...D, eventos: r.data.eventos, pagos: r.data.pagos };
  }
  const items = itemsCalendario(mesCal);
  const primero = new Date(mesCal + '-01T12:00:00Z');
  const inicio = new Date(primero); inicio.setUTCDate(1 - primero.getUTCDay());
  const h = hoy();
  let html = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'].map(d => `<div class="dn">${d}</div>`).join('');
  for (let i = 0; i < 42; i++) {
    const d = new Date(inicio); d.setUTCDate(inicio.getUTCDate() + i);
    const f = d.toISOString().slice(0, 10);
    if (i >= 35 && f.slice(0, 7) !== mesCal) break;
    const del = items.filter(x => x.fecha === f).sort((a, b) => (a.hora || '').localeCompare(b.hora || ''));
    html += `<div class="d ${f.slice(0, 7) !== mesCal ? 'fuera' : ''} ${f === h ? 'hoy' : ''}" data-dia="${f}"><b>${d.getUTCDate()}</b>
      ${del.map(x => `<span class="ev chip ${x.clase} ${x.hecho ? 'hecho' : ''}" title="${esc(x.titulo + (x.detalle ? ' · ' + x.detalle : ''))}" ${x.evento ? `data-editar-evento="${x.evento}"` : x.pago ? `data-editar-pago="${x.pago}"` : x.gasto ? `data-editar-gasto="${x.gasto}"` : ''}>${x.icono} ${x.hora ? esc(x.hora) + ' ' : ''}${esc(x.titulo)}</span>`).join('')}</div>`;
  }
  const cal = document.getElementById('cal'); if (cal) cal.innerHTML = html;
}

function calcularROI(m) {
  const n = Math.max(1, m.conversaciones - m.errores);
  const tasaVenta = m.ventas / n, tasaHumano = (m.ventas + m.asesor) / n;
  const costoIA = ROI.conv * m.costo_promedio;
  const sinIA = Math.ceil(ROI.conv / Math.max(1, ROI.capSin));
  const conIA = Math.max(1, Math.ceil(ROI.conv * tasaHumano / Math.max(1, ROI.capCierre)));
  const ahorro = (sinIA - conIA) * ROI.asesor - costoIA;
  const ventas = ROI.conv * tasaVenta;
  return { tasaVenta, tasaHumano, costoIA, sinIA, conIA, ahorro, roi: costoIA ? ahorro / costoIA : 0, ventas,
    porVenta: ventas ? costoIA / ventas : 0, pctVentas: ventas && ROI.ticket ? costoIA / (ventas * ROI.ticket) : 0 };
}

async function accionEntrenamiento(accion, id) {
  let cuerpo = { id: Number(id) };
  if (accion === 'proponer') {
    const t = document.getElementById('entTexto').value.trim();
    if (!t) return aviso('Escribe la regla.');
    cuerpo = { texto: t, medio: 'texto' };
  }
  if (accion === 'editar') {
    const actual = ENT.reglas.find(x => x.id === Number(id));
    const nuevo = prompt('Cambia la regla:', actual ? actual.texto : '');
    if (!nuevo || !nuevo.trim()) return;
    cuerpo.texto = nuevo.trim();
  }
  const url = accion === 'proponer' ? '/api/entrenamiento/proponer' : '/api/entrenamiento/' + accion;
  const r = await api(url, cuerpo);
  if (!r.ok) return aviso(r.data.error || 'No se pudo guardar.');
  ENT = null;
  pintar();
}

let DIAG = null, DIAGDias = 30, DIAGEmp = null, DIAGCargando = false;
function htmlDiagnosticoRedes() {
  const botones = [7, 30, 90].map(d => `<button class="btn-mini ${DIAGDias === d ? 'p' : ''}" data-k="r-diag" data-dias="${d}">${d} días</button>`).join('');
  const cab = `<div class="cab"><div><h2>📊 Diagnóstico: conversaciones y gasto en tokens</h2><p class="sub">Cuántas conversaciones y mensajes tuvo cada red (de Chatwoot) y cuánto costaría que el asistente conteste todo. Si una red tiene dos páginas, se suman.</p></div><div style="display:flex;gap:6px;align-items:center">${botones}</div></div>`;
  if (DIAGCargando) return `<div class="caja">${cab}<div class="vacio">⏳ Contando conversaciones en Chatwoot…</div></div>`;
  if (!DIAG || DIAGEmp !== kEmpresa) return `<div class="caja">${cab}<div class="vacio">Elige el periodo (7, 30 o 90 días) para calcular.</div></div>`;
  if (DIAG.error) return `<div class="caja">${cab}<div class="vacio">${esc(DIAG.error)}</div></div>`;
  const n = v => v === null || v === undefined ? '—' : Number(v).toLocaleString('es-DO');
  const redes = {};
  for (const f of DIAG.filas) { const r = redes[f.red] = redes[f.red] || { red: f.red, filas: [], conversaciones: 0, mensajes: 0, respuestas: 0, medido: 0, mes: 0, aprox: false }; r.filas.push(f); r.conversaciones += f.conversaciones || 0; r.mensajes += f.mensajes || 0; r.respuestas += f.respuestas_asistente; r.medido += f.costo_medido; r.mes += f.costo_mes; r.aprox = r.aprox || f.aproximado; }
  const lista = Object.values(redes).sort((a, b) => b.mes - a.mes);
  const tot = lista.reduce((a, r) => ({ conv: a.conv + r.conversaciones, msg: a.msg + r.mensajes, med: a.med + r.medido, mes: a.mes + r.mes }), { conv: 0, msg: 0, med: 0, mes: 0 });
  return `<div class="caja">${cab}
    <div class="kpis">
      <div class="kpi"><div class="e">Conversaciones · ${DIAG.dias} días</div><div class="n">${n(tot.conv)}</div><div class="d">todas las redes de ${esc(K.empresa.nombre)}</div></div>
      <div class="kpi"><div class="e">Mensajes de clientes</div><div class="n">${n(tot.msg)}</div><div class="d">cada uno sería una respuesta del asistente</div></div>
      <div class="kpi" style="border-color:var(--ambar)"><div class="e">Costo por respuesta</div><div class="n">US$ ${DIAG.costo_por_respuesta.toFixed(4)}</div><div class="d">${esc(DIAG.fuente)}</div></div>

function textoBonito(lineas) {

  let html = '', lista = false;

    if (/^#{1,6}\s/.test(t)) { cerrarLista(); html += `<h4>${enlazar(t.replace(/^#+\s*/, ''))}</h4>`; continue; }

      const c = t.replace(/^[-•*]\s*/, '');

      if (/^[^:;]{2,40}:\s[^;]+;\s/.test(c)) html += `<li class="ficha-l">${c.split(/;\s+/).map(p => { const m = p.match(/^([^:]{2,40}):\s*(.*)$/); return m ? `<span><i>${esc(m[1])}</i> ${enlazar(m[2])}</span>` : `<span>${enlazar(p)}</span>`; }).join('')}</li>`;

      continue;

function base64De(archivo) {
  return new Promise((ok, mal) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = () => mal(r.error); r.readAsDataURL(archivo); });
}
async function subirArchivos(lista) {
  const validos = [...lista].filter(f => /\.(xlsx|xlsm|pdf|xls|docx)$/i.test(f.name) && !f.name.startsWith('~$'));
  const dest = destinoSubida();
  const omitidos = lista.length - validos.length;
  const prog = document.getElementById('kProgreso');
  const errores = [];
  for (let i = 0; i < validos.length; i++) {
    const f = validos[i];
    if (prog) prog.textContent = `Subiendo ${i + 1} de ${validos.length}: ${f.name}…`;
    if (f.size > 15 * 1024 * 1024) { errores.push(`${f.name}: pesa más de 15 MB`); continue; }
    const r = await api('/api/oficina/conocimiento/subir', { empresa_id: kEmpresa, nombre: f.name, datos: await base64De(f), ...dest });
    if (!r.ok) errores.push(`${f.name}: ${r.data.error || 'error'}`);
  }
  await ir('conocimiento');
  const p = document.getElementById('kProgreso');
  if (p) p.innerHTML = `${validos.length - errores.length} archivo(s) subido(s)${omitidos ? ` · ${omitidos} ignorado(s) (no son Excel, PDF ni Word)` : ''}.` + (errores.length ? `<br><span style="color:var(--rojo)">${errores.map(esc).join('<br>')}</span>` : '');
}

/* ---------- Formularios ---------- */
function opcionesEmpresa(elegida, vacio = 'Ninguno (general)') {
  return [`<option value="">${vacio}</option>`].concat(D.empresas.map(e => `<option value="${e.id}" ${Number(elegida) === e.id ? 'selected' : ''}>${esc(e.nombre)}</option>`)).join('');
}
function opciones(obj, elegida) { return Object.entries(obj).map(([k, v]) => `<option value="${k}" ${k === elegida ? 'selected' : ''}>${esc(v)}</option>`).join(''); }
function campo(id, etiqueta, control, ayuda = '') { return `<div class="campo"><label for="${id}">${etiqueta}</label>${control}${ayuda ? `<div class="ay">${ayuda}</div>` : ''}</div>`; }
const v = id => (document.getElementById(id) || {}).value || '';
// Toda ventana lleva arriba a la derecha: minimizar, agrandar y cerrar (X). Nada de botones "Cerrar".
function controlesVentana() { return `<div class="ctl-v"><button data-v="min" title="Minimizar">&#8212;</button><button data-v="max" title="Agrandar">&#9633;</button><button data-v="x" class="x" title="Cerrar">&#10005;</button></div>`; }
function abrirModal(html) {
  const m = document.getElementById('modal');
  m.classList.remove('ancho', 'grande');
  m.innerHTML = controlesVentana() + html;
  m.querySelectorAll('[data-cerrar-modal]').forEach(b => { if (/^\s*cerrar\s*$/i.test(b.textContent)) b.remove(); });
  m.querySelectorAll('.pie').forEach(p => { if (!p.querySelector('button, a')) p.remove(); });
  document.getElementById('vMin').style.display = 'none';
  document.getElementById('fondoModal').classList.add('abierto');
  const p = document.querySelector('#modal input, #modal select, #modal textarea'); if (p) p.focus();
}
function cerrarModal() { document.getElementById('fondoModal').classList.remove('abierto'); document.getElementById('modal').classList.remove('grande'); document.getElementById('vMin').style.display = 'none'; }
document.addEventListener('click', e => {
  const b = e.target.closest('.ctl-v [data-v]'); if (!b) return;
  const m = document.getElementById('modal');
  if (b.dataset.v === 'x') return cerrarModal();
  if (b.dataset.v === 'max') { m.classList.toggle('grande'); b.innerHTML = m.classList.contains('grande') ? '&#10697;' : '&#9633;'; b.title = m.classList.contains('grande') ? 'Volver al tamaño normal' : 'Agrandar'; return; }
  if (b.dataset.v === 'min') {
    const t = (m.querySelector('h2') || {}).textContent || 'Ventana';
    document.getElementById('fondoModal').classList.remove('abierto');
    const c = document.getElementById('vMin'); c.querySelector('span').textContent = t.trim().slice(0, 60); c.style.display = 'flex';
  }
});
document.addEventListener('click', e => {
  const c = e.target.closest('#vMin'); if (!c) return;
  if (e.target.closest('[data-vmin-x]')) return cerrarModal();
  c.style.display = 'none'; document.getElementById('fondoModal').classList.add('abierto');
});
function pieModal(borrar) { return `<div class="error-form" id="errForm"></div><div class="pie">${borrar ? `<button class="btn-sec izq" id="fBorrar" style="color:var(--rojo)">Borrar</button>` : ''}<button class="btn-sec" data-cerrar-modal>Cancelar</button><button class="btn" id="fGuardar">Guardar</button></div>`; }
async function enviarForm(url, cuerpo, ok) {
  const r = await api(url, cuerpo);
  if (!r.ok) { document.getElementById('errForm').textContent = r.data.error || 'No se pudo guardar.'; return false; }
  cerrarModal(); aviso(ok); await ir(vista); return true;
}
function conBorrar(tipo, id, texto) {
  const b = document.getElementById('fBorrar');
  if (b) b.onclick = async () => { if (!confirm(texto)) return; await enviarForm(`/api/oficina/borrar/${tipo}`, { id }, 'Borrado.'); };
}

// ---------- APIs y suscripciones (solo Programador) ----------

    (avisos.length ? `<div class="ay" style="margin-top:8px">⚠ ${avisos.map(x => `${esc(x.nombre)}: ${x.aviso === 'vencido' ? 'venció' : 'vence pronto'}`).join(' · ')}</div>` : '') + '</div>' +
    `<div class="caja"><table><thead><tr><th>Servicio</th><th>Tipo</th><th>Plan</th><th>Costo/mes</th><th>Límite</th><th>Renovación</th><th>Llave</th><th>Estado</th><th></th></tr></thead><tbody>${APIS.map(x => `<tr><td><b>${esc(x.nombre)}</b><div class="ay">${esc(x.proveedor || '')}</div></td><td>${esc(x.tipo)}</td><td>${esc(x.plan)}</td><td>${dinero(x.costo_mensual, 'US$')}</td><td>${x.limite_mes ?? '—'}</td><td>${esc(x.renovacion || '—')}</td><td>${x.llave_fin ? '••••' + esc(x.llave_fin) : '<span class="ay">sin llave</span>'}</td><td>${estado(x)}</td><td><button class="btn-mini" data-editar-api="${x.id}">Editar</button></td></tr>`).join('') || '<tr><td colspan="9" class="vacio">Todavía no hay servicios registrados para esta empresa.</td></tr>'}</tbody></table></div>`;
}
function formApi(a = {}) {
  abrirModal(`<h2>${a.id ? 'Editar servicio' : 'Nuevo servicio'}</h2>
    ${campo('aNom', 'Nombre', `<input id="aNom" value="${esc(a.nombre || '')}" placeholder="Ej.: AeroDataBox">`)}
    <div class="fila2">${campo('aTip', 'Tipo', `<select id="aTip">${TIPOS_API.map(t => `<option ${t === (a.tipo || 'Otro') ? 'selected' : ''}>${t}</option>`).join('')}</select>`)}${campo('aPro', 'Proveedor', `<input id="aPro" value="${esc(a.proveedor || '')}" placeholder="Ej.: RapidAPI">`)}</div>
    <div class="fila2">${campo('aPla', 'Plan', `<select id="aPla">${['Gratis', 'Prueba', 'Pago'].map(t => `<option ${t === (a.plan || 'Gratis') ? 'selected' : ''}>${t}</option>`).join('')}</select>`)}${campo('aCos', 'Costo al mes (US$)', `<input id="aCos" type="number" step="0.01" min="0" value="${a.costo_mensual ?? 0}">`)}</div>
    <div class="fila2">${campo('aLim', 'Límite de uso al mes', `<input id="aLim" type="number" min="0" value="${a.limite_mes ?? ''}" placeholder="Sin límite">`)}${campo('aRen', 'Renovación', `<input id="aRen" type="date" value="${esc(a.renovacion || '')}">`)}</div>
    ${campo('aEmp', 'Empresa', `<select id="aEmp">${opcionesEmpresa(a.empresa_id ?? apisEmpresa, 'General (Kaizen)')}</select>`)}
    ${campo('aLla', 'Llave', `<input id="aLla" type="password" autocomplete="off" placeholder="${a.llave_fin ? '•••• ' + a.llave_fin + ' (escribe para cambiarla)' : 'Pega la llave aquí'}">`, 'Se guarda cifrada. Nunca se muestra completa.')}

// ---------- Apps (solo Programador): PWA instalables, pruebas con código y publicación ----------
let APPS = [], INICIOS_APP = {};
async function cargarApps() { const r = await api('/api/oficina/apps'); if (r.ok) { APPS = r.data.apps; INICIOS_APP = r.data.inicios || {}; } }
function vApps() {
  const publicadas = APPS.filter(a => a.estado === 'publicada').length;
  const probadores = APPS.reduce((s, a) => s + a.probadores.filter(p => p.vigente).length, 0);
  return cabecera('📱 Apps', 'Crea, prueba con un código y publica las apps que se instalan en el celular', '<button class="btn" data-nueva-app>+ App</button>') +
    `<div class="caja"><div class="fila2"><div><b>${APPS.length}</b> app(s) · <b>${publicadas}</b> publicada(s)</div><div style="text-align:right"><b>${probadores}</b><div class="ay">probadores con acceso vigente</div></div></div></div>` +
    (APPS.length ? APPS.map(tarjetaApp).join('') : '<div class="caja ay">Todavía no hay apps. Crea una con «+ App».</div>');
}
function tarjetaApp(a) {
  const url = `${location.origin}/app/${a.slug}/`;
  const pub = a.estado === 'publicada';
  const probs = a.probadores.length
    ? `<table><thead><tr><th>Probador</th><th>Código</th><th>Vence</th><th>Último uso</th><th>Estado</th><th></th></tr></thead><tbody>${a.probadores.map(p => `<tr><td>${esc(p.nombre)}</td><td>••••${esc(p.codigo_fin)}</td><td>${esc(p.vence)}</td><td>${esc(p.ultimo_uso || '—')}</td><td>${p.vigente ? '<b>Activo</b>' : 'Vencido o quitado'}</td><td>${p.activo ? `<button class="btn-sec" data-revocar-probador="${p.id}">Quitar</button>` : ''}</td></tr>`).join('')}</tbody></table>`
    : '<div class="ay">Nadie tiene acceso de prueba todavía.</div>';
  return `<div class="caja">
    <div class="fila2"><div style="display:flex;gap:12px;align-items:center"><span style="display:inline-grid;place-items:center;width:44px;height:44px;border-radius:10px;background:${esc(a.color)};color:#fff;font-weight:700">${esc(a.letra)}</span><div><b>${esc(a.nombre)}</b><div class="ay">${esc(INICIOS_APP[a.inicio] || a.inicio)} · v${esc(a.version)}</div></div></div>
    <div style="text-align:right"><b>${pub ? 'Publicada' : 'En prueba'}</b>${pub && a.publicada_en ? `<div class="ay">desde ${esc(a.publicada_en)}</div>` : ''}</div></div>
    <div class="ay" style="margin:8px 0">Enlace: <a href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a></div>
    ${a.accesos.length ? `<div class="ay">Accesos directos: ${a.accesos.map(x => esc(x.nombre)).join(' · ')}</div>` : ''}
    ${probs}
    <div class="pie" style="margin-top:10px">
      <button class="btn-sec" data-editar-app="${a.id}">Editar</button>
      <button class="btn-sec" data-nuevo-probador="${a.id}">+ Probador</button>
      <button class="btn" data-publicar-app="${a.id}" data-publicar="${pub ? '0' : '1'}">${pub ? 'Volver a prueba' : 'Publicar'}</button>
    </div></div>`;
}
function formApp(a = {}) {
  abrirModal(`<h2>${a.id ? 'Editar app' : 'Nueva app'}</h2>
    ${campo('apNom', 'Nombre', `<input id="apNom" value="${esc(a.nombre || '')}" placeholder="Ej.: Choferes Somos Viajes">`)}
    ${campo('apDes', 'Descripción', `<input id="apDes" value="${esc(a.descripcion || '')}" placeholder="Qué hace y para quién">`)}
    <div class="fila2">${campo('apIni', 'Pantalla que abre', `<select id="apIni">${Object.entries(INICIOS_APP).map(([k, n]) => `<option value="${k}" ${k === (a.inicio || '/chofer') ? 'selected' : ''}>${esc(n)} (${k})</option>`).join('')}</select>`)}${campo('apEmp', 'Empresa', `<select id="apEmp">${opcionesEmpresa(a.empresa_id ?? 0, 'General (Kaizen)')}</select>`)}</div>
    <div class="fila2">${campo('apCol', 'Color', `<input id="apCol" type="color" value="${esc(a.color || '#0c1a2e')}">`)}${campo('apLet', 'Letra del icono', `<input id="apLet" maxlength="2" value="${esc(a.letra || '')}" placeholder="Automática">`)}</div>
    ${campo('apAcc', 'Accesos directos', `<textarea id="apAcc" rows="3" placeholder="Nombre | ruta, una por línea. Ej.: Mis servicios | /chofer">${esc((a.accesos || []).map(x => `${x.nombre} | ${x.ruta}`).join('\n'))}</textarea>`, 'Máximo 6. La ruta debe empezar igual que la pantalla que abre.')}
    ${campo('apVer', 'Versión', `<input id="apVer" value="${esc(a.version || '1.0.0')}">`)}
    ${pieModal(Boolean(a.id))}`);
  document.getElementById('fGuardar').onclick = () => {
    const accesos = document.getElementById('apAcc').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => { const [nombre, ...r] = l.split('|'); return { nombre: nombre.trim(), ruta: r.join('|').trim() }; });
    enviarForm('/api/oficina/apps/guardar', { id: a.id, nombre: v('apNom'), descripcion: v('apDes'), inicio: v('apIni'), empresa_id: v('apEmp'), color: v('apCol'), letra: v('apLet'), version: v('apVer'), accesos }, 'Guardado.');
  };
  if (a.id) document.getElementById('fBorrar').onclick = async () => { if (!confirm('¿Borrar esta app y sus códigos de prueba?')) return; await enviarForm('/api/oficina/apps/borrar', { id: a.id }, 'Borrado.'); };
}
function formProbador(app) {
  abrirModal(`<h2>Probador de «${esc(app.nombre)}»</h2>
    ${campo('prNom', 'Nombre de la persona', '<input id="prNom" placeholder="Ej.: Juan, chofer Punta Cana">')}
    ${campo('prDia', 'Días de acceso', '<input id="prDia" type="number" min="1" max="365" value="30">', 'Pasado este tiempo el acceso deja de funcionar solo.')}
    <div class="error-form" id="errForm"></div>
    <div class="pie"><button class="btn-sec" data-cerrar-modal>Cancelar</button><button class="btn" id="fGuardar">Crear código</button></div>`);
  document.getElementById('fGuardar').onclick = async () => {
    const r = await api('/api/oficina/apps/probador', { app_id: app.id, nombre: v('prNom'), dias: v('prDia') });
    if (!r.ok) { document.getElementById('errForm').textContent = r.data.error || 'No se pudo crear.'; return; }
    abrirModal(`<h2>Código creado</h2><p>Mándale este enlace a la persona. El código solo se muestra ahora.</p>
      <div class="campo"><label>Enlace</label><input readonly value="${esc(location.origin + r.data.enlace)}" onclick="this.select()"></div>
      <div class="campo"><label>Código</label><input readonly value="${esc(r.data.codigo)}" onclick="this.select()"></div>
      <div class="ay">Vence el ${esc(r.data.vence)}.</div>
      <div class="pie"><button class="btn" data-cerrar-modal>Listo</button></div>`);
    await cargarApps(); ir('apps', false);
  };
}
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-nueva-app],[data-editar-app],[data-nuevo-probador],[data-publicar-app],[data-revocar-probador]');
  if (!b) return;
  ev.preventDefault();
  const d = b.dataset;
  if ('nuevaApp' in d) return formApp();
  if (d.editarApp) return formApp(APPS.find(x => String(x.id) === d.editarApp) || {});
  if (d.nuevoProbador) return formProbador(APPS.find(x => String(x.id) === d.nuevoProbador));
  if (d.publicarApp) {
    const pub = d.publicar === '1';
    if (pub && !confirm('¿Publicar esta app? Cualquiera con el enlace podrá instalarla.')) return;
    const r = await api('/api/oficina/apps/publicar', { id: Number(d.publicarApp), publicar: pub });
    if (!r.ok) return aviso(r.data.error || 'No se pudo cambiar.');
    await cargarApps(); return ir('apps', false);
  }
  if (d.revocarProbador) {
    if (!confirm('¿Quitar el acceso de esta persona?')) return;
    const r = await api('/api/oficina/apps/probador/revocar', { id: Number(d.revocarProbador) });
    if (!r.ok) return aviso(r.data.error || 'No se pudo quitar.');
    await cargarApps(); return ir('apps', false);
  }
});

// ---------- Integraciones (solo Programador): llaves de la API para sistemas externos ----------
let INTEG = { llaves: [], empresa: '' }, integEmpresa = 0;
async function cargarIntegraciones() { const r = await api('/api/oficina/integraciones?empresa=' + integEmpresa); if (r.ok) INTEG = r.data; }
function vIntegraciones() {
  const vigentes = (INTEG.llaves || []).filter(x => x.vigente).length;
  const tabla = !integEmpresa ? '<div class="caja ay">Elige una empresa para ver sus sistemas conectados.</div>'
    : !INTEG.llaves.length ? '<div class="caja ay">Esta empresa no tiene sistemas conectados.</div>'
    : `<div class="caja"><table><thead><tr><th>Sistema</th><th>Llave</th><th>Alcance</th><th>Vence</th><th>Último uso</th><th>Estado</th><th></th></tr></thead><tbody>${INTEG.llaves.map(x => `<tr><td><b>${esc(x.nombre)}</b></td><td>••••${esc(x.fin)}</td><td>${esc(INTEG.alcances && INTEG.alcances[x.alcance] || x.alcance)}</td><td>${esc(x.vence)}</td><td>${esc(x.ultimo_uso || '—')}</td><td>${x.vigente ? '<b>Activa</b>' : 'Vencida o revocada'}</td><td>${x.activo ? `<button class="btn-sec" data-revocar-integracion="${x.id}">Revocar</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`;
  return cabecera('🔌 Integraciones', 'Llaves para que otros sistemas lean reservas y operaciones. Solo lectura.', '<button class="btn" data-nueva-integracion>+ Conectar sistema</button>') +
    `<div class="caja"><div class="fila2"><div class="campo" style="margin:0"><label for="integEmp">Empresa</label><select id="integEmp" onchange="integEmpresa=Number(this.value)||0;cargarIntegraciones().then(()=>ir('integraciones',false))">${opcionesEmpresa(integEmpresa, 'Elige una empresa')}</select></div><div style="text-align:right"><b>${vigentes}</b><div class="ay">llaves vigentes en esta empresa</div></div></div></div>` + tabla;
}
function formIntegracion() {
  abrirModal(`<h2>Conectar sistema</h2>
    ${campo('inNom', 'Nombre del sistema', '<input id="inNom" placeholder="Ej.: Nombre del sistema">')}
    ${campo('inEmp', 'Empresa', `<select id="inEmp">${opcionesEmpresa(integEmpresa, 'Elige una empresa')}</select>`)}
    ${campo('inDia', 'Días de vigencia', '<input id="inDia" type="number" min="1" max="365" value="365">')}
    <div class="ay">Solo lectura de reservas y servicios. No incluye precios, costos ni datos de contacto.</div>
    <div class="error-form" id="errForm"></div>
    <div class="pie"><button class="btn-sec" data-cerrar-modal>Cancelar</button><button class="btn" id="fGuardar">Crear llave</button></div>`);
  document.getElementById('fGuardar').onclick = async () => {
    const eid = Number(v('inEmp')) || 0;
    const r = await api('/api/oficina/integraciones/crear', { empresa_id: eid, nombre: v('inNom'), alcance: 'reservas:leer', dias: v('inDia') });
    if (!r.ok) { document.getElementById('errForm').textContent = r.data.error || 'No se pudo crear.'; return; }
    abrirModal(`<h2>Llave creada</h2><p>Cópiala ahora. No se vuelve a mostrar completa.</p>
      <div class="campo"><label>Llave</label><input readonly value="${esc(r.data.clave)}" onclick="this.select()"></div>
      <div class="ay">Empresa: ${esc(r.data.empresa)} · vence el ${esc(r.data.vence)}</div>
      <div class="pie"><button class="btn" data-cerrar-modal>Listo</button></div>`);
    integEmpresa = eid; await cargarIntegraciones(); ir('integraciones', false);
  };
}
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-nueva-integracion],[data-revocar-integracion]');
  if (!b) return;
  ev.preventDefault();
  if ('nuevaIntegracion' in b.dataset) return formIntegracion();

    ${campo('fArchV', 'Comprobante del pago total (PDF, PNG, JPG o WEBP, menos de 2 MB)', `<input id="fArchV" type="file" accept="application/pdf,image/png,image/jpeg,image/webp">`, 'Se guarda una sola vez, con el primer recibo.')}
    <div class="error-form" id="errForm"></div><div class="pie"><button class="btn-sec" data-cerrar-modal>Cancelar</button><button class="btn" id="fGuardar">Confirmar y generar recibos</button></div>`);

    await ir(vista);
  };
}

  const id = Number(c.dataset.selCobro);
  if (c.checked) selCobros.add(id); else selCobros.delete(id);
  pintar();
});
function formEvento(ev = {}, fecha) {
  abrirModal(`<h2>${ev.id ? 'Editar' : 'Nueva tarea, demo o cita'}</h2>
    ${campo('fTit', '¿Qué hay que hacer?', `<input id="fTit" value="${esc(ev.titulo || '')}" placeholder="Ej.: Demo con Caribe Tours">`)}
    <div class="fila2">${campo('fFec', 'Fecha', `<input id="fFec" type="date" value="${esc(ev.fecha || fecha || hoy())}">`)}${campo('fHora', 'Hora (opcional)', `<input id="fHora" type="time" value="${esc(ev.hora || '')}">`)}</div>
    <div class="fila2">${campo('fTipo', 'Tipo', `<select id="fTipo">${opciones(D.tiposEvento, ev.tipo || 'tarea')}</select>`)}${campo('fEmp', 'Cliente (opcional)', `<select id="fEmp">${opcionesEmpresa(ev.empresa_id, 'Ninguno')}</select>`)}</div>
    ${campo('fNota', 'Nota (opcional)', `<textarea id="fNota" rows="3" placeholder="Ej.: por Zoom, llevar precios">${esc(ev.nota || '')}</textarea>`)}
    ${ev.id ? `<div class="campo chk"><label><input type="checkbox" id="fHecho" ${ev.hecho ? 'checked' : ''}> Ya está hecho</label></div>` : ''}
    ${pieModal(ev.id)}`);
  document.getElementById('fGuardar').onclick = () => enviarForm('/api/oficina/guardar/eventos', { id: ev.id, titulo: v('fTit'), fecha: v('fFec'), hora: v('fHora'), tipo: v('fTipo'), empresa_id: v('fEmp'), nota: v('fNota'), hecho: ev.id ? document.getElementById('fHecho').checked : false }, 'Guardado en el calendario.');
  conBorrar('eventos', ev.id, '¿Borrar esta tarea del calendario?');
}
/* ---------- Automatizaciones: clientes de redes sociales (su flujo de n8n y su Chatwoot) ---------- */
const REDES_AUTO = [['facebook', 'Facebook', '#1877f2'], ['instagram', 'Instagram', '#e1306c'], ['whatsapp', 'WhatsApp', '#25d366'], ['messenger', 'Messenger', '#0084ff'],
  ['tiktok', 'TikTok', '#111827'], ['telegram', 'Telegram', '#229ed9'], ['web', 'Chat web', '#64748b'], ['google', 'Google', '#ea4335']];
const ESTADO_AUTO = { activo: ['● Activo', 'ok'], prueba: ['● En prueba', 'ojo'], pausado: ['● Pausado', 'gris'] };
function cajaAutomatizaciones() {
  const l = D.automatizaciones || [];
  const tarjeta = a => `<div class="auto">
    <div class="auto-c"><div class="ic" style="background:${colorDe(a.nombre)}22">🤖</div><div class="min"><b>${esc(a.nombre)}</b><small>${a.contacto ? esc(a.contacto) : 'automatización de redes'}</small></div>
      <span class="chip ${ESTADO_AUTO[a.estado][1]}">${ESTADO_AUTO[a.estado][0]}</span><button class="editar" data-editar-auto="${a.id}" title="Editar">✏️</button></div>
    ${(a.redes || []).length ? `<div class="auto-r">${a.redes.map(r => { const x = REDES_AUTO.find(y => y[0] === r) || [r, r, '#64748b']; return `<span style="--c:${x[2]}">${esc(x[1])}</span>`; }).join('')}</div>` : ''}
    <div class="auto-a">${a.flujo_url ? `<a class="btn-mini" href="${esc(a.flujo_url)}" target="_blank" rel="noopener">⚙️ Flujo (n8n)</a>` : '<span class="sin">sin flujo</span>'}
      ${a.chat_url ? `<a class="btn-mini p" href="${esc(a.chat_url)}" target="_blank" rel="noopener">💬 Chatwoot</a>` : '<span class="sin">sin Chatwoot</span>'}
      ${(a.enlaces || []).map(e => `<a class="btn-mini" href="${esc(e.u)}" target="_blank" rel="noopener">🔗 ${esc(e.n)}</a>`).join('')}</div>
    ${a.nota ? `<small class="auto-n">${esc(a.nota)}</small>` : ''}</div>`;
  return `<div class="caja"><div class="cab"><div><h2>🤖 Automatizaciones</h2><p class="sub">Clientes de automatización de redes sociales · su flujo y su panel de chat</p></div><button class="btn-mini" data-nuevo-auto>+ Cliente</button></div>
    ${l.length ? `<div class="autos">${l.map(tarjeta).join('')}</div>` : '<div class="vacio">Todavía no hay clientes de automatización. Toca "+ Cliente".</div>'}</div>`;
}
function formAuto(a = {}) {
  const redes = a.redes || [];
  abrirModal(`<h2>${a.id ? esc(a.nombre) : 'Nuevo cliente de automatización'}</h2>
    <div class="fila2">${campo('aNom', 'Cliente', `<input id="aNom" value="${esc(a.nombre || '')}" placeholder="Ej.: Pizzería Don Luis">`)}
      ${campo('aEst', 'Estado', `<select id="aEst">${Object.entries(ESTADO_AUTO).map(([k, [n]]) => `<option value="${k}" ${(a.estado || 'activo') === k ? 'selected' : ''}>${n.replace('● ', '')}</option>`).join('')}</select>`)}</div>
    <div class="campo"><label>Redes que se automatizan</label><div class="auto-chk">${REDES_AUTO.map(([k, n]) => `<label><input type="checkbox" data-red-auto="${k}" ${redes.includes(k) ? 'checked' : ''}> ${n}</label>`).join('')}</div></div>
    ${campo('aFlujo', 'Flujo de n8n', `<input id="aFlujo" value="${esc(a.flujo_url || '')}" placeholder="https://…/workflow/123">`, 'Abre el flujo de este cliente en n8n.')}
    ${campo('aChat', 'Su panel de Chatwoot', `<input id="aChat" value="${esc(a.chat_url || '')}" placeholder="https://…/app/accounts/5/dashboard">`, 'La cuenta o bandeja de Chatwoot donde se trabajan sus conversaciones.')}
    ${campo('aMas', 'Otros accesos (uno por línea: Nombre | dirección)', `<textarea id="aMas" rows="3" placeholder="Meta Business | https://business.facebook.com/...
Google Drive | https://drive.google.com/...">${esc((a.enlaces || []).map(e => e.n + ' | ' + e.u).join('\n'))}</textarea>`)}
    <div class="fila2">${campo('aCont', 'Contacto', `<input id="aCont" value="${esc(a.contacto || '')}" placeholder="Nombre y teléfono">`)}${campo('aNota', 'Nota', `<input id="aNota" value="${esc(a.nota || '')}" placeholder="Ej.: paga el 5 de cada mes">`)}</div>
    ${pieModal(a.id)}`);
  document.getElementById('fGuardar').onclick = () => enviarForm('/api/oficina/guardar/automatizaciones', {
    id: a.id, nombre: v('aNom'), estado: v('aEst'), redes: [...document.querySelectorAll('[data-red-auto]:checked')].map(c => c.dataset.redAuto),
    flujo_url: v('aFlujo'), chat_url: v('aChat'), contacto: v('aCont'), nota: v('aNota'),
    enlaces: v('aMas').split('\n').map(l => l.split('|')).filter(p => p.length >= 2).map(([n, ...u]) => ({ n: n.trim(), u: u.join('|').trim() }))
  }, 'Cliente guardado.');
  conBorrar('automatizaciones', a.id, '¿Borrar este cliente de automatización?');
}
function formEnlace(x = {}) {
  const grupos = [...new Set(D.enlaces.map(e => e.grupo).concat(['Infraestructura', 'Mis redes', 'Cobros', 'Mi negocio']))];
  abrirModal(`<h2>${x.id ? 'Editar enlace' : 'Nuevo enlace' + (x.grupo ? ' en ' + esc(x.grupo) : '')}</h2>
    <div class="fila2">${campo('fNom', 'Nombre', `<input id="fNom" value="${esc(x.nombre || '')}" placeholder="Ej.: Instagram de Kaizen">`)}${campo('fIco', 'Ícono (emoji)', `<input id="fIco" value="${esc(x.icono || '🔗')}" maxlength="4">`)}</div>
    ${campo('fUrl', 'Dirección', `<input id="fUrl" value="${esc(x.url || '')}" placeholder="https://instagram.com/kaizenia">`)}
    ${campo('fGru', 'Grupo', `<input id="fGru" list="listaGrupos" value="${esc(x.grupo || 'Mis redes')}"><datalist id="listaGrupos">${grupos.map(g => `<option value="${esc(g)}">`).join('')}</datalist>`, 'Escribe uno nuevo o elige uno de la lista.')}
    ${campo('fNota', 'Descripción (opcional)', `<input id="fNota" value="${esc(x.nota || '')}">`)}
    <div class="campo chk"><label><input type="checkbox" id="fVig" ${x.vigilar ? 'checked' : ''}> Vigilar: revisar cada minuto que responda y avisarme si se cae</label></div>
    ${pieModal(x.id)}`);
  document.getElementById('fGuardar').onclick = () => enviarForm('/api/oficina/guardar/enlaces', { id: x.id, nombre: v('fNom'), icono: v('fIco'), url: v('fUrl'), grupo: v('fGru'), nota: v('fNota'), vigilar: document.getElementById('fVig').checked }, 'Enlace guardado.');
  conBorrar('enlaces', x.id, '¿Borrar este enlace?');
}
function formCliente(e) {
  const p = e.pago || {};
  abrirModal(`<h2>${esc(e.nombre)}</h2>
    ${campo('fPlan', 'Plan', `<input id="fPlan" value="${esc(e.plan || '')}" placeholder="Ej.: Completo, Básico">`)}
    <div class="campo chk"><label><input type="checkbox" id="fCobrar" ${p.activo ? 'checked' : ''}> Cobrar una mensualidad (con recordatorio en su panel)</label></div>
    <div class="fila2">${campo('fCuota', 'Cuota mensual', `<input id="fCuota" type="number" step="0.01" min="0" value="${esc(String(p.monto || '').replace(/[^0-9.]/g, ''))}" placeholder="150">`)}${campo('fDia', 'Día de cobro (1 a 28)', `<input id="fDia" type="number" min="1" max="28" value="${p.dia || 5}">`)}</div>
    ${campo('fMone', 'Moneda', `<select id="fMone">${['US$', 'RD$', '€'].map(m => `<option ${m === (p.moneda || 'US$') ? 'selected' : ''}>${m}</option>`).join('')}</select>`, 'El recordatorio en su panel, los días de aviso y los textos se ajustan en Empresas y demo → Cobro y recordatorio.')}
    <div class="fila2">${campo('fCont', 'Persona de contacto', `<input id="fCont" value="${esc(e.contacto || '')}" placeholder="Ej.: Juan Pérez (gerente)">`)}${campo('fTel', 'Teléfono / WhatsApp', `<input id="fTel" value="${esc(e.telefono || '')}" placeholder="+1 809 000 0000">`)}</div>
    ${campo('fMail', 'Correo de contacto', `<input id="fMail" value="${esc(e.correo_contacto || '')}">`)}
    ${campo('fIa', 'Clave de OpenRouter de este cliente (para medir su gasto de IA)', `<input id="fIa" type="password" autocomplete="off" placeholder="${e.tieneClaveIA ? '•••• guardada · déjalo vacío para no cambiarla' : 'sk-or-v1-…'}">`,
      e.externa ? 'Es la misma que está en su config.js. Créala en openrouter.ai → Keys (una por cliente) y ponle un límite.' : (e.tieneClaveIA && !e.claveIAPropia ? 'Se está usando la clave de su config.js. Solo pon una aquí si quieres medir con otra.' : 'Crea una en openrouter.ai → Keys (una por cliente) y ponle un límite.'))}
    ${e.claveIAPropia ? '<div class="campo chk"><label><input type="checkbox" id="fBorrarIa"> Quitar la clave guardada aquí</label></div>' : ''}
    ${campo('fN8n', 'Clave de la API de n8n (para ver si su flujo de correo está encendido)', `<input id="fN8n" type="password" autocomplete="off" placeholder="${e.tieneN8n ? '•••• guardada · déjalo vacío para no cambiarla' : 'Pégala aquí'}">`, 'En n8n: Settings → n8n API → Create an API key. Se manda al panel de este cliente y no se muestra completa.')}
    ${e.tieneN8n ? '<div class="campo chk"><label><input type="checkbox" id="fBorrarN8n"> Quitar la clave de n8n</label></div>' : ''}
    <div class="fila2">${campo('fCorreoUsuario', 'Correo para leer (Yahoo, Gmail u otro)', `<input id="fCorreoUsuario" value="${esc(e.correo_lectura || '')}" placeholder="nombre@yahoo.com">`)}${campo('fCorreoHost', 'Servidor IMAP', `<input id="fCorreoHost" value="${esc(e.correo_host || 'imap.mail.yahoo.com')}">`, 'Yahoo: imap.mail.yahoo.com · Gmail: imap.gmail.com')}</div>
    ${campo('fCorreoClave', 'Contraseña de aplicación del correo', `<input id="fCorreoClave" type="password" autocomplete="off" placeholder="${e.tieneCorreo ? '•••• guardada · déjalo vacío para no cambiarla' : 'Pégala aquí'}">`, 'En Yahoo: Seguridad de la cuenta → Generar contraseña de aplicación. No es la contraseña normal del correo.')}
    ${e.tieneCorreo ? '<div class="campo chk"><label><input type="checkbox" id="fBorrarCorreo"> Quitar el correo de lectura</label></div>' : ''}
    ${campo('fNotas', 'Notas', `<textarea id="fNotas" rows="3">${esc(e.notas || '')}</textarea>`)}
    ${pieModal(false)}`);
  document.getElementById('fGuardar').onclick = async () => {
    const r = await api('/api/oficina/empresa/' + e.id, { plan: v('fPlan'), contacto: v('fCont'), telefono: v('fTel'), correo_contacto: v('fMail'), notas: v('fNotas'), ia_clave: v('fIa'), borrarClave: !!(document.getElementById('fBorrarIa') || {}).checked, n8n_clave: v('fN8n'), borrarN8n: !!(document.getElementById('fBorrarN8n') || {}).checked, correo_usuario: v('fCorreoUsuario'), correo_host: v('fCorreoHost'), correo_clave: v('fCorreoClave'), borrarCorreo: !!(document.getElementById('fBorrarCorreo') || {}).checked });
    if (!r.ok) { document.getElementById('errForm').textContent = r.data.error || 'No se pudo guardar.'; return; }
    const cambioCobro = !!p.activo !== document.getElementById('fCobrar').checked || String(p.monto || '') !== v('fCuota') || Number(p.dia || 5) !== Number(v('fDia')) || (p.moneda || 'US$') !== v('fMone');
    if (cambioCobro) {
      const r2 = await api(`/api/central/empresas/${e.id}/pago`, { ...p, activo: document.getElementById('fCobrar').checked, monto: v('fCuota'), dia: Number(v('fDia')), moneda: v('fMone'), diasAntes: p.diasAntes ?? 3 });
      if (!r2.ok) { document.getElementById('errForm').textContent = r2.data.error || 'No se pudo guardar la cuota.'; return; }
    }
    cerrarModal(); aviso(r.data.aviso || 'Cliente guardado.', !r.data.aviso); ir(vista);
  };
}

/* ---------- Eventos ---------- */
const buscar = (lista, id) => lista.find(x => String(x.id) === String(id));
document.addEventListener('click', async ev => {
  const t = ev.target.closest('[data-ir],[data-ayuda],[data-nuevo-pago],[data-editar-pago],[data-pagado],[data-deshacer],[data-nuevo-gasto],[data-editar-gasto],[data-nuevo-evento],[data-editar-evento],[data-hecho],[data-nuevo-enlace],[data-nueva-seccion],[data-nueva-api],[data-editar-api],[data-editar-enlace],[data-nuevo-auto],[data-editar-auto],[data-editar-cliente],[data-filtro-pagos],[data-cal],[data-dia],[data-chat-usuario],[data-cerrar-modal],[data-datos-cliente],[data-estado-cliente],[data-pagar-cobro],[data-recibo],[data-retiro-socio],[data-ver-comprobante],[data-recargar]');
  if (!t) return;
  if (t.tagName === 'A' && !t.dataset.ir && !t.dataset.editarCliente) return;
  if (t.hasAttribute('data-nueva-api')) return formApi();
  if (t.hasAttribute('data-editar-api')) return formApi(APIS.find(x => String(x.id) === t.dataset.editarApi) || {});
  ev.preventDefault();
  const d = t.dataset;
  if (d.ir) return ir(d.ir);
  if ('ayuda' in d) return document.getElementById('cajaAyuda').classList.toggle('abierta');
  if ('cerrarModal' in d) return cerrarModal();
  if ('recargar' in d) { await cargarNegocios(); return pintar(); }
  if ('nuevoPago' in d) return formPago();
  if (d.editarPago) { const p = buscar(D.pagos, d.editarPago); return p && formPago(p); }
  if (d.pagado) { const p = buscar(D.pagos, d.pagado); return p && formPagado(p); }
  if (d.deshacer) { if (!confirm('¿Marcar este cobro como NO pagado?')) return; await api('/api/oficina/pagado', { id: d.deshacer, deshacer: true }); aviso('Listo.'); return ir(vista); }
  if ('nuevoGasto' in d) return formGasto();
  if (d.editarGasto) { const g = buscar(D.gastos, d.editarGasto); return g && formGasto(g); }
  if (d.nuevoEvento) return formEvento({}, d.nuevoEvento);
  if (d.editarEvento) { const e = buscar(D.eventos, d.editarEvento); return e && formEvento(e); }
  if (d.hecho) { await api('/api/oficina/evento-hecho', { id: d.hecho, hecho: true }); aviso('Marcado como hecho.'); return ir(vista); }
  if ('nuevoEnlace' in d) return formEnlace(d.grupo ? { grupo: d.grupo } : {});
  if ('nuevoAuto' in d) return formAuto();
  if (d.editarAuto) { const a = buscar(D.automatizaciones || [], d.editarAuto); return a && formAuto(a); }
  if ('nuevaSeccion' in d) { const n = (prompt('Nombre de la sección nueva (ej.: Mis redes, Proveedores, Bancos):') || '').trim(); if (n) formEnlace({ grupo: n.slice(0, 60) }); return; }
  if (d.editarEnlace) { const x = buscar(D.enlaces, d.editarEnlace); return x && formEnlace(x); }
  if (d.editarCliente) { const e = buscar(D.empresas, d.editarCliente); return e && formCliente(e); }
  if (d.datosCliente) { const e = buscar(D.empresas, d.datosCliente); return e && formDatosCliente(e); }
  if (d.estadoCliente) { const e = buscar(D.empresas, d.estadoCliente); return e && formEstado(e); }
  if (d.pagarCobro) return formPagar(d.pagarCobro);
  if (d.recibo) return abrirRecibo(d.recibo);
  if ('retiroSocio' in d) return formRetiro();
  if (d.verComprobante) return verComprobante(d.verComprobante);
  if (d.filtroPagos) { filtroPagos = d.filtroPagos; return pintar(); }
  if (d.cal) { mesCal = d.cal === '0' ? hoy().slice(0, 7) : mesMas(mesCal, Number(d.cal)); return pintar(); }
  if (d.dia) return formEvento({}, d.dia);
  if (d.chatUsuario) return abrirChatCon(d.chatEmpresa, d.chatUsuario, d.chatNombre);
});
document.addEventListener('change', e => { if (e.target.id === 'selMes') { mes = e.target.value; ir(vista); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') cerrarModal();
  if (e.target.id === 'chatTexto' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviarChat(); }
});
document.addEventListener('click', e => { if (e.target.id === 'chatEnviar') enviarChat(); if (e.target.id === 'fondoModal') cerrarModal(); });
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-k="respaldar"]');
  if (!b) return;
  b.disabled = true; b.textContent = '⏳ Empezando…';
  const r = await api('/api/oficina/respaldo', {});
  if (!r.ok) { alert(r.data.error || 'No se pudo empezar el respaldo.'); }
  setTimeout(async () => { await cargarRespaldo(); if (vista === 'respaldos') pintar(); }, 1500);
});
document.getElementById('btnMenu').onclick = () => document.getElementById('lateral').classList.toggle('abierto');
document.getElementById('btnSalir').onclick = async () => { await api('/api/logout', {}); location.href = '/'; };
document.getElementById('btnTema').onclick = () => { const o = document.body.classList.toggle('oscuro'); document.querySelectorAll('.tema-switch:not(#btnTemaChatOf)').forEach(b => { b.classList.toggle('on', o); b.title = o ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'; }); try { localStorage.setItem('tema', o ? 'oscuro' : 'claro'); } catch (e) {} };
document.getElementById('btnTema').classList.toggle('on', document.body.classList.contains('oscuro'));
document.addEventListener('click', e => {
  if (e.target.closest('#btnTemaChatOf')) {
    const w = document.getElementById('waChat'); if (!w) return;
    w.classList.toggle('oscuro-chat'); const oscuro = w.classList.contains('oscuro-chat');
    document.getElementById('btnTemaChatOf').classList.toggle('on', oscuro);
    try { localStorage.setItem('temaChatOf', oscuro ? 'oscuro' : 'claro'); } catch (er) {}
    return;
  }
  const bn = e.target.closest('[data-negocio-btn]');
  if (bn) {
    const id = Number(bn.dataset.negocioBtn);
    if (chatAbiertos.has(id)) chatAbiertos.delete(id); else chatAbiertos.add(id);
    pintarListaChat();
    const el = document.querySelector(`[data-negocio="${id}"]`);
    if (el && chatAbiertos.has(id)) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
});


/* ---------- Arranque ---------- */
(async () => {
  try { if (localStorage.getItem('tema') === 'oscuro') document.body.classList.add('oscuro'); } catch (e) {}
  const s = await api('/api/sesion');
  if (!s.ok || !s.data.central || (s.data.grupo !== 'Programador' && !(s.data.permisos || {}).ver_oficina)) { location.href = '/'; return; }
  YO = s.data;
  // Quien no es Programador (p. ej. el socio) solo ve las secciones que le dieron.
  document.querySelectorAll('aside .nav[data-ir]').forEach(b => { b.style.display = puedeSec(b.dataset.ir) ? '' : 'none'; });
  if (YO.grupo !== 'Programador') { document.querySelectorAll('aside .sep').forEach(x => { if (/administrar/i.test(x.textContent)) x.style.display = 'none'; }); if (!puedeSec('gastos') || !(YO.permisos || {}).oficina_gastos) gastosTab = 'creacion'; }
  mes = hoy().slice(0, 7);
  let inicial = 'inicio';
  try { inicial = localStorage.getItem('oficinaVista') || 'inicio'; } catch (e) {}
  const pedida = new URLSearchParams(location.search).get('ir'); if (pedida) inicial = pedida;
  await ir(['inicio', 'negocios', 'clientes', 'gastos', 'calendario', 'chat', 'enlaces', 'conocimiento', 'redes', 'respaldos', 'empresas', 'herramientas'].includes(inicial) && puedeSec(inicial) ? inicial : primeraSec());
  if (puedeSec('chat')) cargarChatContactos();
  // Se mantiene al día solo: lo de la pantalla cada minuto, el chat cada pocos segundos.
  setInterval(async () => {
    if (document.hidden || document.getElementById('fondoModal').classList.contains('abierto')) return;
    if (['inicio', 'negocios'].includes(vista)) { if (vista === 'inicio') { await cargarDatos(); await cargarServicios(); } await cargarNegocios(); pintar(); }
  }, 60000);
  setInterval(() => { if (!document.hidden && puedeSec('chat')) { cargarChatContactos(); if (vista === 'chat' && chatSel) cargarConversacion(false); } }, 5000);
  // Latido para que el central sepa que sigues conectado.
  const latido = () => api('/api/latido', { activo: true });
  latido(); setInterval(latido, 60000);
})();
</script>
